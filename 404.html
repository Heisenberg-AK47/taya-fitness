<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Taya Fitness</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <style>
    .error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 2rem; }
    .error-code { font-size: 6rem; font-weight: 700; color: var(--accent, #e8ff00); line-height: 1; margin-bottom: 1rem; }
    .error-msg { font-size: 1.4rem; color: #fff; margin-bottom: 0.5rem; }
    .error-sub { color: #aaa; margin-bottom: 2rem; }
    .error-btn { display: inline-block; background: var(--accent, #e8ff00); color: #000; padding: 0.9rem 2rem; border-radius: 999px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<main>
  <div class="error-page">
    <div class="error-code">404</div>
    <p class="error-msg">Cette page n'existe plus.</p>
    <p class="error-sub">Tu cherches peut-être nos offres de coaching ?</p>
    <a href="/" class="error-btn">Retour à l'accueil</a>
  </div>
</main>
<div id="footer-placeholder"></div>
<script type="module" src="/js/navbar.js"></script>
<script type="module">
  import { initFooter } from '/footer.js';
  initFooter();
</script>
</body>
</html>
