    // ── Clients Azeoo ─────────────────────────────────────────────────────────

      const [filterGrp,setFilterGrp] = useState('');

      const filtered = AZEOO_CLIENTS.filter(c=>{
        const s = search.toLowerCase();
        return (!s || c.nom.toLowerCase().includes(s) || c.email.toLowerCase().includes(s))
          && (!filterObj || c.objectif===filterObj)
          && (!filterGrp || c.groupe===filterGrp);
      });
      const groupes = [...new Set(AZEOO_CLIENTS.map(c=>c.groupe))].sort();
      const objectifs = [...new Set(AZEOO_CLIENTS.map(c=>c.objectif).filter(o=>o!=='—'))].sort();

          h('div',null,

            h('p',{style:{color:C.muted,fontSize:14,marginTop:4}},`${AZEOO_CLIENTS.length} clients · importés depuis tayafitness.azeoo.com`)

        h('div',{style:{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}},

          h('select',{style:{...inp,width:180},value:filterObj,onChange:e=>setFilterObj(e.target.value)},
            h('option',{value:''},'Tous objectifs'),
            ...objectifs.map(o=>h('option',{key:o,value:o},o))

          h('select',{style:{...inp,width:160},value:filterGrp,onChange:e=>setFilterGrp(e.target.value)},
            h('option',{value:''},'Tous groupes'),
            ...groupes.map(g=>h('option',{key:g,value:g},g))
          )
        ),
        // Stats row
        h('div',{style:{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap'}},
          ...Object.entries({'Lose Weight':C.blue,'Build Muscle':C.green,'Sculpt Your Body':C.gold,'Get Fit':C.purple}).map(([obj,color])=>{
            const n=AZEOO_CLIENTS.filter(c=>c.objectif===obj).length;
            return h('div',{key:obj,style:{background:`${color}15`,border:`1px solid ${color}33`,borderRadius:8,padding:'8px 14px',fontSize:12}},

              h('span',{style:{color:C.white,fontWeight:600}},obj),
              h('span',{style:{color:C.muted,marginLeft:6}},n)
            );
          })
        ),
        // Table
        h('div',{style:card},
          h('table',{style:{width:'100%',borderCollapse:'collapse'}},
            h('thead',null,h('tr',null,
              ...['Client','Email','App','Groupe','Objectif','Niveau'].map(l=>h('th',{key:l,style:th},l))
            )),
            h('tbody',null,...filtered.map((c,i)=>h('tr',{key:i,style:{background:i%2?'rgba(255,255,255,0.01)':'transparent'}},
              h('td',{style:td},h('div',{style:{fontWeight:500}},c.nom)),
              h('td',{style:{...td,color:C.muted,fontSize:12}},c.email),
              h('td',{style:{...td,fontSize:12}},

                c.app.includes('Android') && h('span',null,'🤖')

              h('td',{style:td},c.groupe!=='—'?h('span',{style:badge(C.purple)},c.groupe):'—'),
              h('td',{style:td},c.objectif!=='—'?h('span',{style:badge(goalColors[c.objectif]||C.muted)},c.objectif):'—'),
              h('td',{style:td},c.niveau!=='—'?h('span',{style:badge(niveauColors[c.niveau]||C.muted)},c.niveau):'—')

    // ── Programmes ────────────────────────────────────────────────────────────
    function Programmes() {
      const ADMIN = ['fumeysarah@yahoo.fr','contact@sergepaulmier.com','contact@tayafitness.com'];
      const [progs,setProgs] = useState([]);
      const [loading,setLoading] = useState(true);
      const [isAdmin,setIsAdmin] = useState(false);
      const [filter,setFilter] = useState('');
      const [msg,setMsg] = useState('');
      const [saving,setSaving] = useState(false);
      const [selectedProg,setSelectedProg] = useState(null);
      const [selectedDay,setSelectedDay] = useState(null);
      const [progExos,setProgExos] = useState([]);
      const [workouts,setWorkouts] = useState([]);
      const [loadingExos,setLoadingExos] = useState(false);
      const [addExoOpen,setAddExoOpen] = useState(false);
      const [allExos,setAllExos] = useState([]);
      const [exoSearch,setExoSearch] = useState('');
      const [aForm,setAForm] = useState({exercise_id:'',week_number:1,day_number:1,order_index:1,sets:3,reps:12,rest_seconds:60,charge:'',notes:''});
      const [editExoEntry,setEditExoEntry] = useState(null);
      const [editExoForm,setEditExoForm] = useState({sets:3,reps:12,rest_seconds:60,charge:'',notes:''});
      const [editWorkoutName,setEditWorkoutName] = useState(null);
      const [workoutNameDraft,setWorkoutNameDraft] = useState('');
      const EP = {titre:'',description:'',description_courte:'',image_url:'',prix:'19.95',prix_promo:'',objectif:'Build Muscle',niveau:'intermediaire',duree_semaines:8,sexe:'tous',actif:true};
      const [createOpen,setCreateOpen] = useState(false);
      const [editProg,setEditProg] = useState(null);
      const [delProg,setDelProg] = useState(null);
      const [pForm,setPForm] = useState(EP);

      const objColors = {'Build Muscle':C.green,'Lose Weight':C.blue,'Sculpt Your Body':C.gold,'Get Fit':C.purple};
      const niveauLabels = {debutant:'Débutant',intermediaire:'Intermédiaire',avance:'Avancé'};
      const sexeLabels = {tous:'Tous',homme:'Homme',femme:'Femme'};
      const filtExos = useMemo(()=>allExos.filter(e=>!exoSearch||e.name.toLowerCase().includes(exoSearch.toLowerCase())),[allExos,exoSearch]);

      useEffect(()=>{
        sb.auth.getSession().then(({data:{session}})=>{if(session?.user)setIsAdmin(ADMIN.includes(session.user.email));});
        sb.from('programmes').select('*').order('created_at').then(({data})=>{setProgs(data||[]);setLoading(false);});
      },[]);

      async function handleCreate(){
        setSaving(true);
        const slug=pForm.titre.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
        const {data,error}=await sb.from('programmes').insert({...pForm,slug,prix:parseFloat(pForm.prix)||0,prix_promo:pForm.prix_promo?parseFloat(pForm.prix_promo):null,duree_semaines:parseInt(pForm.duree_semaines)||8}).select().single();
        if(!error&&data){setProgs(p=>[...p,data]);setCreateOpen(false);setPForm(EP);setMsg('✅ Programme créé');}
        else setMsg('❌ '+(error?.message||'Erreur'));
        setSaving(false);setTimeout(()=>setMsg(''),4000);
      }
      async function handleEditProg(){
        setSaving(true);
        const {data,error}=await sb.from('programmes').update({...editProg,prix:parseFloat(editProg.prix)||0,prix_promo:editProg.prix_promo?parseFloat(editProg.prix_promo):null,duree_semaines:parseInt(editProg.duree_semaines)||8}).eq('id',editProg.id).select().single();
        if(!error&&data){setProgs(p=>p.map(x=>x.id===data.id?data:x));if(selectedProg?.id===data.id)setSelectedProg(data);setEditProg(null);setMsg('✅ Programme mis à jour');}
        else setMsg('❌ '+(error?.message||'Erreur'));
        setSaving(false);setTimeout(()=>setMsg(''),4000);
      }
      async function handleDeleteProg(){
        setSaving(true);
        const {error}=await sb.from('programmes').delete().eq('id',delProg.id);
        if(!error){setProgs(p=>p.filter(x=>x.id!==delProg.id));if(selectedProg?.id===delProg.id)setSelectedProg(null);setDelProg(null);setMsg('✅ Supprimé');}
        else setMsg('❌ '+(error?.message||'Erreur'));
        setSaving(false);setTimeout(()=>setMsg(''),4000);
      }
      async function handleTogglePublish(prog,e){
        if(e)e.stopPropagation();
        const newActif=!prog.actif;
        const {data,error}=await sb.from('programmes').update({actif:newActif}).eq('id',prog.id).select().single();
        if(!error&&data){setProgs(p=>p.map(x=>x.id===data.id?data:x));if(selectedProg?.id===data.id)setSelectedProg(data);setMsg(newActif?'✅ Programme publié sur le site 🌐':'✅ Programme dépublié du site');}
        else setMsg('❌ '+(error?.message||'Erreur'));
        setTimeout(()=>setMsg(''),4000);
      }
      async function loadProgData(id){
        setLoadingExos(true);
        const [{data:exData},{data:wData}]=await Promise.all([
          sb.from('programme_exercises').select('*,exercise:exercises(id,name,youtube_id,image_filename,tags)').eq('programme_id',id).order('week_number').order('day_number').order('order_index'),
          sb.from('programme_workouts').select('*').eq('programme_id',id).order('week_number').order('day_number')
        ]);
        setProgExos(exData||[]);setWorkouts(wData||[]);setLoadingExos(false);
      }
      function handleSelectProg(p){setSelectedProg(p);setSelectedDay(null);loadProgData(p.id);setMsg('');}

      function calcStats(week,day){
        const exos=progExos.filter(e=>(e.week_number||1)===week&&(e.day_number||1)===day);
        const totalSets=exos.reduce((s,e)=>s+(e.sets||0),0);
        const durationSec=exos.reduce((s,e)=>s+(e.sets||0)*((parseInt(e.reps)||10)*3+(e.rest_seconds||60)),0);
        return{totalSets,totalExos:exos.length,durationMin:Math.round(durationSec/60),energy:Math.round(totalSets*9.8)};
      }
      async function saveWorkoutName(week,day,name){
        setSaving(true);
        const existing=workouts.find(w=>w.week_number===week&&w.day_number===day);
        if(existing){const{data,error}=await sb.from('programme_workouts').update({name}).eq('id',existing.id).select().single();if(!error&&data)setWorkouts(prev=>prev.map(w=>w.id===data.id?data:w));}
        else{const{data,error}=await sb.from('programme_workouts').insert({programme_id:selectedProg.id,week_number:week,day_number:day,name}).select().single();if(!error&&data)setWorkouts(prev=>[...prev,data]);}
        setSaving(false);setEditWorkoutName(null);
      }
      async function deleteWorkoutDay(week,day){
        if(!confirm(`Supprimer la séance Sem.${week}/Jour${day} ?`))return;
        setSaving(true);
        const ids=progExos.filter(e=>e.week_number===week&&e.day_number===day).map(e=>e.id);
        if(ids.length)await sb.from('programme_exercises').delete().in('id',ids);
        const wo=workouts.find(w=>w.week_number===week&&w.day_number===day);
        if(wo)await sb.from('programme_workouts').delete().eq('id',wo.id);
        setProgExos(prev=>prev.filter(e=>!(e.week_number===week&&e.day_number===day)));
        setWorkouts(prev=>prev.filter(w=>!(w.week_number===week&&w.day_number===day)));
        setSelectedDay(null);setSaving(false);
      }
      async function openAddExo(week,day){
        if(!allExos.length){const{data}=await sb.from('exercises').select('id,name,tags,image_filename,youtube_id').order('name').limit(2000);setAllExos(data||[]);}
        const wdExos=progExos.filter(e=>(e.week_number||1)===week&&(e.day_number||1)===day);
        setAddExoOpen(true);setExoSearch('');
        setAForm({exercise_id:'',week_number:week,day_number:day,order_index:wdExos.length+1,sets:3,reps:12,rest_seconds:60,charge:'',notes:''});
      }
      async function handleAddExo(){
        if(!aForm.exercise_id){setMsg('❌ Sélectionnez un exercice');return;}
        setSaving(true);
        const{data,error}=await sb.from('programme_exercises').insert({...aForm,programme_id:selectedProg.id}).select('*,exercise:exercises(id,name,youtube_id,image_filename,tags)').single();
        if(!error&&data){setProgExos(prev=>[...prev,data].sort((a,b)=>(a.week_number-b.week_number)||((a.day_number||0)-(b.day_number||0))||(a.order_index-b.order_index)));setAddExoOpen(false);setMsg('✅ Exercice ajouté');}
        else setMsg('❌ '+(error?.message||'Erreur'));
        setSaving(false);setTimeout(()=>setMsg(''),4000);
      }
      async function handleRemoveExo(peId){
        if(!confirm('Retirer cet exercice ?'))return;
        const{error}=await sb.from('programme_exercises').delete().eq('id',peId);
        if(!error)setProgExos(prev=>prev.filter(e=>e.id!==peId));
        else setMsg('❌ '+(error?.message||'Erreur'));
        setTimeout(()=>setMsg(''),4000);
      }
      function openEditExoEntry(pe){
        setEditExoEntry(pe);
        setEditExoForm({sets:pe.sets||3,reps:pe.reps||12,rest_seconds:pe.rest_seconds||60,charge:pe.charge||'',notes:pe.notes||''});
      }
      async function handleEditExoEntry(){
        if(!editExoEntry)return;
        setSaving(true);
        const{data,error}=await sb.from('programme_exercises')
          .update({sets:editExoForm.sets,reps:editExoForm.reps,rest_seconds:editExoForm.rest_seconds,charge:editExoForm.charge,notes:editExoForm.notes})
          .eq('id',editExoEntry.id).select('*,exercise:exercises(id,name,youtube_id,image_filename,tags)').single();
        if(!error&&data){setProgExos(prev=>prev.map(e=>e.id===data.id?data:e));setEditExoEntry(null);setMsg('✅ Exercice mis à jour');}
        else setMsg('❌ '+(error?.message||'Erreur'));
        setSaving(false);setTimeout(()=>setMsg(''),4000);
      }

      function pFields(data,set){
        const fi=(label,field,type='text',extra={})=>{
          const val=data[field]??'';
          const onChange=e=>set(p=>({...p,[field]:type==='number'?Number(e.target.value)||0:e.target.value}));

          if(type==='textarea')return h('div',{key:field,style:{marginBottom:10}},h('label',{style:{fontSize:10,color:C.muted,display:'block',marginBottom:3,textTransform:'uppercase',letterSpacing:'0.08em'}},label),h('textarea',{value:val,onChange,placeholder:extra.ph||'',style:{...inp,height:68,resize:'vertical'}}));
          return h('div',{key:field,style:{marginBottom:10}},h('label',{style:{fontSize:10,color:C.muted,display:'block',marginBottom:3,textTransform:'uppercase',letterSpacing:'0.08em'}},label),h('input',{type,value:val,onChange,placeholder:extra.ph||'',style:inp}));
        };
        return[
          fi('Titre *','titre','text',{ph:'Ex: Black Panther special program'}),
          fi('Description courte','description_courte','text',{ph:'Résumé en une phrase'}),
          fi('Description','description','textarea',{ph:'Description complète du programme...'}),
          fi('URL image','image_url','text',{ph:'https://cdn.azeoo.com/programs/large/...'}),
          h('div',{key:'rp',style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:0}},fi('Prix (€)','prix','number',{ph:'19.95'}),fi('Prix promo (€)','prix_promo','number',{ph:'(optionnel)'})),

            fi('Genre','sexe','select',{opts:[['tous','Tous'],['homme','Homme'],['femme','Femme']]})

                ),
                h('div',{onClick:()=>handleSelectProg(prog),style:{padding:16,cursor:'pointer'}},

                  // Mini info table (like Azeoo)
                  h('div',{style:{background:C.soft,borderRadius:8,padding:'8px 12px',marginBottom:10}},
                    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}},
                      h('div',null,h('div',{style:{fontSize:8,color:C.muted,textTransform:'uppercase',letterSpacing:'0.06em'}},'Durée'),h('div',{style:{fontSize:12,fontWeight:700,color:C.white,marginTop:2}},`${prog.duree_semaines||8} sem.`)),
                      h('div',null,h('div',{style:{fontSize:8,color:C.muted,textTransform:'uppercase',letterSpacing:'0.06em'}},'Niveau'),h('div',{style:{fontSize:12,fontWeight:700,color:C.white,marginTop:2}},niveauLabels[prog.niveau]||prog.niveau||'—')),
                      h('div',null,h('div',{style:{fontSize:8,color:C.muted,textTransform:'uppercase',letterSpacing:'0.06em'}},'Prix'),h('div',{style:{fontSize:13,fontWeight:800,color:C.gold,marginTop:2}},`${prog.prix_promo||prog.prix}€`))
                    )
                  ),
                  h('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
                    prog.objectif&&h('span',{style:{background:`${objColors[prog.objectif]||C.muted}22`,color:objColors[prog.objectif]||C.muted,fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:100}},prog.objectif),
                    prog.sexe&&prog.sexe!=='tous'&&h('span',{style:{background:`${C.muted}22`,color:C.muted,fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:100}},sexeLabels[prog.sexe])
                  )

          h('div',{style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:28,width:'100%',maxWidth:560}},

    const ADMIN_EMAILS = ['fumeysarah@yahoo.fr','contact@sergepaulmier.com','contact@tayafitness.com'];

    function Exercices() {
      const [exos,setExos] = useState([]);
      const [loading,setLoading] = useState(true);
      const [search,setSearch] = useState('');
      const [muscle,setMuscle] = useState('');
      const [mtype,setMtype] = useState('');
      const [page,setPage] = useState(0);
      const [ytModal,setYtModal] = useState(null);
      const [isAdmin,setIsAdmin] = useState(false);
      // CRUD modals
      const [addOpen,setAddOpen] = useState(false);
      const [editExo,setEditExo] = useState(null);
      const [delExo,setDelExo] = useState(null);
      const [form,setForm] = useState({name:'',youtube_id:'',tags:''});
      const [saving,setSaving] = useState(false);
      const [msg,setMsg] = useState('');

      useEffect(() => {
        sb.auth.getSession().then(({data:{session}}) => {
          if (session?.user) setIsAdmin(ADMIN_EMAILS.includes(session.user.email));
        });
        sb.from('exercises').select('*').order('name').limit(2000)
          .then(({data}) => { setExos(data||[]); setLoading(false); });
      }, []);

      const PER_PAGE = 60;
      const imgUrl = i => i ? 'https://cdn.azeoo.com/exercises/small-wide/'+i : null;

      const filtered = useMemo(() => exos.filter(e => {
        const s = search.toLowerCase();
        const tags = e.tags || [];
        return (!s || e.name.toLowerCase().includes(s))
          && (!muscle || tags.includes(muscle))
          && (!mtype || tags.includes(mtype));
      }), [exos, search, muscle, mtype]);

      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      const visible = filtered.slice(page*PER_PAGE, (page+1)*PER_PAGE);
      const resetPage = () => setPage(0);

      async function handleAdd() {
        setSaving(true);
        const tags = form.tags.split(',').map(t=>t.trim()).filter(Boolean);
        const {data,error} = await sb.from('exercises')
          .insert({name:form.name, youtube_id:form.youtube_id||null, tags})
          .select().single();
        if (!error && data) {
          setExos(prev => [...prev,data].sort((a,b)=>a.name.localeCompare(b.name)));
          setAddOpen(false); setForm({name:'',youtube_id:'',tags:''});
          setMsg('✅ Exercice ajouté');
        } else setMsg('❌ Erreur: '+(error?.message||''));
        setSaving(false); setTimeout(()=>setMsg(''),4000);
      }

      async function handleEdit() {
        setSaving(true);
        const {error} = await sb.from('exercises')
          .update({name:editExo.name, youtube_id:editExo.youtube_id||null})
          .eq('id',editExo.id);
        if (!error) {
          setExos(prev => prev.map(e => e.id===editExo.id ? {...e,...editExo} : e));
          setEditExo(null); setMsg('✅ Exercice mis à jour');
        } else setMsg('❌ Erreur: '+(error?.message||''));
        setSaving(false); setTimeout(()=>setMsg(''),4000);
      }

      async function handleDelete(exo) {
        const {error} = await sb.from('exercises').delete().eq('id',exo.id);
        if (!error) { setExos(prev=>prev.filter(e=>e.id!==exo.id)); setMsg('🗑️ Exercice supprimé'); }
        else setMsg('❌ Erreur: '+(error?.message||''));
        setDelExo(null); setTimeout(()=>setMsg(''),4000);
      }

      const modalBg = {position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000};
      const modalBox = {background:C.card,border:`1px solid ${C.border}`,borderRadius:16,padding:32,width:480,maxWidth:'90vw'};
      const fldLabel = {fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:C.gold,marginBottom:6,marginTop:16};

      return h('div', null,
        // YouTube modal
        ytModal && h('div', {className:'yt-modal', onClick:()=>setYtModal(null)},
          h('div', {style:{textAlign:'center'}, onClick:e=>e.stopPropagation()},
            h('div', {style:{color:C.white,marginBottom:12,fontSize:16,fontWeight:600}}, ytModal.name),
            h('iframe', {src:`https://www.youtube.com/embed/${ytModal.youtube_id}?autoplay=1`, allow:'autoplay; encrypted-media', allowFullScreen:true}),
            h('button', {onClick:()=>setYtModal(null), style:{marginTop:16,background:C.card,color:C.muted,border:`1px solid ${C.border}`,borderRadius:8,padding:'8px 20px',cursor:'pointer'}}, 'Fermer')
          )
        ),

        // Add modal
        addOpen && h('div', {style:modalBg, onClick:()=>setAddOpen(false)},
          h('div', {style:modalBox, onClick:e=>e.stopPropagation()},
            h('h2', {style:{fontSize:18,fontWeight:700,color:C.white,marginBottom:4}}, 'Ajouter un exercice'),
            h('p', {style:{color:C.muted,fontSize:13,marginBottom:8}}, 'Entrez le nom et l\'URL YouTube (optionnel)'),
            h('div', {style:fldLabel}, 'Nom de l\'exercice *'),
            h('input', {style:inp, placeholder:'Ex: Goblet Squat', value:form.name, onChange:e=>setForm(f=>({...f,name:e.target.value}))}),
            h('div', {style:fldLabel}, 'YouTube ID ou URL'),
            h('input', {style:inp, placeholder:'Ex: dGKl7_bK5X4 ou https://youtube.com/watch?v=...', value:form.youtube_id,
              onChange:e=>{
                let v = e.target.value.trim();
                const m = v.match(/(?:v=|youtu\.be\/)([^&\s]{11})/);
                if (m) v = m[1];
                setForm(f=>({...f,youtube_id:v}));
              }
            }),
            h('div', {style:fldLabel}, 'Tags (virgule séparés)'),
            h('input', {style:inp, placeholder:'Ex: Bodyweight, Glutes, Quads, No equipment', value:form.tags, onChange:e=>setForm(f=>({...f,tags:e.target.value}))}),
            h('div', {style:{display:'flex',gap:12,marginTop:24}},
              h('button', {onClick:()=>setAddOpen(false), style:{...btn,background:'transparent',color:C.muted,border:`1px solid ${C.border}`,flex:1}}, 'Annuler'),
              h('button', {onClick:handleAdd, disabled:!form.name||saving, style:{...btn,flex:1,opacity:(!form.name||saving)?0.5:1}}, saving?'Enregistrement...':'Ajouter')
            )
          )
        ),

        // Edit modal
        editExo && h('div', {style:modalBg, onClick:()=>setEditExo(null)},
          h('div', {style:modalBox, onClick:e=>e.stopPropagation()},
            h('h2', {style:{fontSize:18,fontWeight:700,color:C.white,marginBottom:4}}, 'Modifier l\'exercice'),
            h('div', {style:fldLabel}, 'Nom'),
            h('input', {style:inp, value:editExo.name, onChange:e=>setEditExo(x=>({...x,name:e.target.value}))}),
            h('div', {style:fldLabel}, 'YouTube ID (remplacer la vidéo)'),
            h('input', {style:inp, placeholder:'ID YouTube (ex: dGKl7_bK5X4)', value:editExo.youtube_id||'',
              onChange:e=>{
                let v = e.target.value.trim();
                const m = v.match(/(?:v=|youtu\.be\/)([^&\s]{11})/);
                if (m) v = m[1];
                setEditExo(x=>({...x,youtube_id:v||null}));
              }
            }),
            editExo.youtube_id && h('a', {href:`https://www.youtube.com/watch?v=${editExo.youtube_id}`,target:'_blank',style:{display:'block',marginTop:8,color:C.blue,fontSize:12}}, `▶ Voir: youtube.com/watch?v=${editExo.youtube_id}`),
            h('div', {style:{display:'flex',gap:12,marginTop:24}},
              h('button', {onClick:()=>setEditExo(null), style:{...btn,background:'transparent',color:C.muted,border:`1px solid ${C.border}`,flex:1}}, 'Annuler'),
              h('button', {onClick:handleEdit, disabled:saving, style:{...btn,flex:1,opacity:saving?0.5:1}}, saving?'Enregistrement...':'Enregistrer')
            )
          )
        ),

        // Delete confirm
        delExo && h('div', {style:modalBg, onClick:()=>setDelExo(null)},
          h('div', {style:{...modalBox,maxWidth:380}, onClick:e=>e.stopPropagation()},
            h('h2', {style:{fontSize:18,fontWeight:700,color:C.red,marginBottom:12}}, 'Supprimer l\'exercice ?'),
            h('p', {style:{color:C.white,marginBottom:8}}, `"${delExo.name}"`),
            h('p', {style:{color:C.muted,fontSize:13,marginBottom:24}}, 'Cette action est irréversible.'),
            h('div', {style:{display:'flex',gap:12}},
              h('button', {onClick:()=>setDelExo(null), style:{...btn,background:'transparent',color:C.muted,border:`1px solid ${C.border}`,flex:1}}, 'Annuler'),
              h('button', {onClick:()=>handleDelete(delExo), style:{...btn,background:C.red,flex:1}}, 'Supprimer')
            )
          )
        ),

        // Header
        h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}},
          h('div', null,
            h('h1', {style:{fontSize:24,fontWeight:700,color:C.white}}, 'Bibliothèque d\'Exercices'),
            h('p', {style:{color:C.muted,fontSize:14,marginTop:4}},

          h('div', {style:{display:'flex',gap:10}},
            isAdmin && h('button', {onClick:()=>setAddOpen(true), style:{...btn,fontSize:13,padding:'10px 18px'}}, '+ Ajouter un exercice'),
            h('a', {href:'https://tayafitness.azeoo.com/exercises', target:'_blank', style:{...btn,background:'transparent',color:C.muted,border:`1px solid ${C.border}`,textDecoration:'none',fontSize:13,padding:'10px 18px'}}, 'Azeoo ↗')

        // Pagination bar
        h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
          h('p', {style:{color:C.muted,fontSize:13}}, `${visible.length} affichés sur ${filtered.length} · Page ${page+1}/${totalPages||1}`),

            h('button', {disabled:page===0, onClick:()=>setPage(p=>p-1), style:{background:'transparent',color:page===0?C.border:C.muted,border:`1px solid ${page===0?C.border:C.muted}`,borderRadius:8,padding:'6px 14px',cursor:page===0?'default':'pointer',fontSize:13}}, '← Préc'),

            const thumb = imgUrl(exo.image_filename);
            const tags = exo.tags || [];
            const muscleTags = tags.filter(t => EX_MUSCLES.includes(t)).slice(0,2);

              style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,overflow:'hidden',transition:'transform 0.2s',position:'relative'},

    // ── Abonnements ──────────────────────────────────────────────────────────

      return h('div',null,
        h('h1',{style:{fontSize:24,fontWeight:700,marginBottom:24,color:C.white}},'Abonnements'),

            const colors={all:C.white,active:C.green,past_due:C.gold,cancelled:C.red};
            return h('button',{key:v,onClick:()=>setFilter(v),style:{background:'transparent',color:filter===v?colors[v]:C.muted,border:`1px solid ${filter===v?colors[v]:C.border}`,borderRadius:10,padding:'8px 16px',fontSize:13,cursor:'pointer'}},`${labels[v]} (${counts[v]||0})`);

    // ── Revenus ──────────────────────────────────────────────────────────────
    function Revenus() {
      const [abos,setAbos]=useState([]);
      const [loading,setLoading]=useState(true);
      useEffect(()=>{
        sb.from('abonnements').select('plan,statut').eq('statut','active')
          .then(({data})=>{setAbos(data||[]);setLoading(false);});

      const px={starter:49,performance:99,vip:199};

        h('h1',{style:{fontSize:24,fontWeight:700,marginBottom:24,color:C.white}},'Revenus'),

          h('div',{style:{display:'flex',gap:16,marginBottom:32}},
            ...[
              {label:'MRR mensuel',value:`${mrr}€`,color:C.green},
              {label:'ARR annuel projeté',value:`${mrr*12}€`,color:C.blue},
              {label:'Abonnés actifs',value:abos.length,color:C.gold},
            ].map(s=>h('div',{key:s.label,style:{background:C.soft,border:`1px solid ${C.border}`,borderRadius:12,padding:'20px 24px',flex:1}},
              h('div',{style:{fontSize:28,fontWeight:800,color:s.color}},s.value),
              h('div',{style:{fontSize:13,color:C.muted,marginTop:4}},s.label)

    // ── Emails ───────────────────────────────────────────────────────────────
    function Emails() {
      const [subs,setSubs]=useState([]);
      const [subject,setSubject]=useState('');
      const [body,setBody]=useState('');
      const [sending,setSending]=useState(false);
      const [msg,setMsg]=useState('');
      useEffect(()=>{
        sb.from('newsletter').select('email,created_at').order('created_at',{ascending:false}).then(({data})=>setSubs(data||[]));
      },[]);
      async function send(e){
        e.preventDefault();setSending(true);
        await sb.from('email_log').insert({subject,body,recipients:subs.length,statut:'sent',created_at:new Date().toISOString()});
        setMsg(`Campagne "${subject}" enregistrée — ${subs.length} destinataires`);
        setSubject('');setBody('');setSending(false);
        setTimeout(()=>setMsg(''),5000);

      return h('div',null,
        h('h1',{style:{fontSize:24,fontWeight:700,marginBottom:8,color:C.white}},'Campagnes mail'),
        h('p',{style:{color:C.muted,fontSize:14,marginBottom:24}},`${subs.length} abonnés à la newsletter`),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}},
          h('div',{style:card},
            h('h3',{style:{fontSize:16,fontWeight:600,marginBottom:20,color:C.white}},'Nouvelle campagne'),
            h('form',{onSubmit:send},
              h('div',{style:{marginBottom:16}},
                h('div',{style:{fontSize:11,fontWeight:700,letterSpacing:'0.18em',textTransform:'uppercase',color:C.gold,marginBottom:6}},'Objet'),
                h('input',{style:inp,value:subject,onChange:e=>setSubject(e.target.value),placeholder:'Ex: Nouveaux programmes 🔥',required:true})
              ),
              h('div',{style:{marginBottom:16}},
                h('div',{style:{fontSize:11,fontWeight:700,letterSpacing:'0.18em',textTransform:'uppercase',color:C.gold,marginBottom:6}},'Message'),
                h('textarea',{style:{...inp,resize:'vertical'},rows:8,value:body,onChange:e=>setBody(e.target.value),placeholder:'Bonjour,\n\nÉcris ton message ici...',required:true})
              ),
              msg&&h('div',{style:{color:C.green,fontSize:13,marginBottom:12}},msg),
              h('button',{style:btn,disabled:sending||subs.length===0},sending?'Envoi...':'Envoyer la campagne')
            )
          ),
          h('div',{style:card},
            h('h3',{style:{fontSize:16,fontWeight:600,marginBottom:16,color:C.white}},'Abonnés récents'),
            h('div',{style:{maxHeight:400,overflowY:'auto'}},
              ...subs.slice(0,30).map((s,i)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:`1px solid ${C.border}`,fontSize:13}},
                h('span',{style:{color:C.white}},s.email),
                h('span',{style:{color:C.muted}},new Date(s.created_at).toLocaleDateString('fr-FR'))
              )),
              subs.length===0&&h('p',{style:{color:C.muted,fontSize:14}},'Aucun abonné.')
            )
          )
        )
      );
    }

    // ── Tâches ───────────────────────────────────────────────────────────────
    function Taches() {
      const [taches,setTaches]=useState([]);
      const [titre,setTitre]=useState('');
      const [prio,setPrio]=useState('normale');
      useEffect(()=>{load();}, []);
      async function load(){const {data}=await sb.from('taches').select('*').order('created_at',{ascending:false});setTaches(data||[]);}
      async function add(e){e.preventDefault();if(!titre.trim())return;await sb.from('taches').insert({titre,statut:'todo',priorite:prio});setTitre('');load();}
      async function toggle(id,done){await sb.from('taches').update({statut:done?'todo':'done'}).eq('id',id);load();}
      async function del(id){await sb.from('taches').delete().eq('id',id);load();}
      const pc={haute:C.red,normale:C.gold,basse:C.blue};
      const todo=taches.filter(t=>t.statut!=='done');
      const done=taches.filter(t=>t.statut==='done');
      return h('div',null,
        h('h1',{style:{fontSize:24,fontWeight:700,marginBottom:24,color:C.white}},'Tâches'),
        h('div',{style:{...card,marginBottom:24}},
          h('form',{onSubmit:add,style:{display:'flex',gap:12}},
            h('input',{style:{...inp,flex:1},value:titre,onChange:e=>setTitre(e.target.value),placeholder:'Nouvelle tâche...'}),
            h('select',{style:{...inp,width:140},value:prio,onChange:e=>setPrio(e.target.value)},
              h('option',{value:'haute'},'🔴 Haute'),
              h('option',{value:'normale'},'🟡 Normale'),
              h('option',{value:'basse'},'🔵 Basse')
            ),
            h('button',{style:btn},'Ajouter')
          )
        ),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}},
          h('div',{style:card},
            h('h3',{style:{fontSize:15,fontWeight:600,marginBottom:16,color:C.white}},`À faire (${todo.length})`),
            todo.length===0?h('p',{style:{color:C.muted,fontSize:14}},'Tout est fait 🎉'):
            todo.map((t,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:`1px solid ${C.border}`}},
              h('button',{onClick:()=>toggle(t.id,false),style:{width:20,height:20,borderRadius:4,border:`2px solid ${C.border}`,background:'transparent',cursor:'pointer',flexShrink:0}}),
              h('span',{style:{flex:1,fontSize:14,color:C.white}},t.titre),
              h('span',{style:badge(pc[t.priorite]||C.muted)},t.priorite),
              h('button',{onClick:()=>del(t.id),style:{background:'transparent',border:'none',color:C.muted,cursor:'pointer',fontSize:16}},'✕')
            ))
          ),
          h('div',{style:card},
            h('h3',{style:{fontSize:15,fontWeight:600,marginBottom:16,color:C.white}},`Terminées (${done.length})`),
            done.length===0?h('p',{style:{color:C.muted,fontSize:14}},'Aucune tâche terminée.'):
            done.map((t,i)=>h('div',{key:i,style:{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:`1px solid ${C.border}`}},
              h('button',{onClick:()=>toggle(t.id,true),style:{width:20,height:20,borderRadius:4,border:'none',background:C.green,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'#fff'}},'✓'),
              h('span',{style:{flex:1,fontSize:14,textDecoration:'line-through',color:C.muted}},t.titre),
              h('button',{onClick:()=>del(t.id),style:{background:'transparent',border:'none',color:C.muted,cursor:'pointer',fontSize:16}},'✕')
            ))
          )
        )
      );
    }


    // ── Form Preview Modal ────────────────────────────────────────────────────
    function FormPreviewModal({form,fmeta,questions,onClose}){
      const [step,setStep]=useState(0);
      const bg=fmeta.bg_color||'#0d1b2a';
      const accent=fmeta.accent_color||'#ff6b4a';
      const btnShape=fmeta.btn_shape||'pill';
      const btnRadius=btnShape==='sharp'?'0px':btnShape==='square'?'6px':btnShape==='rounded'?'14px':'50px';
      const btnBg=fmeta.btn_color||accent;
      const btnTextCol=fmeta.btn_text_color||'#000';
      const fontFam=fmeta.font_family?`'${fmeta.font_family}',sans-serif`:'Inter,sans-serif';
      const allSteps=[{_isHome:true},...(questions||[]),{type:'__end'}];
      const cur=allSteps[step]||allSteps[0];
      const answerableCount=(questions||[]).filter(q=>q.type!=='info_screen').length;
      const answerableSoFar=(questions||[]).slice(0,step).filter(q=>q.type!=='info_screen').length;
      const progress=step===0?0:Math.round((answerableSoFar/Math.max(answerableCount,1))*100);
      const ctaBtn={background:btnBg,color:btnTextCol,border:'none',borderRadius:btnRadius,padding:'14px 28px',fontSize:16,fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginTop:16,display:'inline-block'};
      const iStyle={background:'transparent',border:'none',borderBottom:'2px solid rgba(255,255,255,0.2)',color:'rgba(255,255,255,0.8)',fontSize:16,width:'100%',padding:'8px 0',outline:'none',fontFamily:'inherit'};

      function renderInput(q){
        switch(q.type){
          case 'short_answer': return h('input',{style:iStyle,placeholder:'Votre réponse...',readOnly:true});
          case 'long_answer': return h('textarea',{style:{background:'rgba(255,255,255,0.04)',border:'1.5px solid rgba(255,255,255,0.12)',borderRadius:10,color:'rgba(255,255,255,0.8)',fontSize:15,width:'100%',padding:'12px',outline:'none',resize:'vertical',minHeight:80,fontFamily:'inherit'},placeholder:'Votre réponse...',readOnly:true});
          case 'email': return h('input',{style:iStyle,placeholder:'votre@email.com',readOnly:true});
          case 'phone': return h('input',{style:iStyle,placeholder:'+33 6 00 00 00 00',readOnly:true});
          case 'date': return h('input',{type:'date',style:{...iStyle,colorScheme:'dark'},readOnly:true});
          case 'yesno': return h('div',{style:{display:'flex',gap:12,marginTop:8}},
            h('div',{style:{flex:1,padding:'14px',borderRadius:12,border:'2px solid rgba(62,207,142,0.3)',color:'#3ecf8e',textAlign:'center',fontWeight:600,fontSize:15}},'👍 Oui'),
            h('div',{style:{flex:1,padding:'14px',borderRadius:12,border:'2px solid rgba(255,77,106,0.3)',color:'#ff4d6a',textAlign:'center',fontWeight:600,fontSize:15}},'👎 Non')
          );
          case 'single_choice':
          case 'multiple_choice': return h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
            ...(q.options||[]).map((opt,i)=>h('div',{key:i,style:{padding:'12px 16px',border:'1.5px solid rgba(255,255,255,0.1)',borderRadius:10,fontSize:14,color:'rgba(255,255,255,0.7)',display:'flex',alignItems:'center',gap:10}},
              h('span',{style:{width:22,height:22,border:'1.5px solid rgba(255,255,255,0.3)',borderRadius:q.type==='single_choice'?'50%':6,display:'inline-block',flexShrink:0}}),opt
            ))
          );
          case 'rating': {
            const min=q.settings?.min??1,max=q.settings?.max??5;
            const nums=[];for(let n=min;n<=max;n++)nums.push(n);
            return h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}},
              ...nums.map(n=>h('div',{key:n,style:{width:42,height:42,borderRadius:8,border:'1.5px solid rgba(255,255,255,0.15)',background:'rgba(255,255,255,0.04)',color:'rgba(255,255,255,0.6)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15}},n))
            );
          }
          case 'multi_fields': return h('div',{style:{display:'flex',flexDirection:'column',gap:16,marginTop:4}},
            ...((q.settings?.fields)||[]).map((f,i)=>h('div',{key:i},
              h('div',{style:{fontSize:11,fontWeight:700,color:accent,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:4}},f.label),
              h('input',{style:iStyle,placeholder:f.label,readOnly:true})
            ))
          );
          case 'info_screen': return h('div',null);
          default: return h('input',{style:iStyle,placeholder:'Votre réponse...',readOnly:true});
        }
      }

      function renderContent(){
        if(cur._isHome) return h('div',{style:{width:'100%'}},
          fmeta.cover_url&&h('img',{src:fmeta.cover_url,style:{width:'100%',height:fmeta.cover_height||220,objectFit:'cover',objectPosition:fmeta.cover_position||'center center',borderRadius:fmeta.cover_radius||16,marginBottom:20,display:'block'}}),
          h('h1',{style:{fontSize:22,fontWeight:800,marginBottom:8,lineHeight:1.3}},fmeta.homepage_title||form.title||'Bienvenue'),
          fmeta.homepage_description&&h('p',{style:{color:'rgba(255,255,255,0.55)',fontSize:14,lineHeight:1.6,marginBottom:16}},fmeta.homepage_description),
          h('button',{onClick:()=>setStep(1),style:ctaBtn},(fmeta.homepage_button||'Commencer')+' →')
        );
        if(cur.type==='__end') return h('div',{style:{textAlign:'center',padding:'20px 0'}},
          h('div',{style:{fontSize:52,marginBottom:16}},'🎉'),
          h('h2',{style:{fontSize:20,fontWeight:800,marginBottom:8}},fmeta.end_title||'Merci !'),
          fmeta.end_description&&h('p',{style:{color:'rgba(255,255,255,0.55)',fontSize:14,lineHeight:1.6}},fmeta.end_description)
        );
        return h('div',{style:{width:'100%'}},
          h('div',{style:{fontSize:11,fontWeight:600,color:accent,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:8}},'Question '+(step)+' / '+(questions||[]).length),
          h('h2',{style:{fontSize:20,fontWeight:700,marginBottom:8,lineHeight:1.3}},cur.title),
          cur.description&&h('p',{style:{color:'rgba(255,255,255,0.5)',fontSize:13,marginBottom:16,lineHeight:1.5,whiteSpace:'pre-line'}},cur.description),
          renderInput(cur)
        );
      }

      return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.88)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:3000},onClick:e=>{if(e.target===e.currentTarget)onClose();}},
        h('div',{style:{position:'relative',width:'min(390px,90vw)',height:'min(750px,90vh)',borderRadius:20,overflow:'hidden',boxShadow:'0 30px 80px rgba(0,0,0,0.7)',border:'1px solid rgba(255,255,255,0.1)',background:bg,color:'#fff',fontFamily:fontFam,display:'flex',flexDirection:'column'}},
          step>0&&step<allSteps.length-1&&h('div',{style:{position:'absolute',top:0,left:0,right:0,height:3,background:'rgba(255,255,255,0.08)',zIndex:10}},
            h('div',{style:{height:'100%',width:progress+'%',background:`linear-gradient(90deg,${accent},${accent}99)`,transition:'width 0.3s'}})
          ),
          h('button',{onClick:onClose,style:{position:'absolute',top:10,right:10,zIndex:20,background:'rgba(0,0,0,0.55)',border:'none',color:'#fff',borderRadius:'50%',width:30,height:30,cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}},'×'),
          h('div',{style:{position:'absolute',top:10,left:10,zIndex:20,background:'rgba(0,0,0,0.45)',borderRadius:6,padding:'3px 8px',fontSize:10,color:'rgba(255,255,255,0.4)',letterSpacing:'0.08em',backdropFilter:'blur(4px)'}},'APERÇU'),
          h('div',{style:{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28}},renderContent()),
          step>0&&step<allSteps.length-1&&h('div',{style:{display:'flex',justifyContent:'flex-end',padding:'10px 16px',gap:8,borderTop:'1px solid rgba(255,255,255,0.07)',flexShrink:0}},
            step>1&&h('button',{onClick:()=>setStep(s=>s-1),style:{background:'rgba(255,255,255,0.08)',border:'none',color:'#aaa',borderRadius:'50%',width:36,height:36,cursor:'pointer',fontSize:15}},'↑'),
            h('button',{onClick:()=>setStep(s=>Math.min(s+1,allSteps.length-1)),style:{background:`linear-gradient(135deg,${accent},${accent}bb)`,border:'none',color:'#000',borderRadius:'50%',width:36,height:36,cursor:'pointer',fontSize:15,fontWeight:700}},'↓')
          )
        )
      );
    }

    // ── Questionnaires ────────────────────────────────────────────────────────
    function FormBuilder({form,initQuestions,onClose,baseUrl}){
      const [questions,setQuestions]=useState(initQuestions);
      const [selIdx,setSelIdx]=useState(0);
      const [title,setTitle]=useState(form.title);
      const [saving,setSaving]=useState(false);
      const [addOpen,setAddOpen]=useState(false);
      const [shareOpen,setShareOpen]=useState(false);
      const [previewOpen,setPreviewOpen]=useState(false);
      const [msg,setMsg]=useState('');
      const [settingsOpen,setSettingsOpen]=useState(false);

                  h('div',{style:{display:'flex',alignItems:'center',gap:10}},
                    h('input',{type:'color',value:fmeta.btn_color||fmeta.accent_color,onChange:e=>setFmeta(p=>({...p,btn_color:e.target.value})),style:{width:44,height:38,border:'none',borderRadius:8,cursor:'pointer',padding:2,background:'transparent'}}),
                    h('button',{onClick:()=>setFmeta(p=>({...p,btn_color:''})),style:{fontSize:11,background:'transparent',border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,padding:'4px 8px',cursor:'pointer'}},fmeta.btn_color?'Reset':'= Accent')
                  )
                ),
                h('div',null,
                  h('label',{style:{display:'block',fontSize:12,color:C.muted,marginBottom:8}},'Couleur du texte'),
                  h('div',{style:{display:'flex',alignItems:'center',gap:10}},
                    h('input',{type:'color',value:fmeta.btn_text_color||'#000000',onChange:e=>setFmeta(p=>({...p,btn_text_color:e.target.value})),style:{width:44,height:38,border:'none',borderRadius:8,cursor:'pointer',padding:2,background:'transparent'}}),
                    h('div',{style:{padding:'6px 10px',borderRadius:8,background:fmeta.btn_color||fmeta.accent_color,fontSize:12,fontWeight:700,color:fmeta.btn_text_color||'#000',borderRadius:50,whiteSpace:'nowrap'}},'Aperçu →')
                  )
                )
              )
            ),
            h('div',{style:{marginBottom:18,padding:'16px',background:C.soft,borderRadius:12,border:`1px solid ${C.border}`}},
              h('div',{style:{fontSize:11,fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',color:C.gold,marginBottom:14}},"🏠 Page d'accueil"),
              h('label',{style:{display:'block',fontSize:11,color:C.muted,marginBottom:4}},'Titre'),
              h('input',{value:fmeta.homepage_title,onChange:e=>setFmeta(p=>({...p,homepage_title:e.target.value})),style:{...inp,width:'100%',marginBottom:10},placeholder:'ex: Bienvenue dans votre bilan !'}),
              h('label',{style:{display:'block',fontSize:11,color:C.muted,marginBottom:4}},'Description'),
              h('textarea',{value:fmeta.homepage_description,onChange:e=>setFmeta(p=>({...p,homepage_description:e.target.value})),style:{...inp,width:'100%',height:70,resize:'vertical',marginBottom:10},placeholder:'Texte de présentation affiché sur la page d\'accueil du formulaire...'}),
              h('label',{style:{display:'block',fontSize:11,color:C.muted,marginBottom:4}},'Texte du bouton'),
              h('input',{value:fmeta.homepage_button,onChange:e=>setFmeta(p=>({...p,homepage_button:e.target.value})),style:{...inp,width:'100%'},placeholder:'Commencer'})
            ),
            h('div',{style:{marginBottom:24,padding:'16px',background:C.soft,borderRadius:12,border:`1px solid ${C.border}`}},
              h('div',{style:{fontSize:11,fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',color:C.gold,marginBottom:14}},'🏁 Page de fin'),
              h('label',{style:{display:'block',fontSize:11,color:C.muted,marginBottom:4}},'Titre'),
              h('input',{value:fmeta.end_title,onChange:e=>setFmeta(p=>({...p,end_title:e.target.value})),style:{...inp,width:'100%',marginBottom:10},placeholder:'ex: Merci pour vos réponses !'}),
              h('label',{style:{display:'block',fontSize:11,color:C.muted,marginBottom:4}},'Description'),
              h('textarea',{value:fmeta.end_description,onChange:e=>setFmeta(p=>({...p,end_description:e.target.value})),style:{...inp,width:'100%',height:70,resize:'vertical',marginBottom:10},placeholder:'Message de confirmation affiché après la soumission...'}),
              h('label',{style:{display:'block',fontSize:11,color:C.muted,marginBottom:4}},'Texte du bouton (optionnel)'),
              h('input',{value:fmeta.end_button,onChange:e=>setFmeta(p=>({...p,end_button:e.target.value})),style:{...inp,width:'100%'},placeholder:'Terminer'})
            ),
            h('div',{style:{display:'flex',justifyContent:'flex-end',gap:10}},
              h('button',{onClick:()=>setSettingsOpen(false),style:{background:'transparent',border:`1px solid ${C.border}`,color:C.muted,borderRadius:10,padding:'10px 22px',cursor:'pointer'}},'Annuler'),
              h('button',{onClick:()=>{save();setSettingsOpen(false);},style:btn},'💾 Sauvegarder')
            )
          )
        )
      );
    }

    function ResponsesView({form,onClose}){
      const [responses,setResponses]=useState([]);
      const [questions,setQuestions]=useState([]);
      const [loading,setLoading]=useState(true);
      const [selected,setSelected]=useState(null);
      useEffect(()=>{
        Promise.all([
          sb.from('form_responses').select('*').eq('form_id',form.id).order('completed_at',{ascending:false}),
          sb.from('form_questions').select('*').eq('form_id',form.id).order('order_index')
        ]).then(([{data:r},{data:q}])=>{
          setResponses(r||[]);
          setQuestions((q||[]).filter(q=>q.type!=='info_screen'));
          setLoading(false);
        });
      },[]);
      return h('div',null,
        h('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:24}},
          h('button',{onClick:onClose,style:{background:'transparent',border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:'7px 14px',cursor:'pointer'}},'← Retour'),
          h('h1',{style:{fontSize:20,fontWeight:700,color:C.white}},`Réponses — ${form.title}`),
          h('span',{style:{...badge(C.blue),marginLeft:'auto'}},`${responses.length} réponse${responses.length>1?'s':''}`)
        ),
        loading?h('p',{style:{color:C.muted}},'Chargement...'):
        responses.length===0?h('div',{style:{textAlign:'center',padding:'60px 20px',color:C.muted}},
          h('div',{style:{fontSize:48,marginBottom:12}},'📭'),
          h('p',null,'Aucune réponse pour ce questionnaire')
        ):
        h('div',{style:{display:'grid',gap:12}},
          ...responses.map(r=>h('div',{key:r.id,style:{...card,cursor:'pointer',border:`1px solid ${selected===r.id?C.gold:C.border}`},onClick:()=>setSelected(selected===r.id?null:r.id)},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
              h('div',null,
                h('div',{style:{fontSize:14,fontWeight:600,color:C.white}},r.respondent_name||r.respondent_email||'Anonyme'),
                h('div',{style:{fontSize:12,color:C.muted}},new Date(r.completed_at).toLocaleString('fr-FR'))
              ),
              h('span',{style:{...badge(C.green),fontSize:11}},'✓ Complété')
            ),
            selected===r.id&&h('div',{style:{marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16}},
              ...questions.map(q=>{
                const ans=r.answers?.[q.id];
                if(ans===undefined||ans===null||ans==='')return null;
                return h('div',{key:q.id,style:{marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${C.border}`}},
                  h('div',{style:{fontSize:12,fontWeight:700,color:C.gold,marginBottom:4}},q.title),
                  h('div',{style:{fontSize:14,color:C.white}},Array.isArray(ans)?ans.join(', '):String(ans))
                );
              }).filter(Boolean)
            )
          ))
        )
      );
    }

    function Questionnaires(){
      const [isAdmin,setIsAdmin]=useState(false);
      const [forms,setForms]=useState([]);
      const [loading,setLoading]=useState(true);
      const [builder,setBuilder]=useState(null);
      const [responsesView,setResponsesView]=useState(null);
      const [delForm,setDelForm]=useState(null);
      const [msg,setMsg]=useState('');
      const BASE_URL='https://taya-fitness-site-1.vercel.app';

      useEffect(()=>{
        sb.auth.getSession().then(({data:{session}})=>{if(session?.user)setIsAdmin(ADMIN_EMAILS.includes(session.user.email));});
        load();
      },[]);

      async function load(){
        setLoading(true);
        const{data}=await sb.from('forms').select('*, form_questions(count), form_responses(count)').order('created_at',{ascending:false});
        setForms((data||[]).map(f=>({...f,_qCount:f.form_questions?.[0]?.count||0,_rCount:f.form_responses?.[0]?.count||0})));
        setLoading(false);
      }

      async function createForm(){
        const slug='form-'+Date.now();
        const{data}=await sb.from('forms').insert({title:'Nouveau questionnaire',slug}).select('*').single();
        if(data){
          await sb.from('form_questions').insert([
            {form_id:data.id,order_index:0,type:'info_screen',title:'Bienvenue !',description:'Remplissez ce questionnaire.',required:false},
            {form_id:data.id,order_index:1,type:'short_answer',title:'Votre nom complet',required:true}
          ]);
          await openBuilder(data);
        }
      }

      async function openBuilder(form){
        const{data:questions}=await sb.from('form_questions').select('*').eq('form_id',form.id).order('order_index');
        setBuilder({form,questions:questions||[]});
      }

      async function deleteForm(f){
        await sb.from('forms').delete().eq('id',f.id);
        setDelForm(null);load();
      }

      if(builder)return h(FormBuilder,{key:builder.form.id,form:builder.form,initQuestions:builder.questions,onClose:()=>{setBuilder(null);load();},baseUrl:BASE_URL});
      if(responsesView)return h(ResponsesView,{form:responsesView,onClose:()=>setResponsesView(null)});

      return h('div',null,
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}},
          h('div',null,
            h('h1',{style:{fontSize:24,fontWeight:700,color:C.white,marginBottom:4}},'📋 Questionnaires'),
            h('p',{style:{color:C.muted,fontSize:13}},'Formulaires Typeform — créez, partagez et collectez des réponses')
          ),
          isAdmin&&h('button',{onClick:createForm,style:btn},'+ Nouveau questionnaire')
        ),
        msg&&h('div',{style:{color:C.green,marginBottom:12,fontSize:13}},msg),
        loading?h('p',{style:{color:C.muted}},'Chargement...'):
        forms.length===0?h('div',{style:{textAlign:'center',padding:'60px 20px',color:C.muted}},
          h('div',{style:{fontSize:48,marginBottom:12}},'📋'),
          h('p',null,'Aucun questionnaire'),
          isAdmin&&h('button',{onClick:createForm,style:{...btn,marginTop:12}},'+ Créer le premier')
        ):
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:16}},
          ...forms.map(f=>{
            const accent=(f.settings&&f.settings.accent_color)||C.gold;
            const bgClr=(f.settings&&f.settings.bg_color)||C.card;
            return h('div',{key:f.id,style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:16,display:'flex',flexDirection:'column',overflow:'hidden',transition:'transform 0.15s,box-shadow 0.15s'},onMouseEnter:e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow=`0 8px 24px ${accent}22`;},onMouseLeave:e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow='';},},
              h('div',{style:{height:5,background:`linear-gradient(90deg,${accent},${bgClr})`}}),
              f.cover_url&&h('div',{style:{height:110,overflow:'hidden'}},
                h('img',{src:f.cover_url,style:{width:'100%',height:'100%',objectFit:'cover'},onError:e=>e.target.parentNode.style.display='none'})
              ),
              h('div',{style:{padding:'16px 18px 12px',flex:1}},
                h('div',{style:{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}},
                  h('div',{style:{width:10,height:10,borderRadius:'50%',background:accent,flexShrink:0,marginTop:4}}),
                  h('div',{style:{fontSize:15,fontWeight:700,color:C.white,lineHeight:1.3}},f.title)
                ),
                h('div',{style:{display:'flex',gap:16,marginBottom:12,marginLeft:20}},
                  h('div',{style:{fontSize:12,color:C.muted,display:'flex',alignItems:'center',gap:4}},h('span',{style:{color:accent,fontWeight:700,fontSize:14}},f._qCount),' questions'),
                  h('div',{style:{fontSize:12,color:C.muted,display:'flex',alignItems:'center',gap:4}},h('span',{style:{color:C.blue,fontWeight:700,fontSize:14}},f._rCount),' réponses')
                ),
                h('div',{style:{background:C.soft,borderRadius:8,padding:'7px 10px',display:'flex',alignItems:'center',gap:6}},
                  h('span',{style:{fontSize:10,color:C.muted,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},`${BASE_URL}/forms.html?slug=${f.slug}`),
                  h('button',{onClick:()=>{navigator.clipboard.writeText(`${BASE_URL}/forms.html?slug=${f.slug}`);setMsg('📋 Lien copié !');setTimeout(()=>setMsg(''),3000);},style:{background:'transparent',border:'none',color:accent,cursor:'pointer',fontSize:12,flexShrink:0,padding:'0 4px'}},'📋')
                )
              ),
              h('div',{style:{borderTop:`1px solid ${C.border}`,padding:'10px 12px',display:'flex',gap:6}},
                isAdmin&&h('button',{onClick:()=>openBuilder(f),style:{...btn,flex:1,fontSize:12,padding:'7px 0',background:`linear-gradient(135deg,${accent}cc,${accent}88)`}},'✏️ Éditer'),
                h('button',{onClick:()=>setResponsesView(f),title:'Réponses',style:{background:C.soft,border:`1px solid ${C.border}`,color:C.muted,borderRadius:8,padding:'7px 10px',cursor:'pointer',fontSize:13}},'📊'),
                h('a',{href:`${BASE_URL}/forms.html?slug=${f.slug}`,target:'_blank',title:'Ouvrir',style:{background:C.soft,border:`1px solid ${C.blue}44`,color:C.blue,borderRadius:8,padding:'7px 10px',cursor:'pointer',fontSize:13,textDecoration:'none',display:'flex',alignItems:'center'}},'🔗'),
                isAdmin&&h('button',{onClick:()=>setDelForm(f),title:'Supprimer',style:{background:'transparent',border:`1px solid ${C.red}33`,color:C.red,cursor:'pointer',fontSize:13,padding:'7px 10px',borderRadius:8}},'🗑')
              )
            );
          })
        ),
        delForm&&h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}},
          h('div',{style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:28,maxWidth:360,textAlign:'center'}},
            h('div',{style:{fontSize:32,marginBottom:12}},'⚠️'),
            h('div',{style:{fontSize:15,fontWeight:700,color:C.white,marginBottom:8}},'Supprimer ce questionnaire ?'),
            h('div',{style:{fontSize:13,color:C.muted,marginBottom:20}},delForm.title),
            h('div',{style:{display:'flex',gap:10,justifyContent:'center'}},
              h('button',{onClick:()=>setDelForm(null),style:{background:'transparent',border:`1px solid ${C.border}`,color:C.muted,borderRadius:10,padding:'10px 20px',cursor:'pointer'}},'Annuler'),
              h('button',{onClick:()=>deleteForm(delForm),style:{...btn,background:`linear-gradient(135deg,${C.red},#c0392b)`}},'Supprimer')
            )
          )
        )
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
