<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Dancing+Script:wght@700&amp;display=swap');
    </style>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c70"/>
      <stop offset="100%" stop-color="#ff5a2f"/>
    </linearGradient>
    <linearGradient id="coralLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#ff8c70"/>
    </linearGradient>
  </defs>

  <!-- TAYA — bloc condensé gras -->
  <text
    x="0" y="72"
    font-family="'Bebas Neue', 'Arial Black', Impact, sans-serif"
    font-size="78"
    font-weight="400"
    letter-spacing="4"
    fill="url(#coral)">TAYA</text>

  <!-- Fitness — script cursif par-dessus, décalé vers la droite sur le A -->
  <text
    x="168" y="58"
    font-family="'Dancing Script', 'Brush Script MT', cursive"
    font-size="30"
    font-weight="700"
    fill="#f0f4f8"
    opacity="0.95"
    letter-spacing="1">Fitness</text>

  <!-- Trait décoratif sous Fitness -->
  <line x1="168" y1="64" x2="288" y2="64" stroke="url(#coralLight)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Tagline -->
  <text
    x="1" y="84"
    font-family="'Arial', sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="3.5"
    fill="#f0f4f8"
    opacity="0.45">COACH SPORTIF · NUTRITIONNISTE</text>
</svg>
