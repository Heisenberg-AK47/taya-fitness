<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Questionnaire — Taya Fitness</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#111;--accent:#e8c547;--accent2:#d4af37;--font:'Inter',sans-serif;--btn-bg:var(--accent);--btn-text:#000;--btn-radius:50px;--cover-h:220px;--cover-pos:center center;--cover-r:16px;}
  html,body{height:100%;font-family:var(--font);background:var(--bg);color:#fff;overflow:hidden;}

  #root{height:100%;display:flex;flex-direction:column;}
  .screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:left;animation:fadeIn 0.35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-16px);}}
  .screen.out{animation:fadeOut 0.25s ease forwards;}

  .progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.4s ease;z-index:100;}
  .nav-bar{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;z-index:100;}
  .nav-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .nav-btn.back{background:rgba(255,255,255,0.1);color:#aaa;}
  .nav-btn.back:hover{background:rgba(255,255,255,0.15);}
  .nav-btn.next{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;}
  .nav-btn.next:hover{transform:scale(1.05);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;}

  .q-step{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:8px;}
  .q-title{font-size:clamp(20px,4vw,32px);font-weight:700;line-height:1.3;margin-bottom:10px;max-width:620px;}
  .q-desc{font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:28px;max-width:540px;line-height:1.6;white-space:pre-line;}
  .required-star{color:var(--accent);margin-left:4px;}
  .hint{font-size:12px;color:rgba(255,255,255,0.35);margin-top:10px;display:flex;align-items:center;gap:6px;}
  .hint kbd{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:2px 7px;font-family:inherit;font-size:11px;}

  /* Media per question */
  .q-media{width:100%;max-width:540px;margin-bottom:20px;border-radius:14px;overflow:hidden;}
  .q-media img{width:100%;max-height:220px;object-fit:cover;object-position:var(--cover-pos);display:block;}
  .q-media video{width:100%;max-height:220px;object-fit:cover;display:block;border-radius:14px;}
  .q-media iframe{width:100%;height:220px;border:none;border-radius:14px;display:block;}

  /* Inputs */
  .tf-input{background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,0.15);color:#fff;font-size:20px;font-family:inherit;width:100%;max-width:500px;padding:10px 0;outline:none;transition:border-color 0.2s;}
  .tf-input:focus{border-bottom-color:var(--accent);}
  .tf-input::placeholder{color:rgba(255,255,255,0.25);}
  .tf-textarea{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.12);border-radius:12px;color:#fff;font-size:16px;font-family:inherit;width:100%;max-width:540px;padding:14px 16px;outline:none;resize:vertical;min-height:100px;line-height:1.6;transition:border-color 0.2s;}
  .tf-textarea:focus{border-color:var(--accent);}

  /* Choice buttons */
  .choices{display:flex;flex-direction:column;gap:10px;max-width:540px;width:100%;}
  .choice-btn{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;padding:14px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all 0.15s;width:100%;}
  .choice-btn:hover{border-color:var(--accent);background:rgba(255,255,255,0.07);}
  .choice-btn.selected{border-color:var(--accent);background:rgba(255,255,255,0.1);color:var(--accent);}
  .choice-letter{width:26px;height:26px;border:1.5px solid currentColor;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;opacity:0.6;}

  /* Yes/No */
  .yesno-btns{display:flex;gap:14px;max-width:400px;}
  .yesno-btn{flex:1;padding:18px;border-radius:14px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:center;}
  .yesno-btn.yes:hover,.yesno-btn.yes.selected{border-color:#3ecf8e;background:rgba(62,207,142,0.1);color:#3ecf8e;}
  .yesno-btn.no:hover,.yesno-btn.no.selected{border-color:#ff4d6a;background:rgba(255,77,106,0.1);color:#ff4d6a;}

  /* Scale */
  .scale-grid{display:flex;gap:8px;flex-wrap:wrap;max-width:560px;}
  .scale-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:16px;cursor:pointer;transition:all 0.15s;font-family:inherit;}
  .scale-btn:hover{border-color:var(--accent);background:rgba(255,255,255,0.08);}
  .scale-btn.selected{border-color:var(--accent);background:rgba(255,255,255,0.15);color:var(--accent);font-weight:700;}
  .scale-labels{display:flex;justify-content:space-between;max-width:560px;margin-top:8px;font-size:12px;color:rgba(255,255,255,0.3);}

  /* CTA */
  .cta-btn{background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:var(--btn-radius);padding:16px 32px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:10px;transition:all 0.2s;margin-top:20px;}
  .cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.3);}
  .cta-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  /* Welcome/Ending */
  .welcome-screen{max-width:640px;width:100%;}
  .welcome-cover{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:28px;}
  .welcome-cover-img{width:100%;max-width:640px;height:var(--cover-h);object-fit:cover;object-position:var(--cover-pos);border-radius:var(--cover-r);margin-bottom:28px;display:block;}
  .ending-icon{font-size:64px;margin-bottom:24px;}
  .ending-screen{max-width:600px;width:100%;text-align:center;}

  /* Social sharing */
  .social-share{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap;}
  .share-btn{padding:12px 20px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;text-decoration:none;transition:all 0.15s;}
  .share-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3);}
  .share-btn.wa{background:#25D366;color:#fff;}
  .share-btn.fb{background:#1877F2;color:#fff;}
  .share-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;}
  .share-btn.copy{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}

  /* Loading/Error */
  .loading{display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.3);font-size:16px;}
  .error-box{text-align:center;max-width:420px;}
  .error-box h2{font-size:22px;margin-bottom:10px;color:#fff;}
  .error-box p{color:rgba(255,255,255,0.4);font-size:14px;line-height:1.6;}

  /* Branding */
  .brand{position:fixed;top:18px;left:22px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.2);letter-spacing:0.08em;}

  /* Multi-fields */
  .mf-group{display:flex;flex-direction:column;gap:22px;width:100%;max-width:540px;}
  .mf-row{display:flex;flex-direction:column;gap:5px;}
  .mf-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;}
  .mf-input{background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,0.15);color:#fff;font-size:17px;font-family:inherit;width:100%;padding:8px 0;outline:none;transition:border-color 0.2s;}
  .mf-input:focus{border-bottom-color:var(--accent);}
  .mf-input::placeholder{color:rgba(255,255,255,0.2);}
  .mf-textarea{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;width:100%;padding:10px 14px;outline:none;resize:vertical;min-height:70px;transition:border-color 0.2s;}
  .mf-textarea:focus{border-color:var(--accent);}
</style>
</head>
<body>
<div id="root"><div class="loading">Chargement...</div></div>
<script>
const SUPABASE_URL = 'https://esylzsacjkimcqxllhwd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzeWx6c2FjamtpbWNxeGxsaHdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMDE3MzEsImV4cCI6MjA5NTY3NzczMX0.Q06O-EywobZl0KigJcBnzCA81rXxcOluo4FupcNbr0w';

async function api(path, opts={}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', Accept: 'application/json', ...opts.headers },
    ...opts
  });
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : null;
}

const slug = new URLSearchParams(location.search).get('slug');
let form = null, questions = [], answers = {}, currentIdx = 0;
let submitting = false, submitted = false;
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const PAGE_URL = location.href;

function loadFont(family) {
  if (!family || family === 'Inter') return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family.replace(/\+/g,' '))}:wght@400;500;600;700;800&display=swap`;
  document.head.appendChild(link);
  const cssFamily = family.includes('+') ? `'${family.replace(/\+/g,' ')}'` : family;
  document.documentElement.style.setProperty('--font', `${cssFamily}, sans-serif`);
  document.body.style.fontFamily = `${cssFamily}, sans-serif`;
}

async function init() {
  if (!slug) { renderError('Formulaire introuvable','Aucun identifiant spécifié.'); return; }
  try {
    const forms = await api(`forms?slug=eq.${encodeURIComponent(slug)}&limit=1`);
    if (!forms || !forms.length) { renderError('Formulaire introuvable','Ce formulaire n\'existe pas.'); return; }
    form = forms[0];
    document.title = (form.title||'Questionnaire') + ' — Taya Fitness';
    const s = form.settings || {};
    const bgColor = s.bg_color || '#111';
    const accentColor = s.accent_color || '#e8c547';
    const btnColor = s.btn_color || accentColor;
    const btnTextColor = s.btn_text_color || '#000000';
    const btnRadius = s.btn_shape === 'sharp' ? '0px' : s.btn_shape === 'square' ? '6px' : s.btn_shape === 'rounded' ? '14px' : '50px';
    const coverH = (s.cover_height || 220) + 'px';
    const coverPos = s.cover_position || 'center center';
    const coverR = (s.cover_radius !== undefined ? s.cover_radius : 16) + 'px';
    const root = document.documentElement;
    root.style.setProperty('--bg', bgColor);
    root.style.setProperty('--accent', accentColor);
    root.style.setProperty('--accent2', accentColor);
    root.style.setProperty('--btn-bg', btnColor);
    root.style.setProperty('--btn-text', btnTextColor);
    root.style.setProperty('--btn-radius', btnRadius);
    root.style.setProperty('--cover-h', coverH);
    root.style.setProperty('--cover-pos', coverPos);
    root.style.setProperty('--cover-r', coverR);
    document.body.style.background = bgColor;
    loadFont(s.font_family);
    const qs = await api(`form_questions?form_id=eq.${form.id}&order=order_index`);
    questions = qs || [];
    if (form.homepage_title || form.description) {
      questions = [{id:'__home',type:'info_screen',title:form.homepage_title||form.title,description:form.homepage_description||form.description||'',required:false,_isHome:true}, ...questions];
    } else if (!questions.length || questions[0].type !== 'info_screen') {
      questions = [{id:'__home',type:'info_screen',title:form.title,description:form.description||'',required:false,_isHome:true}, ...questions];
    }
    questions = [...questions, {id:'__end',type:'__end',title:form.end_title||'Merci !',description:form.end_description||'Vos réponses ont bien été enregistrées.',required:false}];
    currentIdx = 0;
    renderStep();
  } catch(e) {
    console.error(e);
    renderError('Erreur de chargement','Impossible de charger le formulaire.');
  }
}

function getAnswerableQs() {
  return questions.filter(q => q.type !== 'info_screen' && q.type !== '__end' && !q._isHome);
}

function mediaHtml(q) {
  const url = q.settings && q.settings.media_url;
  if (!url) return '';
  const mt = q.settings.media_type || 'image';
  if (mt === 'youtube') {
    let vid = '';
    const m = url.match(/(?:v=|youtu\.be\/|embed\/)([^&?\s]+)/);
    if (m) vid = m[1];
    if (!vid) return `<div class="q-media" style="padding:10px;background:rgba(255,255,255,0.05);border-radius:14px;font-size:13px;color:rgba(255,255,255,0.5);">▶ ${esc(url)}</div>`;
    return `<div class="q-media"><iframe src="https://www.youtube.com/embed/${vid}?autoplay=0&rel=0" allowfullscreen></iframe></div>`;
  }
  if (mt === 'video') return `<div class="q-media"><video src="${esc(url)}" controls playsinline></video></div>`;
  return `<div class="q-media"><img src="${esc(url)}" onerror="this.parentNode.style.display='none'" /></div>`;
}

function renderStep() {
  const q = questions[currentIdx];
  if (!q) return;
  const answerableQs = getAnswerableQs();
  const ansIdx = answerableQs.indexOf(q);
  const total = answerableQs.length;
  const progress = questions.length <= 1 ? 100 : (currentIdx / (questions.length - 1)) * 100;
  const root = document.getElementById('root');

  if (q._isHome || (q.type === 'info_screen' && currentIdx === 0)) {
    const coverHtml = form.cover_url
      ? `<img src="${esc(form.cover_url)}" class="welcome-cover-img" onerror="this.style.display='none'" />`
      : `<div class="welcome-cover">🏋️</div>`;
    root.innerHTML = `
      <div class="progress-bar" style="width:${progress}%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen">
        <div class="welcome-screen">
          ${coverHtml}
          <div class="q-title">${esc(q.title)}</div>
          ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}
          <button class="cta-btn" onclick="goNext()">${esc(form.homepage_button||'Commencer')} <span>→</span></button>
        </div>
      </div>`;
  } else if (q.type === '__end') {
    const shareUrl = encodeURIComponent(PAGE_URL);
    const shareText = encodeURIComponent((form.title||'Questionnaire') + ' — ' + PAGE_URL);
    root.innerHTML = `

      <div class="brand">TAYA FITNESS</div>
      <div class="screen" style="text-align:center;">
        <div class="ending-screen">
          <div class="ending-icon">✅</div>
          <div class="q-title" style="text-align:center;">${esc(q.title)}</div>

          <div class="social-share">

              Facebook
            </a>
            <a class="share-btn ig" href="https://www.instagram.com/" target="_blank" rel="noopener">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              Instagram
            </a>
            <button class="share-btn copy" onclick="navigator.clipboard.writeText('${esc(PAGE_URL)}').then(()=>{this.textContent='✅ Copié !';setTimeout(()=>{this.innerHTML='<svg width=\\'16\\' height=\\'16\\' viewBox=\\'0 0 24 24\\' fill=\\'currentColor\\'><path d=\\'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z\\'/></svg> Copier le lien';},2500);}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              Copier le lien
            </button>
          </div>
        </div>
      </div>`;
  } else if (q.type === 'info_screen') {
    root.innerHTML = `
      <div class="progress-bar" style="width:${progress}%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen">
        <div class="welcome-screen">
          ${mediaHtml(q)}
          <div class="q-step">Information</div>
          <div class="q-title">${esc(q.title)}</div>
          ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}
          <button class="cta-btn" onclick="goNext()">Continuer →</button>
        </div>
      </div>
      <div class="nav-bar">
        ${currentIdx > 0 ? `<button class="nav-btn back" onclick="goPrev()">↑</button>` : ''}
      </div>`;
  } else {
    const stepLabel = `${ansIdx + 1} / ${total}`;
    const required = q.required ? '<span class="required-star">*</span>' : '';
    const inputHtml = buildInputHtml(q);
    const showHint = ['short_answer','long_answer','email','phone','multi_fields'].includes(q.type);
    root.innerHTML = `
      <div class="progress-bar" style="width:${progress}%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen">
        <div class="q-step">${stepLabel}</div>
        ${mediaHtml(q)}
        <div class="q-title">${esc(q.title)}${required}</div>
        ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}
        ${inputHtml}
        ${showHint ? '<p class="hint">Appuyez sur <kbd>Entrée ↵</kbd> pour continuer</p>' : ''}
      </div>
      <div class="nav-bar">
        ${currentIdx > 0 ? `<button class="nav-btn back" onclick="goPrev()">↑</button>` : ''}
        <button class="nav-btn next" onclick="goNext()" id="next-btn">↓</button>
      </div>`;
    focusInput(q);
  }
}

function buildInputHtml(q) {
  const cur = answers[q.id];
  switch(q.type) {
    case 'short_answer':
      return `<input class="tf-input" type="text" placeholder="Votre réponse..." value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input" autocomplete="off"/>`;
    case 'long_answer':
      return `<textarea class="tf-textarea" placeholder="Votre réponse..." oninput="setAnswer('${q.id}',this.value)" id="main-input">${esc(cur||'')}</textarea>`;
    case 'email':
      return `<input class="tf-input" type="email" placeholder="votre@email.com" value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
    case 'phone':
      return `<input class="tf-input" type="tel" placeholder="+33 6 00 00 00 00" value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
    case 'date':
      return `<input class="tf-input" type="date" value="${esc(cur||'')}" onchange="setAnswer('${q.id}',this.value)" id="main-input" style="font-size:16px;color-scheme:dark;"/>`;
    case 'single_choice':
      return `<div class="choices">${(q.options||[]).map((opt,i)=>`
        <button class="choice-btn ${cur===opt?'selected':''}" onclick="selectSingle('${q.id}','${escAttr(opt)}')">
          <span class="choice-letter">${LETTERS[i]||i+1}</span>${esc(opt)}
        </button>`).join('')}</div>`;
    case 'multiple_choice':
      return `<div class="choices">${(q.options||[]).map((opt,i)=>`
        <button class="choice-btn ${Array.isArray(cur)&&cur.includes(opt)?'selected':''}" onclick="selectMulti('${q.id}','${escAttr(opt)}')">
          <span class="choice-letter">${LETTERS[i]||i+1}</span>${esc(opt)}
        </button>`).join('')}</div><p class="hint" style="margin-top:14px;">Plusieurs choix possibles</p>`;
    case 'yesno':
      return `<div class="yesno-btns">
        <button class="yesno-btn yes ${cur===true||cur==='oui'?'selected':''}" onclick="setAnswer('${q.id}','oui');renderStep()">👍 Oui</button>
        <button class="yesno-btn no ${cur===false||cur==='non'?'selected':''}" onclick="setAnswer('${q.id}','non');setTimeout(()=>goNext(),280)">👎 Non</button>
      </div>`;
    case 'rating': {
      const min = q.settings?.min ?? 1, max = q.settings?.max ?? 5;
      const nums = [];
      for(let n=min;n<=max;n++) nums.push(n);
      return `<div>
        <div class="scale-grid">${nums.map(n=>`<button class="scale-btn ${cur===n?'selected':''}" onclick="setAnswer('${q.id}',${n});renderStep()">${n}</button>`).join('')}</div>
        <div class="scale-labels"><span>${min}</span><span>${max}</span></div>
      </div>`;
    }
    case 'multi_fields': {
      const fields = (q.settings && q.settings.fields) || [];
      const curVal = (typeof cur === 'object' && cur !== null && !Array.isArray(cur)) ? cur : {};
      return `<div class="mf-group">${fields.map(f => `
        <div class="mf-row">
          <label class="mf-label">${esc(f.label)}</label>
          ${f.type === 'textarea'
            ? `<textarea class="mf-textarea" placeholder="" oninput="setMultiField('${q.id}','${escAttr(f.label)}',this.value)">${esc(curVal[f.label]||'')}</textarea>`
            : `<input class="mf-input" type="${esc(f.type||'text')}" placeholder="" value="${esc(curVal[f.label]||'')}" oninput="setMultiField('${q.id}','${escAttr(f.label)}',this.value)"/>`
          }
        </div>`).join('')}</div>`;
    }
    default:
      return `<input class="tf-input" type="text" placeholder="Votre réponse..." value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
  }
}

function focusInput(q) {
  if (['short_answer','long_answer','email','phone'].includes(q.type)) {
    const el = document.getElementById('main-input');
    if (el) { el.focus(); if (el.tagName==='INPUT') { el.selectionStart=el.selectionEnd=el.value.length; } }
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function setAnswer(id, val) { answers[id] = val; }
function setMultiField(qid, label, value) {
  const cur = (typeof answers[qid] === 'object' && answers[qid] !== null && !Array.isArray(answers[qid])) ? answers[qid] : {};
  answers[qid] = {...cur, [label]: value};
}

function selectSingle(id, opt) {
  answers[id] = opt;
  setTimeout(() => goNext(), 320);
  renderStep();
}

function selectMulti(id, opt) {
  const cur = Array.isArray(answers[id]) ? answers[id] : [];
  const idx = cur.indexOf(opt);
  answers[id] = idx >= 0 ? cur.filter(v=>v!==opt) : [...cur, opt];
  renderStep();
}

function validate(q) {
  if (!q.required) return true;
  if (q.type === 'info_screen' || q.type === '__end' || q._isHome) return true;
  if (q.type === 'multi_fields') {
    const ans = answers[q.id];
    if (!ans || typeof ans !== 'object') return false;
    return Object.values(ans).some(v => v && String(v).trim() !== '');
  }
  const ans = answers[q.id];
  if (ans === undefined || ans === null || ans === '') return false;
  if (Array.isArray(ans) && ans.length === 0) return false;
  return true;
}

function goNext() {
  const q = questions[currentIdx];
  if (q && !q._isHome && q.type !== 'info_screen' && q.type !== '__end') {
    if (!validate(q)) { shakeInput(); return; }
  }
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    if (questions[currentIdx]?.type === '__end') submitResponses();
    renderStep();
  }
}

function goPrev() {
  if (currentIdx > 0) { currentIdx--; renderStep(); }
}

function shakeInput() {
  const el = document.getElementById('main-input') || document.querySelector('.choices') || document.querySelector('.yesno-btns');
  if (!el) return;
  el.style.borderBottomColor = '#e05252';
  el.style.borderColor = '#e05252';
  setTimeout(() => { el.style.borderBottomColor = ''; el.style.borderColor = ''; }, 900);
}

async function submitResponses() {
  if (submitting || submitted) return;
  submitting = true;
  const realQs = questions.filter(q => !q._isHome && q.type !== '__end');
  let respondent_name = null, respondent_email = null;
  for (const q of realQs) {
    if (q.type === 'email' && answers[q.id]) respondent_email = answers[q.id];
    if (q.type === 'short_answer' && answers[q.id] && !respondent_name) respondent_name = answers[q.id];
    if (q.type === 'multi_fields' && answers[q.id] && typeof answers[q.id] === 'object') {
      const fields = q.settings?.fields || [];
      const nomF = fields.find(f => /nom|pr[eé]nom|name/i.test(f.label));
      if (nomF && answers[q.id][nomF.label] && !respondent_name) respondent_name = answers[q.id][nomF.label];
      const emailF = fields.find(f => /email|mail|@/i.test(f.label));
      if (emailF && answers[q.id][emailF.label] && !respondent_email) respondent_email = answers[q.id][emailF.label];
    }
  }
  const cleanAnswers = {};
  for (const q of realQs) {
    if (answers[q.id] !== undefined) cleanAnswers[q.id] = answers[q.id];
  }
  try {
    await api('form_responses', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ form_id: form.id, answers: cleanAnswers, respondent_name, respondent_email, completed_at: new Date().toISOString() })
    });
    submitted = true;
  } catch(e) { console.error('Submit error', e); }
  submitting = false;
}

function renderError(title, msg) {
  document.getElementById('root').innerHTML = `
    <div class="screen" style="text-align:center;">
      <div class="error-box">
        <div style="font-size:48px;margin-bottom:16px;">❌</div>
        <h2>${esc(title)}</h2>
        <p>${esc(msg)}</p>
      </div>
    </div>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
    const q = questions[currentIdx];
    if (q && !['multiple_choice','rating'].includes(q.type)) goNext();
  }
});

init();
</script>
</body>
</html>
