<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Questionnaire — Taya Fitness</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#111;--accent:#e8c547;--accent2:#d4af37;}
  html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:#fff;overflow:hidden;}
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  #root{height:100%;display:flex;flex-direction:column;}
  .screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:left;animation:fadeIn 0.35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-16px);}}
  .screen.out{animation:fadeOut 0.25s ease forwards;}

  .progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.4s ease;z-index:100;}
  .nav-bar{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;z-index:100;}
  .nav-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .nav-btn.back{background:rgba(255,255,255,0.1);color:#aaa;}
  .nav-btn.back:hover{background:rgba(255,255,255,0.15);}
  .nav-btn.next{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;}
  .nav-btn.next:hover{transform:scale(1.05);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;}

  .q-step{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:8px;}
  .q-title{font-size:clamp(20px,4vw,32px);font-weight:700;line-height:1.3;margin-bottom:10px;max-width:620px;}
  .q-desc{font-size:15px;color:#aaa;margin-bottom:28px;max-width:540px;line-height:1.6;white-space:pre-line;}
  .required-star{color:var(--accent);margin-left:4px;}
  .hint{font-size:12px;color:#555;margin-top:10px;display:flex;align-items:center;gap:6px;}
  .hint kbd{background:rgba(255,255,255,0.08);border:1px solid #333;border-radius:4px;padding:2px 7px;font-family:inherit;font-size:11px;}

  /* Inputs */
  .tf-input{background:transparent;border:none;border-bottom:2px solid #333;color:#fff;font-size:20px;font-family:inherit;width:100%;max-width:500px;padding:10px 0;outline:none;transition:border-color 0.2s;}
  .tf-input:focus{border-bottom-color:var(--accent);}
  .tf-input::placeholder{color:#444;}
  .tf-textarea{background:rgba(255,255,255,0.04);border:1.5px solid #333;border-radius:12px;color:#fff;font-size:16px;font-family:inherit;width:100%;max-width:540px;padding:14px 16px;outline:none;resize:vertical;min-height:100px;line-height:1.6;transition:border-color 0.2s;}
  .tf-textarea:focus{border-color:var(--accent);}

  /* Choice buttons */
  .choices{display:flex;flex-direction:column;gap:10px;max-width:540px;width:100%;}
  .choice-btn{background:rgba(255,255,255,0.05);border:1.5px solid #333;border-radius:12px;color:#fff;font-size:15px;font-family:inherit;padding:14px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all 0.15s;width:100%;}
  .choice-btn:hover{border-color:var(--accent);background:rgba(255,255,255,0.07);}
  .choice-btn.selected{border-color:var(--accent);background:rgba(255,255,255,0.12);color:var(--accent);}
  .choice-letter{width:26px;height:26px;border:1.5px solid currentColor;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;opacity:0.6;}

  /* Yes/No */
  .yesno-btns{display:flex;gap:14px;max-width:400px;}
  .yesno-btn{flex:1;padding:18px;border-radius:14px;border:2px solid #333;background:rgba(255,255,255,0.04);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:center;}
  .yesno-btn.yes:hover,.yesno-btn.yes.selected{border-color:#3ecf8e;background:rgba(62,207,142,0.1);color:#3ecf8e;}
  .yesno-btn.no:hover,.yesno-btn.no.selected{border-color:#ff4d6a;background:rgba(255,77,106,0.1);color:#ff4d6a;}

  /* Scale */
  .scale-grid{display:flex;gap:8px;flex-wrap:wrap;max-width:560px;}
  .scale-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid #333;background:rgba(255,255,255,0.05);color:#fff;font-size:16px;cursor:pointer;transition:all 0.15s;font-family:inherit;}
  .scale-btn:hover{border-color:var(--accent);background:rgba(255,255,255,0.08);}
  .scale-btn.selected{border-color:var(--accent);background:rgba(255,255,255,0.18);color:var(--accent);font-weight:700;}
  .scale-labels{display:flex;justify-content:space-between;max-width:560px;margin-top:8px;font-size:12px;color:#555;}

  /* CTA */
  .cta-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s;margin-top:16px;}
  .cta-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .cta-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  /* Welcome/Ending */
  .welcome-screen{max-width:640px;width:100%;}
  .welcome-cover{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:28px;}
  .welcome-cover-img{width:100%;max-width:640px;height:200px;object-fit:cover;border-radius:20px;margin-bottom:28px;display:block;}
  .ending-icon{font-size:60px;margin-bottom:20px;}

  /* Loading/Error */
  .loading{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:16px;}
  .error-box{text-align:center;max-width:420px;}
  .error-box h2{font-size:22px;margin-bottom:10px;color:#fff;}
  .error-box p{color:#666;font-size:14px;line-height:1.6;}

  /* Branding */
  .brand{position:fixed;top:18px;left:22px;font-size:13px;font-weight:700;color:#333;letter-spacing:0.05em;}
</style>
</head>
<body>
<div id="root"><div class="loading">Chargement...</div></div>
<script>
const SUPABASE_URL = 'https://esylzsacjkimcqxllhwd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzeWx6c2FjamtpbWNxeGxsaHdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMDE3MzEsImV4cCI6MjA5NTY3NzczMX0.Q06O-EywobZl0KigJcBnzCA81rXxcOluo4FupcNbr0w';

async function api(path, opts={}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', Accept: 'application/json', ...opts.headers },
    ...opts
  });
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : null;
}

const slug = new URLSearchParams(location.search).get('slug');
let form = null, questions = [], answers = {}, currentIdx = 0;
let submitting = false, submitted = false;
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

async function init() {
  if (!slug) { renderError('Formulaire introuvable','Aucun identifiant spécifié.'); return; }
  try {
    const forms = await api(`forms?slug=eq.${encodeURIComponent(slug)}&limit=1`);
    if (!forms || !forms.length) { renderError('Formulaire introuvable','Ce formulaire n\'existe pas.'); return; }
    form = forms[0];
    document.title = (form.title||'Questionnaire') + ' — Taya Fitness';
    // Apply custom colors from form settings
    const bgColor = (form.settings && form.settings.bg_color) || '#111';
    const accentColor = (form.settings && form.settings.accent_color) || '#e8c547';
    document.documentElement.style.setProperty('--bg', bgColor);
    document.documentElement.style.setProperty('--accent', accentColor);
    document.documentElement.style.setProperty('--accent2', accentColor);
    document.body.style.background = bgColor;
    const qs = await api(`form_questions?form_id=eq.${form.id}&order=order_index`);
    questions = qs || [];
    // Inject homepage as first virtual screen if needed
    if (form.homepage_title || form.description) {
      questions = [{id:'__home',type:'info_screen',title:form.homepage_title||form.title,description:form.homepage_description||form.description||'',required:false,_isHome:true}, ...questions];
    } else if (!questions.length || questions[0].type !== 'info_screen') {
      questions = [{id:'__home',type:'info_screen',title:form.title,description:form.description||'',required:false,_isHome:true}, ...questions];
    }
    // Append ending screen
    questions = [...questions, {id:'__end',type:'__end',title:form.end_title||'Merci !',description:form.end_description||'Vos réponses ont bien été enregistrées.',required:false}];
    currentIdx = 0;
    renderStep();
  } catch(e) {
    console.error(e);
    renderError('Erreur de chargement','Impossible de charger le formulaire. Vérifiez votre connexion.');
  }
}

function getAnswerableQs() {
  return questions.filter(q => q.type !== 'info_screen' && q.type !== '__end' && !q._isHome);
}

function renderStep() {
  const q = questions[currentIdx];
  if (!q) return;
  const answerableQs = getAnswerableQs();
  const ansIdx = answerableQs.indexOf(q);
  const total = answerableQs.length;
  const progress = questions.length <= 1 ? 100 : (currentIdx / (questions.length - 1)) * 100;
  const root = document.getElementById('root');

  if (q._isHome || (q.type === 'info_screen' && currentIdx === 0)) {
    // Welcome screen
    const coverHtml = form.cover_url
      ? `<img src="${esc(form.cover_url)}" class="welcome-cover-img" onerror="this.style.display='none'" />`
      : `<div class="welcome-cover">🏋️</div>`;
    root.innerHTML = `
      <div class="progress-bar" style="width:${progress}%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen">
        <div class="welcome-screen">
          ${coverHtml}
          <div class="q-title">${esc(q.title)}</div>
          ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}
          <button class="cta-btn" onclick="goNext()">${esc(form.homepage_button||'Commencer')} <span>→</span></button>
        </div>
      </div>`;
  } else if (q.type === '__end') {
    root.innerHTML = `
      <div class="progress-bar" style="width:100%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen" style="text-align:center;">
        <div class="ending-icon">✅</div>
        <div class="q-title" style="text-align:center;">${esc(q.title)}</div>
        ${q.description ? `<div class="q-desc" style="text-align:center;">${esc(q.description)}</div>` : ''}
      </div>`;
  } else if (q.type === 'info_screen') {
    root.innerHTML = `
      <div class="progress-bar" style="width:${progress}%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen">
        <div class="welcome-screen">
          <div class="q-step">Information</div>
          <div class="q-title">${esc(q.title)}</div>
          ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}
          <button class="cta-btn" onclick="goNext()">Continuer →</button>
        </div>
      </div>
      <div class="nav-bar">
        ${currentIdx > 0 ? `<button class="nav-btn back" onclick="goPrev()">↑</button>` : ''}
      </div>`;
  } else {
    const stepLabel = `${ansIdx + 1} / ${total}`;
    const required = q.required ? '<span class="required-star">*</span>' : '';
    const inputHtml = buildInputHtml(q);
    const showHint = ['short_answer','long_answer','email','phone'].includes(q.type);
    root.innerHTML = `
      <div class="progress-bar" style="width:${progress}%"></div>
      <div class="brand">TAYA FITNESS</div>
      <div class="screen">
        <div class="q-step">${stepLabel}</div>
        <div class="q-title">${esc(q.title)}${required}</div>
        ${q.description ? `<div class="q-desc">${esc(q.description)}</div>` : ''}
        ${inputHtml}
        ${showHint ? '<p class="hint">Appuyez sur <kbd>Entrée ↵</kbd> pour continuer</p>' : ''}
      </div>
      <div class="nav-bar">
        ${currentIdx > 0 ? `<button class="nav-btn back" onclick="goPrev()">↑</button>` : ''}
        <button class="nav-btn next" onclick="goNext()" id="next-btn">↓</button>
      </div>`;
    focusInput(q);
  }
}

function buildInputHtml(q) {
  const cur = answers[q.id];
  switch(q.type) {
    case 'short_answer':
      return `<input class="tf-input" type="text" placeholder="Votre réponse..." value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input" autocomplete="off"/>`;
    case 'long_answer':
      return `<textarea class="tf-textarea" placeholder="Votre réponse..." oninput="setAnswer('${q.id}',this.value)" id="main-input">${esc(cur||'')}</textarea>`;
    case 'email':
      return `<input class="tf-input" type="email" placeholder="votre@email.com" value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
    case 'phone':
      return `<input class="tf-input" type="tel" placeholder="+33 6 00 00 00 00" value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
    case 'date':
      return `<input class="tf-input" type="date" value="${esc(cur||'')}" onchange="setAnswer('${q.id}',this.value)" id="main-input" style="font-size:16px;"/>`;
    case 'single_choice':
      return `<div class="choices">${(q.options||[]).map((opt,i)=>`
        <button class="choice-btn ${cur===opt?'selected':''}" onclick="selectSingle('${q.id}','${escAttr(opt)}')">
          <span class="choice-letter">${LETTERS[i]||i+1}</span>${esc(opt)}
        </button>`).join('')}</div>`;
    case 'multiple_choice':
      return `<div class="choices">${(q.options||[]).map((opt,i)=>`
        <button class="choice-btn ${Array.isArray(cur)&&cur.includes(opt)?'selected':''}" onclick="selectMulti('${q.id}','${escAttr(opt)}')">
          <span class="choice-letter">${LETTERS[i]||i+1}</span>${esc(opt)}
        </button>`).join('')}</div><p class="hint" style="margin-top:14px;">Plusieurs choix possibles</p>`;
    case 'yesno':
      return `<div class="yesno-btns">
        <button class="yesno-btn yes ${cur===true||cur==='oui'?'selected':''}" onclick="setAnswer('${q.id}','oui');renderStep()">👍 Oui</button>
        <button class="yesno-btn no ${cur===false||cur==='non'?'selected':''}" onclick="setAnswer('${q.id}','non');setTimeout(()=>goNext(),280)">👎 Non</button>
      </div>`;
    case 'rating': {
      const min = q.settings?.min ?? 1, max = q.settings?.max ?? 5;
      const nums = [];
      for(let n=min;n<=max;n++) nums.push(n);
      return `<div>
        <div class="scale-grid">${nums.map(n=>`<button class="scale-btn ${cur===n?'selected':''}" onclick="setAnswer('${q.id}',${n});renderStep()">${n}</button>`).join('')}</div>
        <div class="scale-labels"><span>${min}</span><span>${max}</span></div>
      </div>`;
    }
    default:
      return `<input class="tf-input" type="text" placeholder="Votre réponse..." value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
  }
}

function focusInput(q) {
  if (['short_answer','long_answer','email','phone'].includes(q.type)) {
    const el = document.getElementById('main-input');
    if (el) { el.focus(); if (el.tagName==='INPUT') { el.selectionStart=el.selectionEnd=el.value.length; } }
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function setAnswer(id, val) { answers[id] = val; }

function selectSingle(id, opt) {
  answers[id] = opt;
  setTimeout(() => goNext(), 320);
  renderStep();
}

function selectMulti(id, opt) {
  const cur = Array.isArray(answers[id]) ? answers[id] : [];
  const idx = cur.indexOf(opt);
  answers[id] = idx >= 0 ? cur.filter(v=>v!==opt) : [...cur, opt];
  renderStep();
}

function validate(q) {
  if (!q.required) return true;
  if (q.type === 'info_screen' || q.type === '__end' || q._isHome) return true;
  const ans = answers[q.id];
  if (ans === undefined || ans === null || ans === '') return false;
  if (Array.isArray(ans) && ans.length === 0) return false;
  return true;
}

function goNext() {
  const q = questions[currentIdx];
  if (q && !q._isHome && q.type !== 'info_screen' && q.type !== '__end') {
    if (!validate(q)) { shakeInput(); return; }
  }
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    if (questions[currentIdx]?.type === '__end') {
      submitResponses();
    }
    renderStep();
  }
}

function goPrev() {
  if (currentIdx > 0) { currentIdx--; renderStep(); }
}

function shakeInput() {
  const el = document.getElementById('main-input') || document.querySelector('.choices') || document.querySelector('.yesno-btns');
  if (!el) return;
  el.style.borderBottomColor = '#e05252';
  el.style.borderColor = '#e05252';
  setTimeout(() => { el.style.borderBottomColor = ''; el.style.borderColor = ''; }, 900);
}

async function submitResponses() {
  if (submitting || submitted) return;
  submitting = true;
  // Find name and email from answers
  const realQs = questions.filter(q => !q._isHome && q.type !== '__end');
  let respondent_name = null, respondent_email = null;
  for (const q of realQs) {
    if (q.type === 'email' && answers[q.id]) respondent_email = answers[q.id];
    if (q.type === 'short_answer' && answers[q.id] && !respondent_name) respondent_name = answers[q.id];
  }
  // Build clean answers (exclude virtual questions)
  const cleanAnswers = {};
  for (const q of realQs) {
    if (answers[q.id] !== undefined) cleanAnswers[q.id] = answers[q.id];
  }
  try {
    await api('form_responses', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({
        form_id: form.id,
        answers: cleanAnswers,
        respondent_name,
        respondent_email,
        completed_at: new Date().toISOString()
      })
    });
    submitted = true;
  } catch(e) { console.error('Submit error', e); }
  submitting = false;
}

function renderError(title, msg) {
  document.getElementById('root').innerHTML = `
    <div class="screen" style="text-align:center;">
      <div class="error-box">
        <div style="font-size:48px;margin-bottom:16px;">❌</div>
        <h2>${esc(title)}</h2>
        <p>${esc(msg)}</p>
      </div>
    </div>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
    const q = questions[currentIdx];
    if (q && !['multiple_choice','rating'].includes(q.type)) goNext();
  }
});

init();
</script>
</body>
</html>
