<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Questionnaire — Taya Fitness</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#111;--accent:#e8c547;--accent2:#d4af37;--font:'Inter',sans-serif;--title-font:'Inter',sans-serif;--font-weight:400;--title-font-weight:700;--font-style:normal;--title-font-style:normal;--text-color:#fff;--title-color:#fff;--desc-color:rgba(255,255,255,0.65);--btn-bg:var(--accent);--btn-text:#000;--btn-radius:50px;--cover-h:220px;--cover-pos:center center;--cover-r:16px;}
  html,body{height:100%;font-family:var(--font);font-weight:var(--font-weight);font-style:var(--font-style);background:var(--bg);color:var(--text-color);overflow:hidden;}

  #root{height:100%;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .screen{min-height:100%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:left;animation:fadeIn 0.35s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-16px);}}
  .screen.out{animation:fadeOut 0.25s ease forwards;}

  .progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.4s ease;z-index:100;}
  .nav-bar{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;z-index:100;}
  .nav-btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .nav-btn.back{background:rgba(255,255,255,0.1);color:#aaa;}
  .nav-btn.back:hover{background:rgba(255,255,255,0.15);}
  .nav-btn.next{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;}
  .nav-btn.next:hover{transform:scale(1.05);}
  .nav-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none!important;}

  .q-step{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:8px;}
  .q-title{font-size:clamp(20px,4vw,32px);font-weight:var(--title-font-weight);font-family:var(--title-font);font-style:var(--title-font-style);color:var(--title-color);line-height:1.3;margin-bottom:10px;max-width:620px;}
  .q-desc{font-size:15px;color:var(--desc-color);margin-bottom:28px;max-width:540px;line-height:1.6;white-space:pre-line;}
  .required-star{color:var(--accent);margin-left:4px;}
  .hint{font-size:12px;color:rgba(255,255,255,0.35);margin-top:10px;display:flex;align-items:center;gap:6px;}
  .hint kbd{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:2px 7px;font-family:inherit;font-size:11px;}

  /* Media per question */
  .q-media{width:100%;max-width:540px;margin-bottom:20px;border-radius:14px;overflow:hidden;}
  .q-media img{width:100%;max-height:220px;object-fit:cover;object-position:var(--cover-pos);display:block;}
  .q-media video{width:100%;max-height:220px;object-fit:cover;display:block;border-radius:14px;}
  .q-media iframe{width:100%;height:220px;border:none;border-radius:14px;display:block;}

  /* Inputs */
  .tf-input{background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,0.15);color:#fff;font-size:20px;font-family:inherit;width:100%;max-width:500px;padding:10px 0;outline:none;transition:border-color 0.2s;}
  .tf-input:focus{border-bottom-color:var(--accent);}
  .tf-input::placeholder{color:rgba(255,255,255,0.25);}
  .tf-textarea{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.12);border-radius:12px;color:#fff;font-size:16px;font-family:inherit;width:100%;max-width:540px;padding:14px 16px;outline:none;resize:vertical;min-height:100px;line-height:1.6;transition:border-color 0.2s;}
  .tf-textarea:focus{border-color:var(--accent);}

  /* Choice buttons */
  .choices{display:flex;flex-direction:column;gap:10px;max-width:540px;width:100%;}
  .choice-btn{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;padding:14px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all 0.15s;width:100%;}
  .choice-btn:hover{border-color:var(--accent);background:rgba(255,255,255,0.07);}
  .choice-btn.selected{border-color:var(--accent);background:rgba(255,255,255,0.1);color:var(--accent);}
  .choice-letter{width:26px;height:26px;border:1.5px solid currentColor;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;opacity:0.6;}

  /* Yes/No */
  .yesno-btns{display:flex;gap:14px;max-width:400px;}
  .yesno-btn{flex:1;padding:18px;border-radius:14px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:center;}
  .yesno-btn.yes:hover,.yesno-btn.yes.selected{border-color:#3ecf8e;background:rgba(62,207,142,0.1);color:#3ecf8e;}
  .yesno-btn.no:hover,.yesno-btn.no.selected{border-color:#ff4d6a;background:rgba(255,77,106,0.1);color:#ff4d6a;}

  /* Scale */
  .scale-grid{display:flex;gap:8px;flex-wrap:wrap;max-width:560px;}
  .scale-btn{width:46px;height:46px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:16px;cursor:pointer;transition:all 0.15s;font-family:inherit;}
  .scale-btn:hover{border-color:var(--accent);background:rgba(255,255,255,0.08);}
  .scale-btn.selected{border-color:var(--accent);background:rgba(255,255,255,0.15);color:var(--accent);font-weight:700;}
  .scale-labels{display:flex;justify-content:space-between;max-width:560px;margin-top:8px;font-size:12px;color:rgba(255,255,255,0.3);}

  /* CTA */
  .cta-btn{background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:var(--btn-radius);padding:16px 32px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:10px;transition:all 0.2s;margin-top:20px;}
  .cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.3);}
  .cta-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

  /* Welcome/Ending */
  .welcome-screen{max-width:640px;width:100%;}
  .welcome-cover-img{width:100%;max-width:640px;height:var(--cover-h);object-fit:cover;object-position:var(--cover-pos);border-radius:var(--cover-r);margin-bottom:28px;display:block;}
  .ending-mark{color:var(--accent);margin-bottom:22px;display:flex;justify-content:center;}
  .ending-screen{max-width:600px;width:100%;text-align:center;}

  /* Social sharing */
  .social-share{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap;}
  .share-btn{padding:12px 20px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;text-decoration:none;transition:all 0.15s;}
  .share-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3);}
  .share-btn.wa{background:#25D366;color:#fff;}
  .share-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;}

  /* Cartes de formule : survol, selection, paiement direct */
  .plan-card{position:relative;border-radius:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:16px 18px;cursor:pointer;text-align:left;transition:transform 0.28s ease,border-color 0.28s ease,box-shadow 0.28s ease,background 0.28s ease;}
  .plan-card.reco{border-width:2px;border-color:var(--accent);background:rgba(255,255,255,0.1);padding:20px 18px 16px;box-shadow:0 12px 34px rgba(0,0,0,0.35);}
  @media (hover:hover){
    .plan-card:hover{transform:translateY(-3px) scale(1.02);border-color:var(--accent);background:rgba(255,255,255,0.09);box-shadow:0 16px 38px rgba(0,0,0,0.4);}
  }
  .plan-card.selected{transform:scale(1.02);border-color:var(--accent);background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px var(--accent-soft),0 16px 38px rgba(0,0,0,0.4);}
  .plan-badge{position:absolute;top:-11px;left:18px;background:var(--accent);color:var(--btn-text);font-size:10px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:0.06em;white-space:nowrap;}
  .plan-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .plan-name{font-size:15px;font-weight:700;color:#fff;}
  .plan-card.reco .plan-name{font-size:17px;}
  .plan-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;}
  .plan-price{font-size:20px;font-weight:800;color:var(--accent);}
  .plan-card.reco .plan-price{font-size:22px;}
  .plan-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .plan-btn{border-radius:var(--btn-radius);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:10px 14px;transition:filter 0.2s,transform 0.2s;}
  .plan-btn:hover{filter:brightness(1.08);}
  .plan-btn:active{transform:scale(0.98);}
  .plan-btn:disabled{opacity:0.6;cursor:progress;}
  .plan-btn.ghost{flex:1;min-width:120px;border:1px solid rgba(255,255,255,0.25);background:transparent;color:#fff;font-weight:600;}
  .plan-btn.go{flex:2;min-width:150px;border:none;background:var(--btn-bg);color:var(--btn-text);}
  .plan-card.reco .plan-btn.go{padding:12px 14px;font-size:13px;}
  .plan-secure{font-size:11px;color:rgba(255,255,255,0.4);margin-top:10px;text-align:center;}
  @media (prefers-reduced-motion: reduce){
    .plan-card,.plan-card:hover,.plan-card.selected,.plan-btn{transition:none;transform:none;}
  }

  /* Loading/Error */
  .loading{display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.3);font-size:16px;}
  .error-box{text-align:center;max-width:420px;}
  .error-box h2{font-size:22px;margin-bottom:10px;color:#fff;}
  .error-box p{color:rgba(255,255,255,0.4);font-size:14px;line-height:1.6;}

  .rgpd{margin-top:22px;max-width:560px;font-size:11px;line-height:1.6;color:rgba(255,255,255,0.32);}
  .rgpd a{color:rgba(255,255,255,0.5);text-decoration:underline;}

  /* Branding */
  .brand{position:fixed;top:18px;left:22px;pointer-events:none;z-index:5;font-size:12px;font-weight:700;color:rgba(255,255,255,0.2);letter-spacing:0.08em;}

  /* Multi-fields */
  .mf-group{display:flex;flex-direction:column;gap:22px;width:100%;max-width:540px;}
  .mf-row{display:flex;flex-direction:column;gap:5px;}
  .mf-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;}
  .mf-input{background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,0.15);color:#fff;font-size:17px;font-family:inherit;width:100%;padding:8px 0;outline:none;transition:border-color 0.2s;}
  .mf-input:focus{border-bottom-color:var(--accent);}
  .mf-input::placeholder{color:rgba(255,255,255,0.2);}
  .mf-textarea{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;width:100%;padding:10px 14px;outline:none;resize:vertical;min-height:70px;transition:border-color 0.2s;}
  .mf-textarea:focus{border-color:var(--accent);}
</style>
</head>
<body>
<div id="root"><div class="loading">Chargement...</div></div>
<script>
const SUPABASE_URL = 'https://esylzsacjkimcqxllhwd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzeWx6c2FjamtpbWNxeGxsaHdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMDE3MzEsImV4cCI6MjA5NTY3NzczMX0.Q06O-EywobZl0KigJcBnzCA81rXxcOluo4FupcNbr0w';

async function api(path, opts={}) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', Accept: 'application/json', ...opts.headers },
    ...opts
  });
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : null;
}

const slug = new URLSearchParams(location.search).get('slug');
let form = null, questions = [], answers = {}, currentIdx = 0;
let submitting = false, submitted = false;
// Identite laissee dans le questionnaire : elle sert au CRM puis a Stripe.
let identiteProspect = null;
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const PAGE_URL = location.href;

/* Information RGPD (art. 13) affichee avant la premiere question : qui
   collecte, pourquoi, combien de temps, et comment exercer ses droits.
   Le detail complet vit dans les mentions legales du site. */
const MENTION_RGPD =
  'En poursuivant, tu acceptes que Sarah Paulmier — Taya Fitness enregistre tes réponses et tes coordonnées ' +
  'pour établir ton bilan, te recontacter et te présenter ses offres de coaching. Tes données ne sont ni ' +
  'vendues ni transmises à des tiers, et sont conservées 3 ans après notre dernier échange. Tu peux à tout ' +
  'moment y accéder, les corriger, les supprimer ou t\'opposer à leur utilisation en écrivant à ' +
  '<a href="mailto:contact@tayafitness.com">contact@tayafitness.com</a>, et te désinscrire des emails en un clic. ' +
  '<a href="/mentions-legales#donnees" target="_blank" rel="noopener">En savoir plus</a>.';

/* Une couleur d'accent peut arriver en #abc, #aabbcc ou deja en rgb() :
   on en tire une version translucide pour le halo de selection. */
function accentRgba(couleur, alpha) {
  let c = String(couleur || '').trim();
  if (c[0] === '#') {
    if (c.length === 4) c = '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
    if (c.length === 7) {
      const n = parseInt(c.slice(1), 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
    }
  }
  const m = c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  if (m) return `rgba(${m[1]},${m[2]},${m[3]},${alpha})`;
  return `rgba(255,255,255,${alpha})`;
}

function loadFont(family) {
  if (!family || family === 'Inter') return;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family.replace(/\+/g,' '))}:wght@400;500;600;700;800&display=swap`;
  document.head.appendChild(link);
  const cssFamily = family.includes('+') ? `'${family.replace(/\+/g,' ')}'` : family;
  document.documentElement.style.setProperty('--font', `${cssFamily}, sans-serif`);
  document.body.style.fontFamily = `${cssFamily}, sans-serif`;
}

function renderPaiementConfirme() {
  document.getElementById('root').innerHTML = `
    <div class="progress-bar" style="width:100%"></div>
    <div class="brand">TAYA FITNESS</div>
    <div class="screen" style="text-align:center;">
      <div class="ending-screen">
        <div class="ending-mark"><svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="22" r="20"/><path d="M14 22.5l5.5 5.5L30 17"/></svg></div>
        <div class="q-title" style="text-align:center;">Ton coaching est confirmé</div>
        <div class="q-desc" style="text-align:center;max-width:460px;margin:0 auto 8px;">Paiement bien reçu. Sarah te contacte sous 24 h pour caler ta première séance. Un récapitulatif vient d'arriver dans ta boîte mail.</div>
        <div class="social-share">
          <a class="share-btn wa" href="https://wa.me/33749071781?text=${encodeURIComponent("Bonjour Sarah, je viens de souscrire mon coaching, quand pouvons-nous commencer ?")}" target="_blank" rel="noopener">Écrire à Sarah</a>
        </div>
      </div>
    </div>`;
}

async function init() {
  // Retour depuis Stripe : le questionnaire est deja envoye, on confirme.
  const paiement = new URLSearchParams(location.search).get('paiement');
  if (paiement === 'success') { renderPaiementConfirme(); return; }

  if (!slug) { renderError('Formulaire introuvable','Aucun identifiant spécifié.'); return; }
  try {
    const forms = await api(`forms?slug=eq.${encodeURIComponent(slug)}&limit=1`);
    if (!forms || !forms.length) { renderError('Formulaire introuvable','Ce formulaire n\'existe pas.'); return; }
    form = forms[0];
    document.title = (form.title||'Questionnaire') + ' — Taya Fitness';
    const s = form.settings || {};
    const bgColor = s.bg_color || '#111';
    const accentColor = s.accent_color || '#e8c547';
    const btnColor = s.btn_color || accentColor;
    const btnTextColor = s.btn_text_color || '#000000';
    const btnRadius = s.btn_shape === 'sharp' ? '0px' : s.btn_shape === 'square' ? '6px' : s.btn_shape === 'rounded' ? '14px' : '50px';
    const coverH = (s.cover_height || 220) + 'px';
    const coverPos = s.cover_position || 'center center';
    const coverR = (s.cover_radius !== undefined ? s.cover_radius : 16) + 'px';
    const root = document.documentElement;
    root.style.setProperty('--bg', bgColor);
    root.style.setProperty('--accent', accentColor);
    root.style.setProperty('--accent-soft', accentRgba(accentColor, 0.3));
    root.style.setProperty('--accent2', accentColor);
    root.style.setProperty('--btn-bg', btnColor);
    root.style.setProperty('--btn-text', btnTextColor);
    root.style.setProperty('--btn-radius', btnRadius);
    root.style.setProperty('--cover-h', coverH);
    root.style.setProperty('--cover-pos', coverPos);
    root.style.setProperty('--cover-r', coverR);
    document.body.style.background = bgColor;
    if(s.title_font_family&&s.title_font_family!==s.font_family){loadFont(s.title_font_family);}
    const titleFontCss=s.title_font_family?`'${s.title_font_family}',sans-serif`:'var(--font)';
    root.style.setProperty('--title-font', titleFontCss);
    root.style.setProperty('--font-weight', s.font_weight||'400');
    root.style.setProperty('--title-font-weight', s.title_font_weight||'700');
    root.style.setProperty('--font-style', s.font_italic?'italic':'normal');
    root.style.setProperty('--title-font-style', s.title_font_italic?'italic':'normal');
    root.style.setProperty('--text-color', s.text_color||'#ffffff');
    root.style.setProperty('--title-color', s.title_color||'#ffffff');
    root.style.setProperty('--desc-color', s.desc_color||'rgba(255,255,255,0.65)');
    loadFont(s.font_family);
    const qs = await api(`form_questions?form_id=eq.${form.id}&order=order_index`);
    questions = qs || [];
    if (form.homepage_title || form.description) {
      questions = [{id:'__home',type:'info_screen',title:form.homepage_title||form.title,description:form.homepage_description||form.description||'',required:false,_isHome:true}, ...questions];
    } else if (!questions.length || questions[0].type !== 'info_screen') {
      questions = [{id:'__home',type:'info_screen',title:form.title,description:form.description||'',required:false,_isHome:true}, ...questions];
    }
    questions = [...questions, {id:'__end',type:'__end',title:form.end_title||'Merci !',description:form.end_description||'Vos réponses ont bien été enregistrées.',required:false}];
    currentIdx = 0;
    renderStep();
  } catch(e) {
    console.error(e);
    renderError('Erreur de chargement','Impossible de charger le formulaire.');
  }
}

function getAnswerableQs() {
  return questions.filter(q => q.type !== 'info_screen' && q.type !== '__end' && !q._isHome);
}

function mediaHtml(q) {
  const url = q.settings && q.settings.media_url;
  if (!url) return '';
  const mt = q.settings.media_type || 'image';
  if (mt === 'youtube') {
    let vid = '';
    const m = url.match(/(?:v=|youtu\.be\/|embed\/)([^&?\s]+)/);
    if (m) vid = m[1];
    if (!vid) return `<div class="q-media" style="padding:10px;background:rgba(255,255,255,0.05);border-radius:14px;font-size:13px;color:rgba(255,255,255,0.5);">▶ ${esc(url)}</div>`;
    return `<div class="q-media"><iframe src="https://www.youtube.com/embed/${vid}?autoplay=0&rel=0" allowfullscreen></iframe></div>`;
  }
  if (mt === 'video') return `<div class="q-media"><video src="${esc(url)}" controls playsinline></video></div>`;
  return `<div class="q-media"><img src="${esc(url)}" onerror="this.parentNode.style.display='none'" /></div>`;
}

function renderStep() {
  const q = questions[currentIdx];
  if (!q) return;
  const answerableQs = getAnswerableQs();
  const ansIdx = answerableQs.indexOf(q);
  const total = answerableQs.length;
  const progress = questions.length <= 1 ? 100 : (currentIdx / (questions.length - 1)) * 100;
  const root = document.getElementById('root');

  if (q._isHome || (q.type === 'info_screen' && currentIdx === 0)) {
    // Sans image de couverture on n'affiche rien plutot qu'un pictogramme.
    const coverHtml = form.cover_url

function buildInputHtml(q) {
  const cur = answers[q.id];
  switch(q.type) {
    case 'short_answer':
      return `<input class="tf-input" type="text" placeholder="Votre réponse..." value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input" autocomplete="off"/>`;
    case 'long_answer':
      return `<textarea class="tf-textarea" placeholder="Votre réponse..." oninput="setAnswer('${q.id}',this.value)" id="main-input">${esc(cur||'')}</textarea>`;
    case 'email':
      return `<input class="tf-input" type="email" placeholder="votre@email.com" value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
    case 'phone':
      return `<input class="tf-input" type="tel" placeholder="+33 6 00 00 00 00" value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
    case 'date':
      return `<input class="tf-input" type="date" value="${esc(cur||'')}" onchange="setAnswer('${q.id}',this.value)" id="main-input" style="font-size:16px;color-scheme:dark;"/>`;
    case 'single_choice':
      return `<div class="choices">${(q.options||[]).map((opt,i)=>`
        <button class="choice-btn ${cur===opt?'selected':''}" onclick="selectSingle('${q.id}','${escAttr(opt)}')">
          <span class="choice-letter">${LETTERS[i]||i+1}</span>${esc(opt)}
        </button>`).join('')}</div>`;
    case 'multiple_choice':
      return `<div class="choices">${(q.options||[]).map((opt,i)=>`
        <button class="choice-btn ${Array.isArray(cur)&&cur.includes(opt)?'selected':''}" onclick="selectMulti('${q.id}','${escAttr(opt)}')">
          <span class="choice-letter">${LETTERS[i]||i+1}</span>${esc(opt)}
        </button>`).join('')}</div><p class="hint" style="margin-top:14px;">Plusieurs choix possibles</p>`;
    case 'yesno':
      return `<div class="yesno-btns">
        <button class="yesno-btn yes ${cur===true||cur==='oui'?'selected':''}" onclick="setAnswer('${q.id}','oui');renderStep()">Oui</button>
        <button class="yesno-btn no ${cur===false||cur==='non'?'selected':''}" onclick="setAnswer('${q.id}','non');setTimeout(()=>goNext(),280)">Non</button>
      </div>`;
    case 'rating': {
      const min = q.settings?.min ?? 1, max = q.settings?.max ?? 5;
      const nums = [];
      for(let n=min;n<=max;n++) nums.push(n);
      return `<div>
        <div class="scale-grid">${nums.map(n=>`<button class="scale-btn ${cur===n?'selected':''}" onclick="setAnswer('${q.id}',${n});renderStep()">${n}</button>`).join('')}</div>
        <div class="scale-labels"><span>${min}</span><span>${max}</span></div>
      </div>`;
    }
    case 'multi_fields': {
      const fields = (q.settings && q.settings.fields) || [];
      const curVal = (typeof cur === 'object' && cur !== null && !Array.isArray(cur)) ? cur : {};
      return `<div class="mf-group">${fields.map(f => `
        <div class="mf-row">
          <label class="mf-label">${esc(f.label)}</label>
          ${f.type === 'textarea'
            ? `<textarea class="mf-textarea" placeholder="" oninput="setMultiField('${q.id}','${escAttr(f.label)}',this.value)">${esc(curVal[f.label]||'')}</textarea>`
            : `<input class="mf-input" type="${esc(f.type||'text')}" placeholder="" value="${esc(curVal[f.label]||'')}" oninput="setMultiField('${q.id}','${escAttr(f.label)}',this.value)"/>`
          }
        </div>`).join('')}</div>`;
    }
    default:
      return `<input class="tf-input" type="text" placeholder="Votre réponse..." value="${esc(cur||'')}" oninput="setAnswer('${q.id}',this.value)" onkeydown="if(event.key==='Enter')goNext()" id="main-input"/>`;
  }
}

function focusInput(q) {
  if (['short_answer','long_answer','email','phone'].includes(q.type)) {
    const el = document.getElementById('main-input');
    if (el) { el.focus(); if (el.tagName==='INPUT') { el.selectionStart=el.selectionEnd=el.value.length; } }
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function setAnswer(id, val) { answers[id] = val; }
function setMultiField(qid, label, value) {
  const cur = (typeof answers[qid] === 'object' && answers[qid] !== null && !Array.isArray(answers[qid])) ? answers[qid] : {};
  answers[qid] = {...cur, [label]: value};
}

function selectSingle(id, opt) {
  answers[id] = opt;
  setTimeout(() => goNext(), 320);
  renderStep();
}

function selectMulti(id, opt) {
  const cur = Array.isArray(answers[id]) ? answers[id] : [];
  const idx = cur.indexOf(opt);
  answers[id] = idx >= 0 ? cur.filter(v=>v!==opt) : [...cur, opt];
  renderStep();
}

function validate(q) {
  if (!q.required) return true;
  if (q.type === 'info_screen' || q.type === '__end' || q._isHome) return true;
  if (q.type === 'multi_fields') {
    const ans = answers[q.id];
    if (!ans || typeof ans !== 'object') return false;
    return Object.values(ans).some(v => v && String(v).trim() !== '');
  }
  const ans = answers[q.id];
  if (ans === undefined || ans === null || ans === '') return false;
  if (Array.isArray(ans) && ans.length === 0) return false;
  return true;
}

/* Lit un champ du bloc « Informations » par son libelle, sans se soucier
   des accents ni de la casse : « Prénom », « prenom » ou « PRENOM ». */
function champInfo(bloc, motif) {
  for (const [libelle, valeur] of Object.entries(bloc || {})) {
    const c = libelle.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    if (motif.test(c)) return String(valeur ?? '').trim();
  }
  return '';
}

/* Des que la personne a laisse son identite et passe a la suite, sa fiche
   existe dans le CRM. Elle n'a plus rien a saisir ensuite, meme si elle
   abandonne le questionnaire en cours de route. */
let prospectEnvoye = '';
function enregistrerProspect(q) {
  if (q.type !== 'multi_fields') return;
  const bloc = answers[q.id];
  if (!bloc || typeof bloc !== 'object' || Array.isArray(bloc)) return;
  const email = champInfo(bloc, /mail/).toLowerCase();
  if (!email || email === prospectEnvoye) return;
  prospectEnvoye = email;
  identiteProspect = {
    email,
    prenom: champInfo(bloc, /^prenom/),
    nom: champInfo(bloc, /^nom\b/),
    telephone: champInfo(bloc, /tel|portable|mobile/),
    age: champInfo(bloc, /^age/),
    source: 'questionnaire-' + (slug || ''),
  };
  // Appel volontairement non bloquant : le questionnaire ne doit jamais
  // attendre le CRM pour afficher la question suivante.
  fetch(SUPABASE_URL + '/functions/v1/form-prospect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(identiteProspect),
  }).catch(e => console.error('Prospect error', e));
}

function goNext() {
  const q = questions[currentIdx];
  if (q && !q._isHome && q.type !== 'info_screen' && q.type !== '__end') {
    if (!validate(q)) { shakeInput(); return; }
    enregistrerProspect(q);
  }
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    if (questions[currentIdx]?.type === '__end') submitResponses();
    renderStep();
  }
}

function goPrev() {
  if (currentIdx > 0) { currentIdx--; renderStep(); }
}

function shakeInput() {
  const el = document.getElementById('main-input') || document.querySelector('.choices') || document.querySelector('.yesno-btns');
  if (!el) return;
  el.style.borderBottomColor = '#e05252';
  el.style.borderColor = '#e05252';
  setTimeout(() => { el.style.borderBottomColor = ''; el.style.borderColor = ''; }, 900);
}

async function submitResponses() {
  if (submitting || submitted) return;
  submitting = true;
  const realQs = questions.filter(q => !q._isHome && q.type !== '__end');
  let respondent_name = null, respondent_email = null;
  for (const q of realQs) {
    if (q.type === 'email' && answers[q.id]) respondent_email = answers[q.id];
    if (q.type === 'short_answer' && answers[q.id] && !respondent_name) respondent_name = answers[q.id];
    if (q.type === 'multi_fields' && answers[q.id] && typeof answers[q.id] === 'object') {
      const fields = q.settings?.fields || [];
      /* « Nom » et « Prénom » sont deux cases distinctes : on recompose
         « Prénom Nom » au lieu de ne garder que la première des deux. */
      const champ = (re) => {
        const f = fields.find(x => re.test((x.label || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim()));
        return f ? String(answers[q.id][f.label] ?? '').trim() : '';
      };
      const complet = [champ(/^prenom/i), champ(/^nom\b/i)].filter(Boolean).join(' ') || champ(/nom|prenom|name/i);
      if (complet && !respondent_name) respondent_name = complet;
      const emailF = fields.find(f => /email|mail|@/i.test(f.label));
      if (emailF && answers[q.id][emailF.label] && !respondent_email) respondent_email = answers[q.id][emailF.label];
    }
  }
  const cleanAnswers = {};
  for (const q of realQs) {
    if (answers[q.id] !== undefined) cleanAnswers[q.id] = answers[q.id];
  }
  try {
    const created = await api('form_responses', {
      method: 'POST',
      headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ form_id: form.id, answers: cleanAnswers, respondent_name, respondent_email, completed_at: new Date().toISOString() })
    });
    submitted = true;

    // Prévenir Sarah avec le récapitulatif des réponses, et armer la série
    // de relances. Si cet appel échoue, la réponse est déjà enregistrée :
    // on ne bloque surtout pas l'écran de fin pour autant.
    const responseId = Array.isArray(created) ? created[0]?.id : created?.id;
    if (responseId) {
      fetch(SUPABASE_URL + '/functions/v1/form-notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ response_id: responseId })
      }).catch(e => console.error('Notify error', e));
    }
  } catch(e) { console.error('Submit error', e); }
  submitting = false;
}

    <div class="screen" style="text-align:center;">

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
    const q = questions[currentIdx];
    if (q && !['multiple_choice','rating'].includes(q.type)) goNext();

});

init();
/* Le forfait « adapté » : on relit les réponses (accompagnement souhaité,
   fréquence de contact, objectif) et on en déduit le rythme qui colle.
   Sans signal exploitable, on retombe sur la formule intermédiaire. */
function planRecommande(plans) {
  const morceaux = [];
  for (const q of questions) {
    const a = answers[q.id];
    if (a === undefined || a === null || typeof a === 'object' && !Array.isArray(a)) continue;
    morceaux.push((q.title || '') + ' :: ' + (Array.isArray(a) ? a.join(' | ') : String(a)));
  }
  const tout = morceaux.join('\n').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  /* On part de la formule intermediaire : c'est ce qu'on propose quand
     rien dans les reponses ne penche d'un cote ou de l'autre. */
  let score = 2;
  if (/combo/.test(tout)) score += 1;                                  // sportif + nutrition
  if (/hybride/.test(tout)) score += 1;                                // salle + en ligne
  if (/hebdomadaire/.test(tout)) score += 1;                           // veut du suivi rapproche
  if (/prise de masse|masse musculaire/.test(tout)) score += 1;        // objectif exigeant
  if (/mensuelle/.test(tout)) score -= 1;                              // suivi espace
  if (/uniquement (sportif|nutrition)/.test(tout)) score -= 1;         // un seul axe
  if (/en ligne via l.appli|programme personnalise/.test(tout)) score -= 1; // sans seances encadrees
  const rang = score <= 1 ? 0 : (score >= 5 ? 2 : 1);
  return Math.max(0, Math.min(rang, plans.length - 1));
}

/* La cle Stripe de la formule : elle est deja dans le lien configure
   (?plan=progression). A defaut, on la deduit du nom de la formule. */
function clePlan(pl) {
  try {
    const p = new URL(pl.btn_url, window.location.origin).searchParams.get('plan');
    if (p) return p;
  } catch (_) { /* lien vide ou mal forme : on retombe sur le nom */ }
  return String(pl.name || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
}

function selectionnerCarte(el) {
  document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

/* Paiement direct, sans creation de compte prealable.
   L'email laisse dans le questionnaire suffit : Stripe le pre-remplit, et
   le webhook rattache ensuite l'abonnement et la fiche client sur cet email.
   En cas de pepin, le lien configure sert de secours pour ne jamais laisser
   le visiteur sans issue. */
async function payerPlan(btn) {
  const carte = btn.closest('.plan-card');
  if (carte) selectionnerCarte(carte);
  const plan = btn.dataset.plan;
  if (!plan) { if (btn.dataset.url) window.location.href = btn.dataset.url; return; }

  const libelle = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Redirection...';
  try {
    const retour = location.origin + '/forms?slug=' + encodeURIComponent(slug || '');
    const r = await fetch(SUPABASE_URL + '/functions/v1/stripe-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'abonnement', plan, billing: 'monthly',
        user_id: '', user_email: (identiteProspect && identiteProspect.email) || '',
        success_url: retour + '&paiement=success',
        cancel_url: retour + '&paiement=annule',
      }),
    });
    const d = await r.json();
    if (!r.ok || !d.url) throw new Error(d.error || 'Erreur de paiement');
    window.location.href = d.url;
  } catch (e) {
    console.error('Checkout error', e);
    btn.disabled = false;
    btn.textContent = libelle;
    if (btn.dataset.url) window.location.href = btn.dataset.url;
  }
}

function renderPlanCards() {
  const plans = (form.settings && form.settings.plans) || [];
  if (!plans.length) return;
  const sec = document.getElementById('plan-cards-section');
  if (!sec) return;
  sec.style.display = 'block';
  const accent = (form.settings && form.settings.accent_color) || '#ff6b4a';
  const reco = planRecommande(plans);

  const carte = (pl, i, conseille) => `
    <div class="plan-card${conseille ? ' reco' : ''}" onclick="selectionnerCarte(this)">
      ${conseille ? `<div class="plan-badge">RECOMMANDÉ POUR TOI</div>` : ''}
      <div class="plan-head">
        <div>
          <div class="plan-name">${esc(pl.name || 'Formule')}</div>
          ${pl.subtitle ? `<div class="plan-sub">${esc(pl.subtitle)}</div>` : ''}
        </div>
        <div class="plan-price">${esc(pl.price || '')}</div>
      </div>
      <div class="plan-actions">
        ${pl.details ? `<button type="button" class="plan-btn ghost" onclick="event.stopPropagation();openPlanModal(${i})">Voir les détails</button>` : ''}
        <button type="button" class="plan-btn go" data-plan="${esc(clePlan(pl))}" data-url="${esc(pl.btn_url || '')}" data-original-text="${esc(pl.btn_label || 'Choisir cette formule')} →" onclick="event.stopPropagation();payerPlan(this)">${esc(pl.btn_label || 'Choisir cette formule')} →</button>
      </div>
    </div>`;

  // La formule conseillee passe en tete, les deux autres restent visibles dessous.
  const ordre = [reco, ...plans.map((_, i) => i).filter((i) => i !== reco)];
  let html = `<div style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:${accent};margin-bottom:6px;text-align:center;">Ta formule conseillée</div>
    <div style="font-size:13px;color:rgba(255,255,255,0.55);margin:0 auto 16px;max-width:420px;line-height:1.6;">D'après tes réponses, voici le rythme qui correspond le mieux à ton objectif. Tu peux bien sûr partir sur une autre formule.</div>
    <div style="display:flex;flex-direction:column;gap:12px;">`;
  ordre.forEach((i, rang) => {
    if (rang === 1) {
      html += `<div style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:12px 0 -2px;text-align:center;">Les autres formules</div>`;
    }
    html += carte(plans[i], i, i === reco);
  });
  html += `</div><p class="plan-secure">Paiement sécurisé par Stripe · Sans engagement long</p>`;
  sec.innerHTML = html;
}

function openPlanModal(idx) {
  const plans = (form.settings && form.settings.plans) || [];
  const pl = plans[idx];
  if (!pl) return;
  const accent = (form.settings && form.settings.accent_color) || '#ff6b4a';
  const btnBg = (form.settings && form.settings.btn_color) || accent;
  const btnText = (form.settings && form.settings.btn_text_color) || '#000000';
  const btnRadius = (form.settings && form.settings.btn_shape) === 'pill' ? '50px' : '10px';
  document.getElementById('plan-modal-content').innerHTML = `
    <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:${accent};margin-bottom:6px;">${esc(pl.name||'Formule')}</div>
    ${pl.price ? `<div style="font-size:32px;font-weight:800;color:#fff;margin-bottom:4px;">${esc(pl.price)}</div>` : ''}
    ${pl.subtitle ? `<div style="font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:18px;">${esc(pl.subtitle)}</div>` : ''}
    ${pl.details ? `<div style="font-size:14px;color:rgba(255,255,255,0.8);line-height:1.7;white-space:pre-line;margin-bottom:22px;">${esc(pl.details)}</div>` : ''}
    ${pl.btn_url ? `<a href="${esc(pl.btn_url)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:${btnRadius};background:${btnBg};color:${btnText};font-size:15px;font-weight:700;text-decoration:none;">${esc(pl.btn_label||'Choisir cette formule')} →</a>` : ''}
  `;
  const overlay = document.getElementById('plan-modal-overlay');
  overlay.style.display = 'flex';
}

function closePlanModal() {
  document.getElementById('plan-modal-overlay').style.display = 'none';
}

</script>
</body>
</html>
