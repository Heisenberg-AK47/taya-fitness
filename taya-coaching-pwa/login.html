<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — Taya Fitness Coaching</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .auth { width: min(420px, 100%); }
  .brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: 18px; font-weight:800; }
  .brand img { width: 40px; height: 40px; }
  .tabs { display:flex; gap:8px; margin-bottom: 18px; }
  .tabs button { flex:1; background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:10px; font-weight:700; cursor:pointer; }
  .tabs button.active { color:#fff; background:var(--grad); border-color:transparent; }
</style>
</head>
<body>
<div class="wrap">
  <div class="auth card">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><span><b>TAYA</b> <i class="accent" style="font-style:normal">Fitness</i></span></div>
    <div class="tabs">
      <button id="tab-login" class="active">Se connecter</button>
      <button id="tab-signup">Créer un compte</button>
    </div>
    <div id="msg"></div>
    <form id="form">
      <div class="field" id="name-field" style="display:none">
        <label for="name">Prénom</label>
        <input id="name" type="text" autocomplete="given-name" placeholder="Ton prénom">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="toi@email.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
      </div>
      <button class="btn btn-accent btn-block" id="submit" type="submit">Se connecter</button>
    </form>
    <p class="note center" style="margin-top:16px"><a href="/" class="muted">← Retour à l'accueil</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from '/assets/supabase.js';
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/app/';
  const plan = params.get('plan');

  let mode = 'login';
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const showMsg = (t, ok=false) => msg.innerHTML = `<div class="alert ${ok?'alert-ok':'alert-error'}">${t}</div>`;

  function setMode(m){
    mode = m;
    $('tab-login').classList.toggle('active', m==='login');
    $('tab-signup').classList.toggle('active', m==='signup');
    $('name-field').style.display = m==='signup' ? 'grid' : 'none';
    $('password').autocomplete = m==='signup' ? 'new-password' : 'current-password';
    $('submit').textContent = m==='signup' ? 'Créer mon compte' : 'Se connecter';
    msg.innerHTML = '';
  }
  $('tab-login').onclick = () => setMode('login');
  $('tab-signup').onclick = () => setMode('signup');

  function go(){
    const url = new URL(next, location.origin);
    if (plan) { url.searchParams.set('plan', plan); if(!url.hash) url.hash = 'offres'; }
    location.href = url.toString();
  }

  // Already logged in? Skip the form.
  (async () => { const { data } = await supabase.auth.getUser(); if (data?.user) go(); })();

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    const name = $('name').value.trim();
    $('submit').disabled = true;
    try {
      if (mode === 'signup') {
        const { error } = await supabase.auth.signUp({
          email, password,
          options: { data: { full_name: name }, emailRedirectTo: location.origin + '/login.html' }
        });
        if (error) throw error;
        showMsg("Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.", true);
        setMode('login');
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        go();
      }
    } catch (err) {
      showMsg(err.message || "Une erreur est survenue.");
    } finally {
      $('submit').disabled = false;
    }
  });

  // Pre-select signup if arriving with a plan choice
  if (plan) setMode('signup');
</script>
</body>
</html>
