<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — Taya Fitness Coaching</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .auth { width: min(420px, 100%); }
  .brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: 18px; font-weight:800; }
  .brand img { width: 40px; height: 40px; }
  .tabs { display:flex; gap:8px; margin-bottom: 18px; }
  .tabs button { flex:1; background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:999px; padding:10px; font-weight:700; cursor:pointer; }
  .tabs button.active { color:#fff; background:var(--grad); border-color:transparent; }
</style>
</head>
<body>
<div class="wrap">
  <div class="auth card">
    <div class="brand"><img src="/icons/logo.png" alt="Taya Fitness" style="height:38px;width:auto"></div>
    <!-- Un seul endroit pour créer un compte : le site. Ici, connexion uniquement,
         avec les mêmes identifiants. -->
    <div class="tabs">
      <button id="tab-login" class="active">Se connecter</button>
    </div>
    <p style="margin:14px 0 0;font-size:13px;line-height:1.6;opacity:.65;text-align:center">
      Connecte-toi avec les identifiants de ton compte Taya&nbsp;Fitness —
      les mêmes que sur le site.<br>
      Pas encore de compte ?
      <a href="https://www.tayafitness.com/auth" style="color:#ff6b4a;font-weight:600">Créer mon compte</a>
    </p>
    <div id="msg"></div>
    <form id="form">
      <div class="field" id="name-field" style="display:none">
        <label for="name">Prénom</label>
        <input id="name" type="text" autocomplete="given-name" placeholder="Ton prénom">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="toi@email.com">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
      </div>
      <button class="btn btn-accent btn-block" id="submit" type="submit">Se connecter</button>
    </form>
    <p class="note center" style="margin-top:16px"><a href="/" class="muted">← Retour à l'accueil</a></p>
  </div>
</div>

<script type="module">
  import { supabase } from '/assets/supabase.js';
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/app/';
  const plan = params.get('plan');

  let mode = 'login';
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const showMsg = (t, ok=false) => msg.innerHTML = `<div class="alert ${ok?'alert-ok':'alert-error'}">${t}</div>`;

  // Supabase renvoie ses erreurs en anglais : on les traduit pour le client.
  function traduire(m){
    const s = m || '';
    if (s.includes('Email not confirmed'))
      return "Ton adresse n'est pas encore confirmée. Ouvre l'e-mail de confirmation qu'on t'a envoyé, puis reviens ici.";
    if (s.includes('Invalid login'))
      return "E-mail ou mot de passe incorrect.";
    if (s.includes('rate limit') || s.includes('Too many'))
      return "Trop de tentatives. Patiente une minute avant de réessayer.";
    return s || "Une erreur est survenue.";
  }

  // Connexion uniquement : la création de compte se fait sur le site.
  function setMode(){
    mode = 'login';
    $('tab-login').classList.add('active');
    $('name-field').style.display = 'none';
    $('password').autocomplete = 'current-password';
    $('submit').textContent = 'Se connecter';
    msg.innerHTML = '';
  }
  $('tab-login').onclick = () => setMode();

  function go(){
    const url = new URL(next, location.origin);
    if (plan) { url.searchParams.set('plan', plan); if(!url.hash) url.hash = 'offres'; }
    location.href = url.toString();
  }

  // Already logged in? Skip the form.
  (async () => { const { data } = await supabase.auth.getUser(); if (data?.user) go(); })();

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    $('submit').disabled = true;
    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      go();
    } catch (err) {
      showMsg(traduire(err.message));
    } finally {
      $('submit').disabled = false;
    }
  });

  // Pre-select signup if arriving with a plan choice
  if (plan) setMode('signup');
</script>
</body>
</html>
