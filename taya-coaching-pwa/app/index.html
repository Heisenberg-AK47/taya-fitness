<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace — Taya Fitness Coaching</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body { padding-bottom: 80px; }
  .appbar { position: sticky; top: 0; z-index: 40; background: rgba(13,27,42,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); }
  .appbar-in { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-family: var(--font-head); }
  .brand img { width: 30px; height: 30px; }
  .brand i { color: var(--accent); font-style: normal; }
  .iconbtn { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: .9rem; }
  main { padding-top: 18px; }
  .view { display: none; } .view.active { display: block; }
  .pagehead { margin: 6px 0 18px; }
  .pagehead h1 { font-size: 1.7rem; margin: 0; }
  .pagehead p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }

  /* bottom nav */
  .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--bg-2);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: .68rem; font-weight: 600; padding: 4px 14px; border-radius: 10px; }
  .bottomnav a .ic { font-size: 1.25rem; }
  .bottomnav a.active { color: var(--accent); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 12px; }
  .mini { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .mini .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .mini .v { font-size: 1.5rem; font-weight: 800; font-family: var(--font-head); margin-top: 2px; }

  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: border-color .15s; }
  .list-item:hover { border-color: var(--accent); }
  .list-item .day { width: 40px; height: 40px; border-radius: 10px; background: var(--card-2); display: grid; place-items: center; font-weight: 800; color: var(--accent); font-family: var(--font-head); flex-shrink: 0; }
  .pill { display: inline-block; font-size: .7rem; padding: 3px 9px; border-radius: 999px; background: rgba(255,107,74,.12); color: var(--accent); font-weight: 700; }
  .pill.muted { background: rgba(255,255,255,.06); color: var(--muted); }

  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .ex h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .ex .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .ex .vid { display: block; position: relative; border-radius: 10px; overflow: hidden; margin: 10px 0; aspect-ratio: 16/9; background: #000; cursor: pointer; }
  .ex .vid img { width: 100%; height: 100%; object-fit: cover; opacity: .85; }
  .ex .vid .play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.4rem; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .phase-h { font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; margin: 20px 0 12px; display: flex; align-items: baseline; gap: 8px; }
  .phase-h:first-child { margin-top: 4px; }
  .phase-h span { font-weight: 600; font-size: .78rem; color: var(--muted); }
  .ex-warm { border-style: dashed; }
  .ex-warm h3 { font-size: 1rem; }
  .ex .consigne { font-size: .86rem; color: var(--muted); margin: 6px 0; }
  .sets { display: grid; gap: 8px; margin-top: 10px; }
  .setrow { display: grid; grid-template-columns: 38px 1fr 1fr 40px; gap: 8px; align-items: center; }
  .setrow label { font-size: .72rem; color: var(--muted); }
  .setrow input { background: var(--card-2); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 9px; font-size: .9rem; width: 100%; }
  .setrow input:focus { outline: none; border-color: var(--accent); }
  .setrow .sn { font-weight: 800; color: var(--accent); font-family: var(--font-head); text-align: center; }
  .check { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .check.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .weekbar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; }
  .weekbar button { flex-shrink: 0; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-size: .85rem; }
  .weekbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .ic { font-size: 2.6rem; }
  .back { background: transparent; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; margin-bottom: 12px; font-size: .9rem; }

  /* onboarding */
  .ob { max-width: 520px; margin: 0 auto; }
  .ob .opts { display: grid; gap: 10px; }
  .ob .opt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-weight: 600; }
  .ob .opt.sel { border-color: var(--accent); background: rgba(255,107,74,.08); }
  .ob .prog { height: 5px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .ob .prog i { display: block; height: 100%; background: var(--grad); transition: width .3s; }
  .toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--good); color: #06301f;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem; z-index: 80; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  canvas { max-width: 100%; }
</style>
</head>
<body>

<div id="loading" class="empty" style="padding-top:80px"><div class="ic">⏳</div><p>Chargement de ton espace…</p></div>

<div id="shell" style="display:none">
  <header class="appbar">
    <div class="container appbar-in">
      <div class="brand"><img src="/icons/icon-192.png" alt=""><span>TAYA <i>Fitness</i></span></div>
      <button class="iconbtn" id="logout">Déconnexion</button>
    </div>
  </header>

  <main class="container">
    <!-- ACCUEIL -->
    <section id="v-accueil" class="view">
      <div class="pagehead"><h1 id="hello">Salut 👋</h1><p id="sub-status"></p></div>
      <div class="stat-row" id="home-stats"></div>
      <div style="margin-top:18px" id="home-program"></div>
    </section>

    <!-- PROGRAMME -->
    <section id="v-programme" class="view">
      <div class="pagehead"><h1>Mon programme</h1><p id="prog-sub"></p></div>
      <div id="prog-content"></div>
    </section>

    <!-- SUIVI -->
    <section id="v-suivi" class="view">
      <div class="pagehead"><h1>Suivi de poids</h1><p>Note ton poids régulièrement pour visualiser ta progression.</p></div>
      <div class="card" style="margin-bottom:18px">
        <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
          <div class="field" style="margin:0;flex:1;min-width:110px"><label>Poids (kg)</label><input id="w-poids" type="number" step="0.1" inputmode="decimal" placeholder="ex. 72.5"></div>
          <div class="field" style="margin:0;flex:1;min-width:130px"><label>Date</label><input id="w-date" type="date"></div>
          <button class="btn btn-accent" id="w-add" style="padding:13px 22px">Ajouter</button>
        </div>
      </div>
      <div class="card" style="margin-bottom:18px"><canvas id="w-chart" height="200"></canvas></div>
      <div id="w-list"></div>
    </section>

    <!-- PROFIL -->
    <section id="v-profil" class="view">
      <div class="pagehead"><h1>Mon profil</h1></div>
      <div id="profil-content"></div>
    </section>

    <!-- ONBOARDING -->
    <section id="v-onboarding" class="view">
      <div class="ob" id="ob-root"></div>
    </section>
  </main>

  <nav class="bottomnav" id="bottomnav">
    <a href="#accueil" data-tab="accueil"><span class="ic">🏠</span>Accueil</a>
    <a href="#programme" data-tab="programme"><span class="ic">🏋️</span>Programme</a>
    <a href="#suivi" data-tab="suivi"><span class="ic">📈</span>Suivi</a>
    <a href="#profil" data-tab="profil"><span class="ic">👤</span>Profil</a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
import { supabase, requireSubscription } from '/assets/supabase.js';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const toast = (msg) => { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); };
const esc = (s) => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const state = { user:null, sub:null, client:null, programme:null, workouts:[], week:1, weights:[], chart:null };

// ---------- bootstrap ----------
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const gate = await requireSubscription();
  if (!gate) return;                 // redirected
  state.user = gate.user; state.sub = gate.subscription;

  const { data: client } = await supabase.from('clients').select('*').eq('email', state.user.email).maybeSingle();
  state.client = client;

  const { data: w } = await supabase.from('suivi_poids').select('*').eq('user_id', state.user.id).order('date', { ascending: false }).limit(60);
  state.weights = w || [];

  $('#loading').style.display = 'none';
  $('#shell').style.display = 'block';

  // Onboarding required if no objective recorded yet
  if (!client || !client.objectif) { showOnboarding(); }
  else { await loadProgramme(); route(); }

  window.addEventListener('hashchange', route);
  $('#logout').onclick = async () => { await supabase.auth.signOut(); location.href = '/'; };
  $('#w-add').onclick = addWeight;
  $('#w-date').value = new Date().toISOString().slice(0,10);
})();

// ---------- routing ----------
function route() {
  if ($('#v-onboarding').classList.contains('active')) return; // stay in onboarding
  const tab = (location.hash.replace('#','') || 'accueil');
  $$('.view').forEach(v => v.classList.remove('active'));
  const view = $('#v-'+tab) || $('#v-accueil');
  view.classList.add('active');
  $$('.bottomnav a').forEach(a => a.classList.toggle('active', a.dataset.tab===tab));
  if (tab==='accueil') renderHome();
  if (tab==='programme') renderProgramme();
  if (tab==='suivi') renderSuivi();
  if (tab==='profil') renderProfil();
}

// ---------- data ----------
async function loadProgramme() {
  const pid = state.client?.programme_id;
  if (!pid) return;
  const { data: prog } = await supabase.from('programmes').select('*').eq('id', pid).maybeSingle();
  state.programme = prog;
  state.week = state.client?.current_week || 1;
  const { data: wk } = await supabase.from('programme_workouts').select('*').eq('programme_id', pid)
    .order('day_number', { ascending: true });
  state.workouts = wk || [];
}

// ---------- HOME ----------
function renderHome() {
  const prenom = state.client?.prenom || state.user.email.split('@')[0];
  $('#hello').textContent = `Salut ${prenom} 💪`;
  const planName = ({online_essentiel:'Essentiel',online_transformation:'Transformation',online_premium:'Premium'})[state.sub.plan] || state.sub.plan || 'Coaching online';
  const end = state.sub.current_period_end ? new Date(state.sub.current_period_end).toLocaleDateString('fr-FR') : '—';
  $('#sub-status').innerHTML = `Formule <b style="color:var(--ink)">${esc(planName)}</b> · prochaine échéance ${end}`;

  const last = state.weights[0];
  $('#home-stats').innerHTML = `
    <div class="mini"><div class="k">Objectif</div><div class="v" style="font-size:1.1rem">${esc(pretty(state.client?.objectif))}</div></div>
    <div class="mini"><div class="k">Niveau</div><div class="v" style="font-size:1.1rem">${esc(pretty(state.client?.niveau))}</div></div>
    <div class="mini"><div class="k">Poids actuel</div><div class="v">${last? esc(last.poids)+' kg':'—'}</div></div>`;

  const c = $('#home-program');
  if (state.programme) {
    c.innerHTML = `<div class="card"><div class="pill">Semaine ${state.week}</div>
      <h3 style="margin:10px 0 4px">${esc(state.programme.titre)}</h3>
      <p class="note">${esc(state.programme.description_courte||state.programme.objectif||'')}</p>
      <a class="btn btn-accent btn-block" href="#programme" style="margin-top:12px">Voir mes séances →</a></div>`;
  } else {
    c.innerHTML = emptyProgram();
  }
}

// ---------- PROGRAMME ----------
let currentWorkout = null;
function renderProgramme() {
  const c = $('#prog-content');
  if (!state.programme) { $('#prog-sub').textContent=''; c.innerHTML = emptyProgram(); return; }
  $('#prog-sub').textContent = state.programme.titre;

  if (currentWorkout) { renderWorkoutDetail(currentWorkout); return; }

  // group workouts by day_number (unique séances)
  const seen = new Map();
  state.workouts.forEach(w => { if(!seen.has(w.day_number)) seen.set(w.day_number, w); });
  const days = [...seen.values()].sort((a,b)=>a.day_number-b.day_number);

  if (!days.length) { c.innerHTML = `<div class="empty"><div class="ic">📝</div><p>Aucune séance pour l'instant.</p><button class="btn btn-accent" style="margin-top:14px" onclick="genProgram()">⚙️ (Re)générer mon programme</button></div>`; return; }

  c.innerHTML = `<div class="weekbar" id="weekbar"></div>` + days.map(w => `
    <div class="list-item" data-day="${w.day_number}">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="day">J${w.day_number}</div>
        <div><div style="font-weight:700">${esc(w.name||('Séance '+w.day_number))}</div>
        <div class="note">${esc(w.description||'')}</div></div>
      </div><div style="color:var(--accent);font-size:1.4rem">›</div>
    </div>`).join('');

  // week selector
  const weeks = state.programme.duree_semaines || Math.max(1, ...state.workouts.map(w=>w.week_number||1));
  const wb = $('#weekbar');
  wb.innerHTML = Array.from({length:weeks}, (_,i)=>i+1).map(n =>
    `<button data-week="${n}" class="${n===state.week?'active':''}">Semaine ${n}</button>`).join('');
  $$('#weekbar button').forEach(b => b.onclick = () => { state.week=+b.dataset.week; renderProgramme(); });
  $$('.list-item').forEach(li => li.onclick = () => { currentWorkout = +li.dataset.day; renderProgramme(); });
}

async function renderWorkoutDetail(dayNumber) {
  const c = $('#prog-content');
  const w = state.workouts.find(x => x.day_number===dayNumber) || {};
  c.innerHTML = `<button class="back" id="back">← Toutes les séances</button>
    <div class="pill">Semaine ${state.week}</div>
    <h2 style="margin:8px 0 14px">${esc(w.name||('Séance '+dayNumber))}</h2>
    <div id="ex-list"><div class="empty"><div class="ic">⏳</div><p>Chargement…</p></div></div>`;
  $('#back').onclick = () => { currentWorkout = null; renderProgramme(); };

  // exercises for this programme + week + day
  const { data: pes } = await supabase.from('programme_exercises').select('*')
    .eq('programme_id', state.programme.id).eq('week_number', state.week).eq('day_number', dayNumber)
    .order('order_index', { ascending: true });

  let rows = pes || [];
  // fallback: some programmes store exercises on week 1 only
  if (!rows.length && state.week !== 1) {
    const { data: pe1 } = await supabase.from('programme_exercises').select('*')
      .eq('programme_id', state.programme.id).eq('week_number', 1).eq('day_number', dayNumber)
      .order('order_index', { ascending: true });
    rows = pe1 || [];
  }
  if (!rows.length) { $('#ex-list').innerHTML = `<div class="empty"><div class="ic">🛈</div><p>Aucun exercice pour cette séance/semaine.</p></div>`; return; }

  const exIds = [...new Set(rows.map(r=>r.exercise_id).filter(Boolean))];
  const { data: exs } = await supabase.from('exercises').select('*').in('id', exIds);
  const exMap = Object.fromEntries((exs||[]).map(e=>[e.id,e]));

  // existing logs
  const peIds = rows.map(r=>r.id);
  const { data: logs } = await supabase.from('workout_logs').select('*')
    .eq('user_id', state.user.id).in('programme_exercise_id', peIds).eq('week_number', state.week);
  const logMap = {};
  (logs||[]).forEach(l => { logMap[`${l.programme_exercise_id}_${l.set_number}`] = l; });

  const vidHtml = (e) => { const yt=e.youtube_id; if(!yt) return ''; const thumb=`https://img.youtube.com/vi/${esc(yt)}/hqdefault.jpg`; return `<div class="vid" data-yt="${esc(yt)}"><img src="${thumb}" alt="" loading="lazy"><span class="play">▶</span></div>`; };
  const renderMain = (pe) => {
    const e = exMap[pe.exercise_id] || {};
    const nSets = pe.sets || 3;
    const muscle = (e.tags && e.tags.length) ? e.tags[0] : '';
    const repos = pe.rest_seconds ? `${pe.rest_seconds}s` : (e.repos||'');
    const sets = Array.from({length:nSets}, (_,i)=>{
      const sn=i+1; const lg = logMap[`${pe.id}_${sn}`] || {};
      return `<div class="setrow" data-pe="${pe.id}" data-set="${sn}">
        <div class="sn">S${sn}</div>
        <input class="in-reps" inputmode="numeric" placeholder="${esc(pe.reps||'reps')}" value="${esc(lg.reps||'')}">
        <input class="in-charge" inputmode="decimal" placeholder="kg" value="${esc(lg.charge||'')}">
        <div class="check ${lg.done?'on':''}">✓</div>
      </div>`;
    }).join('');
    return `<div class="ex">
      <h3>${esc(e.name||'Exercice')}</h3>
      <div class="meta">
        ${muscle?`<span class="pill">${esc(muscle)}</span>`:''}
        <span class="pill muted">${esc(pe.sets||3)} × ${esc(pe.reps||'—')}</span>
        ${repos?`<span class="pill muted">repos ${esc(repos)}</span>`:''}
      </div>
      ${vidHtml(e)}
      ${e.consignes?`<div class="consigne">💡 ${esc(e.consignes)}</div>`:''}
      <div class="sets">${sets}</div>
    </div>`;
  };
  const renderWarm = (pe) => {
    const e = exMap[pe.exercise_id] || {};
    return `<div class="ex ex-warm">
      <h3>${esc(e.name||'Exercice')}</h3>
      <div class="meta"><span class="pill muted">${esc(pe.reps||'30-45 sec')}</span></div>
      ${vidHtml(e)}
      ${e.consignes?`<div class="consigne">💡 ${esc(e.consignes)}</div>`:''}
    </div>`;
  };
  const warm = rows.filter(r => r.phase === 'warmup');
  const main = rows.filter(r => r.phase !== 'warmup');
  $('#ex-list').innerHTML =
    (warm.length ? `<div class="phase-h">🔥 Échauffement <span>~3 min · en douceur</span></div>` + warm.map(renderWarm).join('') : '')
    + `<div class="phase-h">💪 La séance</div>`
    + (main[0] && main[0].notes ? `<div class="consigne" style="margin:0 0 12px">📈 ${esc(main[0].notes)}</div>` : '')
    + main.map(renderMain).join('');

  // wire logging (debounced save on blur / check toggle)
  $$('.setrow').forEach(row => {
    const pe = row.dataset.pe, sn = +row.dataset.set;
    const reps = $('.in-reps', row), charge = $('.in-charge', row), chk = $('.check', row);
    const save = async (done) => {
      await supabase.from('workout_logs').upsert({
        user_id: state.user.id, programme_exercise_id: pe, week_number: state.week, set_number: sn,
        reps: reps.value || null, charge: charge.value || null, done: done,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,programme_exercise_id,week_number,set_number' });
    };
    reps.addEventListener('change', ()=>save(chk.classList.contains('on')));
    charge.addEventListener('change', ()=>save(chk.classList.contains('on')));
    chk.addEventListener('click', async ()=>{ chk.classList.toggle('on'); await save(chk.classList.contains('on')); toast('Série enregistrée'); });
  });

  // vidéos : lecture directement dans l'app au clic (lecteur YouTube intégré, sans quitter la page)
  $$('.vid[data-yt]').forEach(v => v.addEventListener('click', () => {
    const id = v.dataset.yt;
    v.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="Démonstration de l'exercice" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>`;
  }, { once: true }));
}

function emptyProgram() {
  return `<div class="empty"><div class="ic">🗓️</div>
    <h3 style="font-family:var(--font-head)">Ton programme sur mesure</h3>
    <p>Génère ton programme personnalisé à partir de ton objectif, ton niveau et ton matériel.</p>
    <button class="btn btn-accent" style="margin-top:14px" onclick="genProgram()">⚙️ Générer mon programme</button></div>`;
}

// Génération à la demande (onboarding déjà fait / clients existants sans programme)
window.genProgram = async () => {
  if (!state.client?.id) { toast('Termine d’abord ton profil'); return; }
  toast('Création de ton programme…');
  const { error } = await supabase.rpc('generate_client_program', { p_client_id: state.client.id });
  if (error) { toast('Erreur : ' + error.message); return; }
  const { data: c } = await supabase.from('clients').select('*').eq('email', state.user.email).maybeSingle();
  if (c) state.client = c;
  await loadProgramme();
  location.hash = '#programme'; route();
  toast('Programme prêt ! 💪');
};

// ---------- SUIVI POIDS ----------
async function renderSuivi() {
  const { data } = await supabase.from('suivi_poids').select('*').eq('user_id', state.user.id).order('date', { ascending: true });
  state.weights = (data||[]).slice().reverse(); // newest first for list/home
  drawChart(data||[]);
  const list = $('#w-list');
  if (!data || !data.length) { list.innerHTML = `<div class="empty"><div class="ic">⚖️</div><p>Aucune mesure enregistrée. Ajoute ton premier poids ci-dessus.</p></div>`; return; }
  list.innerHTML = state.weights.map(w => `<div class="list-item" style="cursor:default">
    <div><b>${esc(w.poids)} kg</b> <span class="note"> · ${new Date(w.date).toLocaleDateString('fr-FR')}</span>
    ${w.note?`<div class="note">${esc(w.note)}</div>`:''}</div></div>`).join('');
}

function drawChart(rows) {
  const ctx = $('#w-chart'); if (!window.Chart) return;
  if (state.chart) state.chart.destroy();
  state.chart = new Chart(ctx, {
    type: 'line',
    data: { labels: rows.map(r=>new Date(r.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})),
      datasets: [{ data: rows.map(r=>+r.poids), borderColor:'#ff6b4a', backgroundColor:'rgba(255,107,74,.15)',
        fill:true, tension:.3, pointRadius:3, pointBackgroundColor:'#ff6b4a' }] },
    options: { plugins:{legend:{display:false}}, scales:{
      x:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'rgba(220,232,244,.6)'} },
      y:{ grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'rgba(220,232,244,.6)'} } } }
  });
}

async function addWeight() {
  const poids = parseFloat($('#w-poids').value);
  const date = $('#w-date').value || new Date().toISOString().slice(0,10);
  if (!poids || poids<20 || poids>400) { toast('Poids invalide'); return; }
  const { error } = await supabase.from('suivi_poids').insert({ user_id: state.user.id, poids, date });
  if (error) { toast('Erreur'); return; }
  $('#w-poids').value=''; toast('Poids ajouté'); renderSuivi();
}

// ---------- PROFIL ----------
function renderProfil() {
  const planName = ({online_essentiel:'Essentiel',online_transformation:'Transformation',online_premium:'Premium'})[state.sub.plan] || state.sub.plan;
  const start = state.sub.current_period_start ? new Date(state.sub.current_period_start).toLocaleDateString('fr-FR') : '—';
  const end = state.sub.current_period_end ? new Date(state.sub.current_period_end).toLocaleDateString('fr-FR') : '—';
  $('#profil-content').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="k" style="color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em">Compte</div>
      <p style="margin:6px 0 0"><b>${esc(state.client?.prenom||'')} ${esc(state.client?.nom||'')}</b></p>
      <p class="note" style="margin:2px 0 0">${esc(state.user.email)}</p>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="k" style="color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em">Abonnement</div>
      <p style="margin:6px 0 0">Formule <b>${esc(planName)}</b></p>
      <p class="note" style="margin:2px 0 0">Période en cours : ${start} → ${end}</p>
      <p class="note" style="margin:8px 0 0">Engagement 3 mois minimum. Résiliation possible ensuite — contacte Sarah.</p>
    </div>
    <button class="btn btn-ghost btn-block" id="edit-obj">Modifier mes objectifs</button>`;
  $('#edit-obj').onclick = () => showOnboarding(true);
}

// ---------- ONBOARDING ----------
// Vocabulaire canonique unifié (mêmes codes que l'app mobile) : on STOCKE des codes, on AFFICHE des libellés.
const OB = [
  { key:'objectif', q:'Quel est ton objectif principal ?', opts:[
    {v:'perdre_du_poids', l:'Perte de poids'}, {v:'prendre_du_muscle', l:'Prise de muscle'},
    {v:'recomposition', l:'Recomposition'}, {v:'se_mettre_en_forme', l:'Remise en forme'},
    {v:'performance', l:'Performance'} ] },
  { key:'genre', q:'Tu es…', opts:[{v:'femme',l:'Femme'},{v:'homme',l:'Homme'},{v:'autre',l:'Autre'}] },
  { key:'niveau', q:'Ton niveau actuel ?', opts:[{v:'debutant',l:'Débutant'},{v:'intermediaire',l:'Intermédiaire'},{v:'avance',l:'Avancé'}] },
  { key:'jours', q:'Combien de séances par semaine ?', opts:[{v:'2',l:'2'},{v:'3',l:'3'},{v:'4',l:'4'},{v:'5+',l:'5+'}] },
  { key:'equipement', q:'De quel matériel disposes-tu ?', opts:[
    {v:'maison_leger', l:'Maison (peu de matériel)'}, {v:'maison_equipee', l:'Maison équipée'},
    {v:'salle', l:'Salle de sport'} ] },
  { key:'zones', multi:true, q:'Des zones à mettre en avant ? (plusieurs choix possibles)', opts:[
    {v:'glutes',l:'Fessiers'}, {v:'abs',l:'Abdos'}, {v:'arms',l:'Bras'}, {v:'legs',l:'Jambes'},
    {v:'back',l:'Dos'}, {v:'shoulders',l:'Épaules'}, {v:'chest',l:'Pectoraux'}, {v:'none',l:'Aucune en particulier'} ] },
  { key:'contraintes', multi:true, q:'Des sensibilités ou blessures à ménager ?', opts:[
    {v:'genoux',l:'Genoux'}, {v:'dos',l:'Dos / lombaires'}, {v:'epaules',l:'Épaules'},
    {v:'poignets',l:'Poignets'}, {v:'chevilles',l:'Chevilles'}, {v:'none',l:'Aucune'} ] },
];
// code -> libellé lisible pour l'affichage (tolère aussi les anciennes valeurs déjà en clair)
const OB_LABELS = Object.fromEntries(OB.flatMap(s => s.opts.map(o => [o.v, o.l])));
const pretty = (val) => val ? (OB_LABELS[val] || val) : '—';
let obStep = 0, obData = {}, obEdit = false;
function showOnboarding(edit=false) {
  obEdit = edit; obStep = 0; obData = edit ? { objectif:state.client?.objectif, genre:state.client?.genre, niveau:state.client?.niveau } : {};
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#v-onboarding').classList.add('active');
  $('#bottomnav').style.display = edit ? 'flex' : 'none';
  renderOb();
}
function renderOb() {
  const root = $('#ob-root');
  if (obStep >= OB.length) return finishOb();
  const s = OB[obStep];
  const pct = Math.round((obStep/OB.length)*100);
  root.innerHTML = `
    <div style="padding-top:28px"></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <p class="eyebrow">Étape ${obStep+1} / ${OB.length}</p>
    <h1 style="font-size:1.6rem;margin:6px 0 18px">${s.q}</h1>
    <div class="opts">${s.opts.map(o=>{const sel=s.multi?((obData[s.key]||[]).includes(o.v)):(obData[s.key]===o.v);return `<div class="opt ${sel?'sel':''}" data-v="${esc(o.v)}">${esc(o.l)}</div>`;}).join('')}</div>
    ${s.multi?'<p class="note" style="margin-top:8px">Plusieurs réponses possibles — ou « Aucune ».</p>':''}
    <div style="display:flex;gap:10px;margin-top:22px">
      ${obStep>0?'<button class="btn btn-ghost" id="ob-back">Retour</button>':''}
      <button class="btn btn-accent btn-block" id="ob-next">${obStep===OB.length-1?'Terminer':'Continuer'}</button>
    </div>`;
  $$('.opt').forEach(o => o.onclick = () => {
    if (s.multi) {
      let arr = Array.isArray(obData[s.key]) ? obData[s.key].slice() : [];
      const v = o.dataset.v;
      if (v === 'none') arr = ['none'];
      else { arr = arr.filter(x=>x!=='none'); arr = arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]; }
      obData[s.key] = arr;
      $$('.opt').forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v)));
    } else {
      obData[s.key]=o.dataset.v; $$('.opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel');
    }
  });
  $('#ob-next').onclick = () => {
    const val = obData[s.key];
    const ok = s.multi ? (Array.isArray(val) && val.length>0) : !!val;
    if(!ok){ toast(s.multi ? 'Choisis au moins une option' : 'Choisis une option'); return; }
    obStep++; renderOb();
  };
  if ($('#ob-back')) $('#ob-back').onclick = () => { obStep--; renderOb(); };
}
async function finishOb() {
  const root = $('#ob-root');
  root.innerHTML = `<div class="empty" style="padding-top:60px"><div class="ic">⏳</div><p>Enregistrement…</p></div>`;
  const zones = (obData.zones||[]).filter(z=>z && z!=='none');
  const contraintes = (obData.contraintes||[]).filter(c=>c && c!=='none');
  const payload = {
    email: state.user.email,
    prenom: state.client?.prenom || (state.user.user_metadata?.full_name || '').split(' ')[0] || null,
    objectif: obData.objectif, niveau: obData.niveau, genre: obData.genre,
    zones_cibles: zones, contraintes: contraintes,
    statut: state.client?.statut || 'abonne',
    notes: JSON.stringify({ jours_semaine: obData.jours, equipement: obData.equipement, source:'pwa_onboarding', updated: new Date().toISOString() }),
    updated_at: new Date().toISOString()
  };
  const { error } = await supabase.from('clients').upsert(payload, { onConflict: 'email' });
  if (error) { root.innerHTML = `<div class="empty"><div class="ic">⚠️</div><p>Erreur : ${esc(error.message)}</p><button class="btn btn-accent" onclick="location.reload()">Réessayer</button></div>`; return; }
  const { data: client } = await supabase.from('clients').select('*').eq('email', state.user.email).maybeSingle();
  state.client = client;

  // Génération automatique du programme sur mesure (à la première inscription seulement)
  if (client && !client.programme_id) {
    root.innerHTML = `<div class="empty" style="padding-top:60px"><div class="ic">⚙️</div><p>Création de ton programme sur mesure…<br>Ça prend quelques secondes 💪</p></div>`;
    try {
      const { error: genErr } = await supabase.rpc('generate_client_program', { p_client_id: client.id });
      if (genErr) console.warn('génération programme:', genErr.message);
      const { data: c2 } = await supabase.from('clients').select('*').eq('email', state.user.email).maybeSingle();
      if (c2) state.client = c2;
    } catch (e) { console.warn('génération programme (exception):', e); }
  }

  await loadProgramme();
  $('#bottomnav').style.display = 'flex';
  $('#v-onboarding').classList.remove('active');
  location.hash = '#accueil'; route();
  toast(obEdit ? 'Objectifs mis à jour' : 'Bienvenue ! 💪');
}
</script>
</body>
</html>
