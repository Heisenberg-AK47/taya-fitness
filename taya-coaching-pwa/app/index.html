<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace — Taya Fitness Coaching</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body { padding-bottom: 80px; }
  .appbar { position: sticky; top: 0; z-index: 40; background: rgba(13,27,42,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); }
  .appbar-in { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  .appbar-user { display: flex; align-items: center; gap: 10px; }
  /* Photo de profil : remplace les initiales dès qu'elle existe. */
  .app-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem; font-weight: 800; overflow: hidden;
  }
  .app-avatar.has-photo { background: transparent; }
  .app-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-family: var(--font-head); }
  .brand img { width: 30px; height: 30px; }
  .brand i { color: var(--accent); font-style: normal; }
  .iconbtn { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: .9rem; }
  main { padding-top: 18px; }
  .view { display: none; } .view.active { display: block; }
  .pagehead { margin: 6px 0 18px; }
  .pagehead h1 { font-size: 1.7rem; margin: 0; }
  .pagehead p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }

  /* bottom nav */
  .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--bg-2);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .bottomnav a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: .68rem; font-weight: 600; padding: 4px 14px; border-radius: 10px; }
  .bottomnav a .ic { font-size: 1.25rem; }
  .bottomnav a.active { color: var(--accent); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 12px; }
  .mini { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .mini .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .mini .v { font-size: 1.5rem; font-weight: 800; font-family: var(--font-head); margin-top: 2px; }

  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: border-color .15s; }
  .list-item:hover { border-color: var(--accent); }
  .list-item .day { width: 40px; height: 40px; border-radius: 10px; background: var(--card-2); display: grid; place-items: center; font-weight: 800; color: var(--accent); font-family: var(--font-head); flex-shrink: 0; }
  .pill { display: inline-block; font-size: .7rem; padding: 3px 9px; border-radius: 999px; background: rgba(255,107,74,.12); color: var(--accent); font-weight: 700; }
  .pill.muted { background: rgba(255,255,255,.06); color: var(--muted); }

  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px;
    display: grid; grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "main main" "sets thumb"; column-gap: 18px; }
  .ex-warm { grid-template-areas: "main thumb"; }
  .ex h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .ex .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .ex .ex-main { grid-area: main; min-width: 0; }
  .ex .sets { grid-area: sets; }
  .ex-thumb { grid-area: thumb; align-self: start; width: 230px; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--line); background: #000; cursor: pointer; padding: 0; transition: transform .12s, border-color .12s; }
  @media (min-width: 1000px) { .ex-thumb { width: 360px; } }
  .ex-thumb:hover { transform: scale(1.03); border-color: var(--accent); }
  .ex-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
  .ex-thumb .tplay { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1rem; color: #fff; background: rgba(0,0,0,.18); }
  /* modale vidéo */
  .vidmodal { position: fixed; inset: 0; z-index: 80; background: rgba(4,10,18,.85); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; }
  .vidmodal.open { display: flex; }
  .vidmodal-in { width: 100%; max-width: 720px; }
  .vidmodal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: #fff; }
  .vidmodal-head b { font-family: var(--font-head); font-size: 1.05rem; }
  .vm-close { flex-shrink: 0; background: rgba(255,255,255,.14); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 999px; cursor: pointer; font-size: 1rem; }
  .vidmodal-frame { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #000; }
  .vidmodal-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .phase-h { font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; margin: 20px 0 12px; display: flex; align-items: baseline; gap: 8px; }
  .phase-h:first-child { margin-top: 4px; }
  .phase-h span { font-weight: 600; font-size: .78rem; color: var(--muted); }
  .ex-warm { border-style: dashed; }
  .ex-warm h3 { font-size: 1rem; }
  .ob-fields { display: grid; gap: 12px; }
  .ob-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .ob-field > span { font-weight: 600; }
  .ob-input { display: flex; align-items: center; gap: 6px; }
  .ob-input input { width: 90px; background: var(--card-2); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 9px 10px; font-size: 1rem; text-align: right; }
  .ob-input input:focus { outline: none; border-color: var(--accent); }
  .ob-input i { color: var(--muted); font-style: normal; font-size: .85rem; width: 26px; }
  /* barre de progression de séance */
  .sess-prog { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
  .sess-prog .bar { flex: 1; height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
  .sess-prog .bar i { display: block; height: 100%; background: var(--grad); width: 0; transition: width .3s; }
  .sess-prog .lbl { font-size: .8rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .ex .consigne { font-size: .86rem; color: var(--muted); margin: 6px 0; }
  .sets { display: grid; gap: 8px; margin-top: 10px; }
  .setrow { display: grid; grid-template-columns: 34px minmax(0,132px) minmax(0,132px) 36px; gap: 8px; align-items: center; }
  .setrow label { font-size: .72rem; color: var(--muted); }
  .setrow input { background: var(--card-2); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 9px; font-size: .9rem; width: 100%; }
  .setrow input:focus { outline: none; border-color: var(--accent); }
  .setrow .sn { font-weight: 800; color: var(--accent); font-family: var(--font-head); text-align: center; }
  .check { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--card-2); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .check.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .weekbar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; }
  .weekbar button { flex-shrink: 0; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-size: .85rem; }
  .weekbar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .ic { font-size: 2.6rem; }
  .back { background: transparent; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; margin-bottom: 12px; font-size: .9rem; }

  /* onboarding */
  .ob { max-width: 520px; margin: 0 auto; }
  .ob .opts { display: grid; gap: 10px; }
  .ob .opt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-weight: 600; }
  .ob .opt.sel { border-color: var(--accent); background: rgba(255,107,74,.08); }
  .ob .prog { height: 5px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .ob .prog i { display: block; height: 100%; background: var(--grad); transition: width .3s; }
  .toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--good); color: #06301f;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem; z-index: 80; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  canvas { max-width: 100%; }

  /* ---------- Optimisations mobile ---------- */
  /* Champs à 16px : empêche le zoom automatique iOS au focus */
  .setrow input, .ob-input input { font-size: 16px; }
  @media (max-width: 480px) {
    main { padding-top: 12px; }
    h2 { font-size: 1.4rem; }
    .pagehead h1 { font-size: 1.45rem; }
    .pagehead p { font-size: .85rem; }
    .appbar-in { padding: 10px 0; }
    .iconbtn { padding: 7px 11px; font-size: .82rem; }
    .stat-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini { padding: 11px 10px; }
    .mini .k { font-size: .64rem; }
    .mini .v { font-size: 1.15rem; }
    .card { padding: 18px; }
    .ex { padding: 13px; column-gap: 12px; grid-template-areas: "main thumb" "sets sets"; }
    .ex h3 { font-size: .98rem; }
    .ex-thumb { width: 112px; }
    .phase-h { font-size: 1rem; margin: 16px 0 10px; }
    .sess-prog .lbl { font-size: .72rem; }
    .setrow { grid-template-columns: 28px 1fr 1fr 32px; gap: 6px; }
    .setrow input { padding: 9px 7px; }
    .check { width: 30px; height: 30px; }
    .weekbar button { padding: 6px 12px; font-size: .8rem; }
    .vidmodal-head b { font-size: .95rem; }
  }
</style>
</head>
<body>

<div id="loading" class="empty" style="padding-top:80px"><div class="ic">⏳</div><p>Chargement de ton espace…</p></div>

<div id="shell" style="display:none">
  <header class="appbar">
    <div class="container appbar-in">
      <div class="brand"><img src="/icons/icon-192.png" alt=""><span>TAYA <i>Fitness</i></span></div>
      <div class="appbar-user">
        <div class="app-avatar" id="app-avatar" title="Mon profil"></div>
        <button class="iconbtn" id="logout">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ACCUEIL -->
    <section id="v-accueil" class="view">
      <div class="pagehead"><h1 id="hello">Salut 👋</h1><p id="sub-status"></p></div>
      <div class="stat-row" id="home-stats"></div>
      <div style="margin-top:18px" id="home-program"></div>
    </section>

    <!-- PROGRAMME -->
    <section id="v-programme" class="view">
      <div class="pagehead"><h1>Mon programme</h1><p id="prog-sub"></p></div>
      <div id="prog-content"></div>
    </section>

    <!-- SUIVI -->
    <section id="v-suivi" class="view">
      <div class="pagehead"><h1>Suivi de poids</h1><p>Note ton poids régulièrement pour visualiser ta progression.</p></div>
      <div class="card" style="margin-bottom:18px">
        <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
          <div class="field" style="margin:0;flex:1;min-width:110px"><label>Poids (kg)</label><input id="w-poids" type="number" step="0.1" inputmode="decimal" placeholder="ex. 72.5"></div>
          <div class="field" style="margin:0;flex:1;min-width:130px"><label>Date</label><input id="w-date" type="date"></div>
          <button class="btn btn-accent" id="w-add" style="padding:13px 22px">Ajouter</button>
        </div>
      </div>
      <div class="card" style="margin-bottom:18px"><canvas id="w-chart" height="200"></canvas></div>
      <div id="w-list"></div>
    </section>

    <!-- AGENDA -->
    <section id="v-agenda" class="view">
      <div class="pagehead"><h1>Mon agenda</h1><p>Planifie tes séances : tu reçois un rappel 1h avant.</p></div>
      <div id="agenda-content"></div>
    </section>

    <!-- PROFIL -->
    <section id="v-profil" class="view">
      <div class="pagehead"><h1>Mon profil</h1></div>
      <div id="profil-content"></div>
    </section>

    <!-- ONBOARDING -->
    <section id="v-onboarding" class="view">
      <div class="ob" id="ob-root"></div>
    </section>
  </main>

  <nav class="bottomnav" id="bottomnav">
    <a href="#accueil" data-tab="accueil"><span class="ic">🏠</span>Accueil</a>
    <a href="#programme" data-tab="programme"><span class="ic">🏋️</span>Programme</a>
    <a href="#agenda" data-tab="agenda"><span class="ic">📅</span>Agenda</a>
    <a href="#suivi" data-tab="suivi"><span class="ic">📈</span>Suivi</a>
    <a href="#profil" data-tab="profil"><span class="ic">👤</span>Profil</a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
import { supabase, requireSubscription } from '/assets/supabase.js';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const toast = (msg) => { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); };
const esc = (s) => (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const state = { user:null, sub:null, client:null, programme:null, workouts:[], week:1, weights:[], chart:null };

/**
 * Sur téléphone, l'app ne s'utilise que depuis l'écran d'accueil.
 *
 * Ce n'est pas un caprice : hors installation, iOS interdit purement et
 * simplement les notifications — donc pas de rappel de séance, qui est la
 * fonction la plus utile de l'app.
 *
 * On ne bloque QUE le mobile : sur ordinateur la notion d'écran d'accueil
 * n'existe pas, et bloquer un client qui paie parce qu'il est sur son
 * portable serait absurde.
 */
function exigerInstallation() {
  const ua = navigator.userAgent;
  const mobile = /iPad|iPhone|iPod|Android/.test(ua) && !window.MSStream;
  if (!mobile) return false;

  const installee = window.matchMedia('(display-mode: standalone)').matches
                 || window.navigator.standalone === true;
  if (installee) return false;

  location.replace('/installer');
  return true;
}

// ══════════════════════════════════════════════════════════════════
//   AGENDA — planification des séances + rappels
// ══════════════════════════════════════════════════════════════════
const PUSH_CONFIG_URL = 'https://esylzsacjkimcqxllhwd.supabase.co/functions/v1/push-config';
let pushEtat = null;   // { pret, cle_publique } — chargé une fois

const pad = (n) => String(n).padStart(2, '0');
function isoLocal(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function libelleQuand(iso) {
  const d = new Date(iso);
  const jour = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  return `${jour} · ${heure}`;
}

async function loadSeances() {
  const { data } = await supabase.from('seances_planifiees')
    .select('*').eq('user_id', state.user.id)
    .order('date_heure', { ascending: true });
  return data || [];
}

async function renderAgenda() {
  const el = $('#agenda-content');
  el.innerHTML = `<p class="note">Chargement…</p>`;

  const [seances] = await Promise.all([loadSeances(), chargerPushEtat()]);
  const maintenant = new Date();
  const avenir = seances.filter(s => new Date(s.date_heure) >= maintenant && s.statut !== 'annulee');
  const passees = seances.filter(s => new Date(s.date_heure) < maintenant || s.statut === 'annulee').reverse();

  // Séances proposées par le programme, pour pré-remplir le titre.
  const options = (state.workouts || []).map(w =>
    `<option value="${esc(w.name)}">${esc(w.name)}</option>`).join('');

  const min = isoLocal(new Date(maintenant.getTime() + 60*60*1000)); // au plus tôt dans 1h

  el.innerHTML = `
    ${blocRappels()}

    <div class="card" style="margin-bottom:18px">
      <h3 style="margin:0 0 12px">Planifier une séance</h3>
      <div class="field"><label>Séance</label>
        ${options
          ? `<select id="ag-titre">${options}<option value="__libre">Autre / séance libre</option></select>
             <input id="ag-titre-libre" type="text" placeholder="Nom de ta séance" style="display:none;margin-top:8px">`
          : `<input id="ag-titre" type="text" placeholder="Ex. Haut du corps" value="Séance">`}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:200px"><label>Date et heure</label>
          <input id="ag-quand" type="datetime-local" min="${min}"></div>
        <div class="field" style="width:110px"><label>Durée (min)</label>
          <input id="ag-duree" type="number" min="15" step="15" value="60"></div>
      </div>
      <button class="btn btn-accent btn-block" id="ag-add">Ajouter à mon agenda</button>
    </div>

    <h3 style="margin:6px 0 12px">À venir</h3>
    <div id="ag-avenir">${avenir.length
      ? avenir.map(carteSeance).join('')
      : `<p class="note">Aucune séance planifiée. Ajoute-en une ci-dessus 💪</p>`}</div>

    ${passees.length ? `<h3 style="margin:26px 0 12px;color:var(--muted)">Historique</h3>
      <div style="opacity:.6">${passees.slice(0,10).map(carteSeance).join('')}</div>` : ''}
  `;

  brancherAgenda();
}

function carteSeance(s) {
  const passee = new Date(s.date_heure) < new Date();
  const rappel = s.rappel_envoye_at ? '🔔 rappel envoyé'
             : (passee ? '' : '🔔 rappel 1h avant');
  return `
    <div class="list-item" style="cursor:default">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700">${esc(s.titre)}</div>
        <div class="note" style="margin-top:3px">${libelleQuand(s.date_heure)} · ${s.duree_min} min</div>
        ${rappel ? `<div class="pill muted" style="margin-top:6px">${rappel}</div>` : ''}
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        ${passee ? '' : `<button class="iconbtn" data-ics="${s.id}" title="Ajouter à mon calendrier">📆</button>
        <button class="iconbtn" data-del="${s.id}" title="Supprimer">✕</button>`}
      </div>
    </div>`;
}

function brancherAgenda() {
  const sel = $('#ag-titre');
  if (sel && sel.tagName === 'SELECT') {
    sel.onchange = () => {
      const libre = sel.value === '__libre';
      const inp = $('#ag-titre-libre');
      inp.style.display = libre ? 'block' : 'none';
      if (libre) inp.focus();
    };
  }

  $('#ag-add').onclick = async () => {
    const sel = $('#ag-titre');
    let titre = sel ? sel.value : 'Séance';
    if (titre === '__libre') titre = ($('#ag-titre-libre').value || '').trim() || 'Séance libre';
    const quand = $('#ag-quand').value;
    const duree = parseInt($('#ag-duree').value) || 60;
    if (!quand) { toast('Choisis une date et une heure'); return; }
    if (new Date(quand) <= new Date()) { toast('Choisis un créneau à venir'); return; }

    const btn = $('#ag-add'); btn.disabled = true; btn.textContent = '...';
    const { error } = await supabase.from('seances_planifiees').insert({
      user_id: state.user.id, titre, date_heure: new Date(quand).toISOString(), duree_min: duree,
    });
    if (error) { toast('Erreur : ' + error.message); btn.disabled = false; btn.textContent = 'Ajouter à mon agenda'; return; }
    toast('Séance planifiée 📅');
    renderAgenda();
  };

  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Supprimer cette séance de ton agenda ?')) return;
    await supabase.from('seances_planifiees').delete().eq('id', b.dataset.del).eq('user_id', state.user.id);
    renderAgenda();
  });

  $$('[data-ics]').forEach(b => b.onclick = async () => {
    const { data } = await supabase.from('seances_planifiees').select('*').eq('id', b.dataset.ics).maybeSingle();
    if (data) telechargerICS(data);
  });
}

/* ── Ajout au calendrier du téléphone : marche partout, sans permission ── */
function telechargerICS(s) {
  const debut = new Date(s.date_heure);
  const fin = new Date(debut.getTime() + (s.duree_min || 60) * 60000);
  const z = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Taya Fitness//FR',
    'BEGIN:VEVENT',
    `UID:${s.id}@tayafitness.com`,
    `DTSTAMP:${z(new Date())}`,
    `DTSTART:${z(debut)}`, `DTEND:${z(fin)}`,
    `SUMMARY:🏋️ ${s.titre} — Taya Fitness`,
    'DESCRIPTION:Ta séance de coaching Taya Fitness.',
    // Rappel natif du calendrier, 1h avant — indépendant des notifications push.
    'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY',
    'DESCRIPTION:Ta séance Taya Fitness dans 1h', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'seance-taya.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ── Rappels push : bandeau selon l'état d'autorisation ──────────── */
function blocRappels() {
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
    return `<div class="card" style="margin-bottom:18px"><p class="note">
      📆 Ajoute chaque séance à ton calendrier (bouton 📆) pour un rappel — les notifications ne sont pas disponibles sur cet appareil.</p></div>`;
  }
  if (pushEtat && !pushEtat.pret) {
    return `<div class="card" style="margin-bottom:18px"><p class="note">
      📆 Utilise le bouton 📆 sur chaque séance pour un rappel dans ton calendrier.</p></div>`;
  }
  if (Notification.permission === 'granted') {
    return `<div class="card" style="margin-bottom:18px;border-color:var(--good)">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:1.3rem">🔔</span>
        <div><b>Rappels activés</b><div class="note">Tu recevras une notification 1h avant chaque séance.</div></div>
      </div></div>`;
  }
  if (Notification.permission === 'denied') {
    return `<div class="card" style="margin-bottom:18px"><p class="note">
      🔕 Les notifications sont bloquées dans les réglages de ton téléphone. Tu peux quand même ajouter chaque séance à ton calendrier avec le bouton 📆.</p></div>`;
  }
  return `<div class="card" style="margin-bottom:18px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span style="font-size:1.3rem">🔔</span>
      <div><b>Active les rappels</b><div class="note">Une notification 1h avant chaque séance, pour ne plus en manquer.</div></div>
    </div>
    <button class="btn btn-accent btn-block" id="ag-notif">Activer les notifications</button>
  </div>`;
}

async function chargerPushEtat() {
  if (pushEtat) return pushEtat;
  try {
    const r = await fetch(PUSH_CONFIG_URL);
    pushEtat = await r.json();
  } catch (_) { pushEtat = { pret: false, cle_publique: null }; }
  return pushEtat;
}

// base64url -> Uint8Array, format attendu par pushManager.subscribe
function urlB64ToUint8(base64) {
  const p = '='.repeat((4 - base64.length % 4) % 4);
  const b = (base64 + p).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function activerNotifications() {
  const btn = $('#ag-notif');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications refusées'); renderAgenda(); return; }

    const etat = await chargerPushEtat();
    if (!etat.pret || !etat.cle_publique) { toast('Rappels bientôt disponibles'); renderAgenda(); return; }

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8(etat.cle_publique),
      });
    }
    const j = sub.toJSON();
    await supabase.from('push_abonnements').upsert({
      user_id: state.user.id,
      endpoint: sub.endpoint,
      p256dh: j.keys.p256dh,
      auth: j.keys.auth,
      appareil: navigator.userAgent.slice(0, 120),
    }, { onConflict: 'endpoint' });

    toast('Rappels activés 🔔');
  } catch (e) {
    console.error(e); toast("Impossible d'activer les notifications");
  }
  renderAgenda();
}

function previsionnel(cl) {
  const obj = (cl?.objectif || '').toLowerCase();
  let jours = 3;
  try { jours = parseInt(JSON.parse(cl?.notes || '{}').jours_semaine) || 3; } catch (e) {}
  if (/perdre|poids|perte/.test(obj)) {
    const lo = jours >= 4 ? 3 : 2, hi = jours >= 4 ? 6 : (jours >= 3 ? 5 : 4);
    return `À ~${jours} séances/semaine et avec une alimentation adaptée, vise une perte régulière de <b>${lo} à ${hi} kg en 8 semaines</b> — et une bien meilleure condition physique. La régularité fait tout. 💪`;
  }
  if (/muscle|masse/.test(obj)) return `En <b>8 à 12 semaines</b>, attends-toi à des muscles plus dessinés et <b>+10 à 20 % de force</b> sur tes exercices. Assez de protéines + régularité = résultats. 💪`;
  if (/sculpt|recompo/.test(obj)) return `En <b>8 à 12 semaines</b> : une silhouette plus tonique, un tour de taille affiné et beaucoup plus d'énergie. 💪`;
  if (/perf/.test(obj)) return `En <b>8 à 12 semaines</b> : une nette progression sur tes charges et ta puissance. Reste régulier et récupère bien. 💪`;
  return `En <b>8 semaines</b> : plus d'endurance, moins d'essoufflement, un corps qui bouge mieux au quotidien. Le plus dur, c'était de commencer — et c'est fait ! 💪`;
}

function renderProgramme() {
  const c = $('#prog-content');

  $('#prog-sub').textContent = state.programme.titre;

  if (currentWorkout) { renderWorkoutDetail(currentWorkout); return; }

  // group workouts by day_number (unique séances)
  const seen = new Map();
  state.workouts.forEach(w => { if(!seen.has(w.day_number)) seen.set(w.day_number, w); });
  const days = [...seen.values()].sort((a,b)=>a.day_number-b.day_number);

  if (!days.length) { c.innerHTML = `<div class="empty"><div class="ic">📝</div><p>Aucune séance pour l'instant.</p><button class="btn btn-accent" style="margin-top:14px" onclick="genProgram()">⚙️ (Re)générer mon programme</button></div>`; return; }

  c.innerHTML = `<div class="weekbar" id="weekbar"></div>` + days.map(w => `
    <div class="list-item" data-day="${w.day_number}">
      <div style="display:flex;align-items:center;gap:14px">

      </div><div style="color:var(--accent);font-size:1.4rem">›</div>

  const weeks = state.programme.duree_semaines || Math.max(1, ...state.workouts.map(w=>w.week_number||1));

  wb.innerHTML = Array.from({length:weeks}, (_,i)=>i+1).map(n =>
    `<button data-week="${n}" class="${n===state.week?'active':''}">Semaine ${n}</button>`).join('');
  $$('#weekbar button').forEach(b => b.onclick = () => { state.week=+b.dataset.week; renderProgramme(); });
  $$('.list-item').forEach(li => li.onclick = () => { currentWorkout = +li.dataset.day; renderProgramme(); });

async function renderWorkoutDetail(dayNumber) {
  const c = $('#prog-content');
  const w = state.workouts.find(x => x.day_number===dayNumber) || {};
  c.innerHTML = `<button class="back" id="back">← Toutes les séances</button>
    <div class="pill">Semaine ${state.week}</div>
    <h2 style="margin:8px 0 14px">${esc(w.name||('Séance '+dayNumber))}</h2>
    <div class="sess-prog" id="sess-prog" style="display:none"><div class="bar"><i></i></div><span class="lbl"></span></div>
    <div id="ex-list"><div class="empty"><div class="ic">⏳</div><p>Chargement…</p></div></div>`;
  $('#back').onclick = () => { currentWorkout = null; renderProgramme(); };

  // exercises for this programme + week + day
  const { data: pes } = await supabase.from('programme_exercises').select('*')
    .eq('programme_id', state.programme.id).eq('week_number', state.week).eq('day_number', dayNumber)
    .order('order_index', { ascending: true });

  let rows = pes || [];
  // fallback: some programmes store exercises on week 1 only
  if (!rows.length && state.week !== 1) {
    const { data: pe1 } = await supabase.from('programme_exercises').select('*')
      .eq('programme_id', state.programme.id).eq('week_number', 1).eq('day_number', dayNumber)
      .order('order_index', { ascending: true });
    rows = pe1 || [];
  }
  if (!rows.length) { $('#ex-list').innerHTML = `<div class="empty"><div class="ic">🛈</div><p>Aucun exercice pour cette séance/semaine.</p></div>`; return; }

  const exIds = [...new Set(rows.map(r=>r.exercise_id).filter(Boolean))];
  const { data: exs } = await supabase.from('exercises').select('*').in('id', exIds);
  const exMap = Object.fromEntries((exs||[]).map(e=>[e.id,e]));

  // existing logs
  const peIds = rows.map(r=>r.id);
  const { data: logs } = await supabase.from('workout_logs').select('*')
    .eq('user_id', state.user.id).in('programme_exercise_id', peIds).eq('week_number', state.week);
  const logMap = {};
  (logs||[]).forEach(l => { logMap[`${l.programme_exercise_id}_${l.set_number}`] = l; });

  const thumbHtml = (e) => { const yt=e.youtube_id; if(!yt) return ''; return `<button class="ex-thumb" data-yt="${esc(yt)}" data-title="${esc(e.name||'')}" aria-label="Voir la vidéo"><img src="https://img.youtube.com/vi/${esc(yt)}/hqdefault.jpg" alt="" loading="lazy"><span class="tplay">▶</span></button>`; };
  const renderMain = (pe) => {
    const e = exMap[pe.exercise_id] || {};
    const nSets = pe.sets || 3;
    const muscle = (e.tags && e.tags.length) ? e.tags[0] : '';
    const repos = pe.rest_seconds ? `${pe.rest_seconds}s` : (e.repos||'');
    const sets = Array.from({length:nSets}, (_,i)=>{
      const sn=i+1; const lg = logMap[`${pe.id}_${sn}`] || {};
      return `<div class="setrow" data-pe="${pe.id}" data-set="${sn}">
        <div class="sn">S${sn}</div>
        <input class="in-reps" inputmode="numeric" placeholder="${esc(pe.reps||'reps')}" value="${esc(lg.reps||'')}">
        <input class="in-charge" inputmode="decimal" placeholder="kg" value="${esc(lg.charge||'')}">
        <div class="check ${lg.done?'on':''}">✓</div>
      </div>`;
    }).join('');
    return `<div class="ex">
      <div class="ex-main">
        <h3>${esc(e.name||'Exercice')}</h3>
        <div class="meta">
          ${muscle?`<span class="pill">${esc(muscle)}</span>`:''}
          <span class="pill muted">${esc(pe.sets||3)} × ${esc(pe.reps||'—')}</span>
          ${repos?`<span class="pill muted">repos ${esc(repos)}</span>`:''}
        </div>
        ${e.consignes?`<div class="consigne">💡 ${esc(e.consignes)}</div>`:''}
      </div>
      ${thumbHtml(e)}
      <div class="sets">${sets}</div>
    </div>`;
  };
  const renderWarm = (pe) => {
    const e = exMap[pe.exercise_id] || {};
    return `<div class="ex ex-warm">
      <div class="ex-main">
        <h3>${esc(e.name||'Exercice')}</h3>
        <div class="meta"><span class="pill muted">${esc(pe.reps||'30-45 sec')}</span></div>
        ${e.consignes?`<div class="consigne">💡 ${esc(e.consignes)}</div>`:''}
      </div>
      ${thumbHtml(e)}
    </div>`;
  };
  const warm = rows.filter(r => r.phase === 'warmup');
  const main = rows.filter(r => r.phase !== 'warmup');
  $('#ex-list').innerHTML =
    (warm.length ? `<div class="phase-h">🔥 Échauffement <span>~3 min · en douceur</span></div>` + warm.map(renderWarm).join('') : '')
    + `<div class="phase-h">💪 La séance</div>`
    + (main[0] && main[0].notes ? `<div class="consigne" style="margin:0 0 12px">📈 ${esc(main[0].notes)}</div>` : '')
    + main.map(renderMain).join('');

  // wire logging (debounced save on blur / check toggle)
  $$('.setrow').forEach(row => {
    const pe = row.dataset.pe, sn = +row.dataset.set;
    const reps = $('.in-reps', row), charge = $('.in-charge', row), chk = $('.check', row);
    const save = async (done) => {
      await supabase.from('workout_logs').upsert({
        user_id: state.user.id, programme_exercise_id: pe, week_number: state.week, set_number: sn,
        reps: reps.value || null, charge: charge.value || null, done: done,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,programme_exercise_id,week_number,set_number' });
    };
    reps.addEventListener('change', ()=>save(chk.classList.contains('on')));
    charge.addEventListener('change', ()=>save(chk.classList.contains('on')));
    chk.addEventListener('click', async ()=>{ chk.classList.toggle('on'); updateSessProg(); await save(chk.classList.contains('on')); toast('Série enregistrée'); });
  });

  // vidéos : miniature compacte -> ouvre le lecteur en grand (modale)
  $$('.ex-thumb').forEach(b => b.addEventListener('click', () => openVideo(b.dataset.yt, b.dataset.title)));

  updateSessProg();
}
function openVideo(id, title) {
  if (!id) return;
  let m = $('#vidmodal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'vidmodal'; m.className = 'vidmodal';
    m.innerHTML = `<div class="vidmodal-in"><div class="vidmodal-head"><b id="vm-title"></b><button class="vm-close" aria-label="Fermer">✕</button></div><div class="vidmodal-frame" id="vm-frame"></div></div>`;
    document.body.appendChild(m);
    const close = () => { m.classList.remove('open'); const f = $('#vm-frame'); if (f) f.innerHTML = ''; };
    m.addEventListener('click', e => { if (e.target === m || e.target.classList.contains('vm-close')) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  }
  $('#vm-title').textContent = title || 'Démonstration';
  $('#vm-frame').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="Démonstration" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  m.classList.add('open');
}
function updateSessProg() {
  const checks = $$('#ex-list .setrow .check');
  const p = $('#sess-prog');
  if (!p || !checks.length) return;
  const done = checks.filter(c => c.classList.contains('on')).length;
  p.style.display = 'flex';
  $('.bar i', p).style.width = Math.round(done / checks.length * 100) + '%';
  $('.lbl', p).textContent = done === checks.length ? '🎉 Séance terminée, bravo !' : `${done}/${checks.length} séries`;
}

async function addWeight() {
  const poids = parseFloat($('#w-poids').value);
  const date = $('#w-date').value || new Date().toISOString().slice(0,10);
  if (!poids || poids<20 || poids>400) { toast('Poids invalide'); return; }
  const { error } = await supabase.from('suivi_poids').insert({ user_id: state.user.id, poids, date });
  if (error) { toast('Erreur'); return; }
  $('#w-poids').value=''; toast('Poids ajouté'); renderSuivi();
}

// ---------- PROFIL ----------
function renderProfil() {
  const planName = ({online_essentiel:'Essentiel',online_transformation:'Transformation',online_premium:'Premium'})[state.sub.plan] || state.sub.plan;
  const start = state.sub.current_period_start ? new Date(state.sub.current_period_start).toLocaleDateString('fr-FR') : '—';
  const end = state.sub.current_period_end ? new Date(state.sub.current_period_end).toLocaleDateString('fr-FR') : '—';
  $('#profil-content').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="k" style="color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em">Compte</div>
      <p style="margin:6px 0 0"><b>${esc(state.client?.prenom||'')} ${esc(state.client?.nom||'')}</b></p>
      <p class="note" style="margin:2px 0 0">${esc(state.user.email)}</p>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="k" style="color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em">Abonnement</div>
      <p style="margin:6px 0 0">Formule <b>${esc(planName)}</b></p>
      <p class="note" style="margin:2px 0 0">Période en cours : ${start} → ${end}</p>
      <p class="note" style="margin:8px 0 0">Engagement 3 mois minimum. Résiliation possible ensuite — contacte Sarah.</p>
    </div>
    <button class="btn btn-ghost btn-block" id="edit-obj">Modifier mes objectifs</button>`;
  $('#edit-obj').onclick = () => showOnboarding(true);
}

// ---------- ONBOARDING ----------
// Vocabulaire canonique unifié (mêmes codes que l'app mobile) : on STOCKE des codes, on AFFICHE des libellés.
const OB = [
  { key:'objectif', q:'Quel est ton objectif principal ?', opts:[
    {v:'perdre_du_poids', l:'Perte de poids'}, {v:'prendre_du_muscle', l:'Prise de muscle'},
    {v:'recomposition', l:'Recomposition'}, {v:'se_mettre_en_forme', l:'Remise en forme'},
    {v:'performance', l:'Performance'} ] },
  { key:'genre', q:'Tu es…', opts:[{v:'femme',l:'Femme'},{v:'homme',l:'Homme'}] },
  { key:'niveau', q:'Ton niveau actuel ?', opts:[{v:'debutant',l:'Débutant'},{v:'intermediaire',l:'Intermédiaire'},{v:'avance',l:'Avancé'}] },
  { key:'mesures', type:'fields', q:'Tes mesures — pour un programme et un objectif précis', fields:[
    {k:'age', l:'Âge', ph:'ex. 30', suffix:'ans'},
    {k:'poids', l:'Poids', ph:'ex. 72', suffix:'kg'},
    {k:'taille', l:'Taille', ph:'ex. 175', suffix:'cm'} ] },
  { key:'jours', q:'Combien de séances peux-tu faire par semaine, de façon réaliste ?', opts:[{v:'2',l:'2'},{v:'3',l:'3'},{v:'4',l:'4'},{v:'5+',l:'5+'}] },
  { key:'equipement', q:'De quel matériel disposes-tu ?', opts:[
    {v:'maison_leger', l:'Maison (peu de matériel)'}, {v:'maison_equipee', l:'Maison équipée'},
    {v:'salle', l:'Salle de sport'} ] },
  { key:'zones', multi:true, q:'Des zones à mettre en avant ? (plusieurs choix possibles)', opts:[
    {v:'glutes',l:'Fessiers'}, {v:'abs',l:'Abdos'}, {v:'arms',l:'Bras'}, {v:'legs',l:'Jambes'},
    {v:'back',l:'Dos'}, {v:'shoulders',l:'Épaules'}, {v:'chest',l:'Pectoraux'}, {v:'none',l:'Aucune en particulier'} ] },
  { key:'contraintes', multi:true, q:'Des sensibilités ou blessures à ménager ?', opts:[
    {v:'genoux',l:'Genoux'}, {v:'dos',l:'Dos / lombaires'}, {v:'epaules',l:'Épaules'},
    {v:'poignets',l:'Poignets'}, {v:'chevilles',l:'Chevilles'}, {v:'none',l:'Aucune'} ] },
];
// code -> libellé lisible pour l'affichage (tolère aussi les anciennes valeurs déjà en clair)
const OB_LABELS = Object.fromEntries(OB.flatMap(s => (s.opts||[]).map(o => [o.v, o.l])));
const pretty = (val) => val ? (OB_LABELS[val] || val) : '—';
let obStep = 0, obData = {}, obEdit = false;
function showOnboarding(edit=false) {
  obEdit = edit; obStep = 0; obData = edit ? { objectif:state.client?.objectif, genre:state.client?.genre, niveau:state.client?.niveau } : {};
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#v-onboarding').classList.add('active');
  $('#bottomnav').style.display = edit ? 'flex' : 'none';
  renderOb();
}
function renderOb() {
  const root = $('#ob-root');
  if (obStep >= OB.length) return finishOb();
  const s = OB[obStep];
  const pct = Math.round((obStep/OB.length)*100);
  const body = (s.type === 'fields')
    ? `<div class="ob-fields">${s.fields.map(f=>`<label class="ob-field"><span>${esc(f.l)}</span><span class="ob-input"><input type="number" inputmode="numeric" data-k="${f.k}" placeholder="${esc(f.ph)}" value="${esc(obData[f.k]??'')}"><i>${esc(f.suffix)}</i></span></label>`).join('')}</div>
       <p class="note" style="margin-top:10px">Facultatif — mais plus tu en dis, plus ton programme et ton prévisionnel sont précis.</p>`
    : `<div class="opts">${s.opts.map(o=>{const sel=s.multi?((obData[s.key]||[]).includes(o.v)):(obData[s.key]===o.v);return `<div class="opt ${sel?'sel':''}" data-v="${esc(o.v)}">${esc(o.l)}</div>`;}).join('')}</div>
       ${s.multi?'<p class="note" style="margin-top:8px">Plusieurs réponses possibles — ou « Aucune ».</p>':''}`;
  root.innerHTML = `
    <div style="padding-top:28px"></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <p class="eyebrow">Étape ${obStep+1} / ${OB.length}</p>
    <h1 style="font-size:1.6rem;margin:6px 0 18px">${s.q}</h1>
    ${body}
    <div style="display:flex;gap:10px;margin-top:22px">
      ${obStep>0?'<button class="btn btn-ghost" id="ob-back">Retour</button>':''}
      <button class="btn btn-accent btn-block" id="ob-next">${obStep===OB.length-1?'Terminer':'Continuer'}</button>
    </div>`;
  if (s.type === 'fields') {
    $$('.ob-field input').forEach(inp => inp.oninput = () => { obData[inp.dataset.k] = inp.value; });
  } else {
    $$('.opt').forEach(o => o.onclick = () => {
      if (s.multi) {
        let arr = Array.isArray(obData[s.key]) ? obData[s.key].slice() : [];
        const v = o.dataset.v;
        if (v === 'none') arr = ['none'];
        else { arr = arr.filter(x=>x!=='none'); arr = arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]; }
        obData[s.key] = arr;
        $$('.opt').forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v)));
      } else {
        obData[s.key]=o.dataset.v; $$('.opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel');
      }
    });
  }
  $('#ob-next').onclick = () => {
    if (s.type !== 'fields') {
      const val = obData[s.key];
      const ok = s.multi ? (Array.isArray(val) && val.length>0) : !!val;
      if(!ok){ toast(s.multi ? 'Choisis au moins une option' : 'Choisis une option'); return; }
    }
    obStep++; renderOb();
  };
  if ($('#ob-back')) $('#ob-back').onclick = () => { obStep--; renderOb(); };
}
async function finishOb() {
  const root = $('#ob-root');
  root.innerHTML = `<div class="empty" style="padding-top:60px"><div class="ic">⏳</div><p>Enregistrement…</p></div>`;
  const zones = (obData.zones||[]).filter(z=>z && z!=='none');
  const contraintes = (obData.contraintes||[]).filter(c=>c && c!=='none');
  const numOr = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
  const payload = {
    email: state.user.email,
    // On repart du nom complet du compte pour ne pas laisser la fiche CRM
    // vide : le prenom seul ne suffit pas a Sarah pour identifier quelqu'un.
    prenom: state.client?.prenom || (state.user.user_metadata?.full_name || '').split(' ')[0] || null,
    nom:    state.client?.nom    || (state.user.user_metadata?.full_name || '').split(' ').slice(1).join(' ') || null,
    objectif: obData.objectif, niveau: obData.niveau, genre: obData.genre,
    age: numOr(obData.age), poids_kg: numOr(obData.poids), taille_cm: numOr(obData.taille),
    zones_cibles: zones, contraintes: contraintes,
    statut: state.client?.statut || 'abonne',
    notes: JSON.stringify({ jours_semaine: obData.jours, equipement: obData.equipement, source:'pwa_onboarding', updated: new Date().toISOString() }),
    updated_at: new Date().toISOString()
  };
  const { error } = await supabase.from('clients').upsert(payload, { onConflict: 'email' });
  if (error) { root.innerHTML = `<div class="empty"><div class="ic">⚠️</div><p>Erreur : ${esc(error.message)}</p><button class="btn btn-accent" onclick="location.reload()">Réessayer</button></div>`; return; }
  const { data: client } = await supabase.from('clients').select('*').eq('email', state.user.email).maybeSingle();
  state.client = client;

  // Génération automatique du programme sur mesure (à la première inscription seulement)
  if (client && !client.programme_id) {
    root.innerHTML = `<div class="empty" style="padding-top:60px"><div class="ic">⚙️</div><p>Création de ton programme sur mesure…<br>Ça prend quelques secondes 💪</p></div>`;
    try {
      const { error: genErr } = await supabase.rpc('generate_client_program', { p_client_id: client.id });
      if (genErr) console.warn('génération programme:', genErr.message);
      const { data: c2 } = await supabase.from('clients').select('*').eq('email', state.user.email).maybeSingle();
      if (c2) state.client = c2;
    } catch (e) { console.warn('génération programme (exception):', e); }
  }

  await loadProgramme();
  $('#bottomnav').style.display = 'flex';
  $('#v-onboarding').classList.remove('active');
  location.hash = '#accueil'; route();
  toast(obEdit ? 'Objectifs mis à jour' : 'Bienvenue ! 💪');
}
</script>
</body>
</html>
