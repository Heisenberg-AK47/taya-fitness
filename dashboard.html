<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon espace — Taya Fitness</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/navbar.css" />
<link rel="stylesheet" href="/css/footer.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
<style>
  .form-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold, #fe00e5);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .profil-form textarea {
    width: 100%;
    background: var(--black-border, #1a2035);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--white, #fff);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    resize: vertical;
    transition: border-color .2s;
    line-height: 1.6;
  }
  .profil-form textarea:focus { border-color: var(--gold, #fe00e5); }
  .profil-form select {
    width: 100%;
    background: var(--black-border, #1a2035);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--white, #fff);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color .2s;
    cursor: pointer;
  }
  .profil-form select:focus { border-color: var(--gold, #fe00e5); }
  .profil-form select option { background: #1a2035; }

  /* ── Photo de profil ─────────────────────────────────────── */
  .avatar-btn {
    position: relative; padding: 0; border: none; background: none;
    cursor: pointer; border-radius: 50%; flex-shrink: 0; line-height: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .avatar-btn .sidebar-avatar { overflow: hidden; transition: filter .2s; }
  .avatar-btn img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 50%; display: block;
  }
  .avatar-cam {
    position: absolute; right: -2px; bottom: -2px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--gold, #fe00e5); color: #fff;
    font-size: 13px; line-height: 26px; text-align: center;
    border: 2px solid #16273a; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    transition: transform .2s;
  }

  /* ── Recadrage de la photo ───────────────────────────────── */
  .crop-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(6,12,20,.86); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .crop-box {
    background: #16273a; border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px; padding: 24px; width: 100%; max-width: 380px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .crop-box h3 {
    margin: 0 0 4px; font-size: 1.05rem; color: #f0f4f8; text-align: center;
  }
  .crop-box .crop-aide {
    margin: 0 0 18px; font-size: .78rem; color: rgba(220,232,244,.5);
    text-align: center; line-height: 1.5;
  }
  /* Zone ronde : l'image se déplace dessous, le disque sert de fenêtre. */
  .crop-zone {
    position: relative; width: 260px; height: 260px; margin: 0 auto 18px;
    border-radius: 50%; overflow: hidden; cursor: grab;
    background: #0d1b2a; touch-action: none;
    box-shadow: 0 0 0 2px var(--gold, #fe00e5), 0 0 0 12px rgba(254,0,229,.08);
  }
  .crop-zone:active { cursor: grabbing; }
  .crop-zone canvas { display: block; width: 100%; height: 100%; }
  .crop-range {
    width: 100%; margin: 0 0 20px; accent-color: var(--gold, #fe00e5);
    display: block;
  }
  .crop-actions { display: flex; gap: 10px; }
  .crop-actions button {
    flex: 1; padding: 12px; border-radius: 10px; font-size: .9rem;
    font-weight: 600; cursor: pointer; border: none;
  }
  .crop-annuler {
    background: transparent; color: rgba(220,232,244,.7);
    border: 1px solid rgba(255,255,255,.14) !important;
  }
  .crop-valider { background: var(--gold, #fe00e5); color: #fff; }
  .crop-valider:disabled { opacity: .55; cursor: default; }
  .avatar-btn:hover .sidebar-avatar { filter: brightness(.7); }
  .avatar-btn:hover .avatar-cam { transform: scale(1.12); }
  .avatar-btn:focus-visible { outline: 2px solid var(--gold, #fe00e5); outline-offset: 3px; }
  /* Pendant l'envoi */
  .avatar-spin {
    position: absolute; inset: 0; border-radius: 50%;
    background: rgba(0,0,0,.55);
    border: 2px solid transparent; border-top-color: var(--gold, #fe00e5);
    animation: avatar-turn .7s linear infinite;
  }
  @keyframes avatar-turn { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="navbar-placeholder"></div>
<main class="dashboard-main">
<div class="container">

<!-- Sidebar -->
<aside class="dashboard-sidebar">
<div class="sidebar-user" id="sidebar-user">
<!-- Photo de profil : un clic ouvre la galerie sur mobile, l'explorateur sur ordinateur. -->
<button type="button" class="avatar-btn" id="avatar-btn" title="Changer ma photo" aria-label="Changer ma photo de profil">
<div class="sidebar-avatar" id="sidebar-avatar">?</div>
<span class="avatar-cam" aria-hidden="true">📷</span>
<span class="avatar-spin" id="avatar-spin" hidden></span>
</button>
<input type="file" id="avatar-input" accept="image/*" hidden>
<div>
<strong id="sidebar-name">Chargement...</strong>
<small id="sidebar-email"></small>
</div>
</div>
<nav class="sidebar-nav">
<a href="#profil" class="sidebar-link" data-tab="profil">👤 Mon profil</a>
<a href="#mes-programmes" class="sidebar-link active" data-tab="mes-programmes">🏋️ Mes programmes</a>
<a href="#progression" class="sidebar-link" data-tab="progression">📈 Ma progression</a>
<a href="#creneaux" class="sidebar-link" data-tab="creneaux">📅 Mes créneaux</a>
</nav>
<button class="sidebar-logout" id="sidebar-logout">🚪 Déconnexion</button>
</aside>

<!-- Contenu principal -->
<div class="dashboard-content">

<!-- Mes programmes -->
<div class="dash-panel active" id="panel-mes-programmes">
<div class="dash-panel-header">
<h2>Mes programmes</h2>
<a href="/programmes" class="btn btn-gold-outline btn-sm">+ Découvrir</a>
</div>
<div id="mes-programmes-list" class="loader"><div class="spinner"></div></div>
</div>

<!-- Progression -->
<div class="dash-panel" id="panel-progression">
<div class="dash-panel-header">
<h2>Ma progression</h2>
</div>
<div id="progression-content" class="loader"><div class="spinner"></div></div>
</div>

<!-- Créneaux -->
<div class="dash-panel" id="panel-creneaux">
<div class="dash-panel-header">
<h2>Mes créneaux réservés</h2>
<a href="/offres" class="btn btn-gold-outline btn-sm">Réserver</a>
</div>
<div id="creneaux-content" class="loader"><div class="spinner"></div></div>
</div>

<!-- Profil -->
<div class="dash-panel" id="panel-profil">
<div class="dash-panel-header">
<h2>Mon profil</h2>
</div>
<form id="profil-form" class="profil-form">
<div class="alert alert-success" id="profil-alert"></div>

<div class="form-section-title">Identité</div>
<div class="form-row">
<div class="form-group">
<label>Prénom</label>
<input type="text" id="profil-prenom" placeholder="Ton prénom" />
</div>
<div class="form-group">
<label>Nom</label>
<input type="text" id="profil-nom" placeholder="Ton nom" />
</div>
</div>

<div class="form-row">
<div class="form-group">
<label>Email</label>
<input type="email" id="profil-email" disabled />
</div>
<div class="form-group">
<label>Téléphone</label>
<input type="tel" id="profil-telephone" placeholder="+33 6 xx xx xx xx" />
</div>
</div>

<div class="form-row">
<div class="form-group">
<label>Date de naissance</label>
<input type="date" id="profil-date-naissance" />
</div>
<div class="form-group">
<label>Genre</label>
<select id="profil-gender">
<option value="">Sélectionner</option>
<option value="homme">Homme</option>
<option value="femme">Femme</option>
</select>
</div>
</div>

<div class="form-section-title" style="margin-top:28px">Adresse</div>
<div class="form-group">
<label>Adresse complète</label>
<input type="text" id="profil-adresse" placeholder="12 rue de la Paix, 75001 Paris" />
</div>

<div class="form-section-title" style="margin-top:28px">Informations physiques</div>
<div class="form-row">
<div class="form-group">
<label>Poids (kg)</label>
<input type="number" id="profil-weight" placeholder="70" min="30" max="250" step="0.5" />
</div>
<div class="form-group">
<label>Taille (cm)</label>
<input type="number" id="profil-height" placeholder="175" min="100" max="250" />
</div>
</div>

<div class="form-section-title" style="margin-top:28px">Notes &amp; Objectifs</div>
<div class="form-group">
<label>Notes personnelles <span style="font-weight:400;color:var(--white-muted,#9aa3b5)">(blessures, contraintes, objectifs précis…)</span></label>
<textarea id="profil-notes" rows="4" placeholder="Ex : tendinite au genou droit, objectif marathon en octobre, régime végétarien..."></textarea>
</div>

<div style="margin-top:28px">
<button type="submit" class="btn btn-primary">Enregistrer le profil</button>
</div>
</form>
</div>

</div>
</div>
</main>
<div id="footer-placeholder"></div>
<script type="module" src="/js/dashboard.js"></script>
</body>
</html>
