<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réservation confirmée — Taya Fitness</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <style>
    .confirm-wrap {
      max-width: 540px;
      margin: 0 auto;
      padding: 60px 0 80px;
    }
    .confirm-card {
      background: #0d1b2a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 40px 36px;
      text-align: center;
    }
    .confirm-icon {
      width: 72px;
      height: 72px;
      background: rgba(254,0,229,0.10);
      border: 2px solid rgba(254,0,229,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 24px;
    }
    .confirm-card h1 {
      font-size: 26px;
      font-weight: 800;
      color: #f0f4f8;
      margin: 0 0 8px;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    }
    .confirm-card p.sub {
      font-size: 14px;
      color: rgba(220,232,244,0.50);
      line-height: 1.7;
      margin: 0 0 28px;
    }
    .booking-box {
      background: #122033;
      border: 1px solid rgba(254,0,229,0.20);
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
      margin-bottom: 28px;
    }
    .booking-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
    }
    .booking-row:last-child { border-bottom: none; }
    .booking-row span:first-child { color: rgba(220,232,244,0.50); }
    .booking-row span:last-child  { color: #f0f4f8; font-weight: 600; }
    .cal-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #f0f4f8;
      text-align: left;
      margin-bottom: 12px;
    }
    .cal-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn-gcal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #1a73e8;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn-gcal:hover { background: #1557b0; }
    .btn-ics {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      color: #f0f4f8;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn-ics:hover { background: rgba(255,255,255,0.10); }
    .btn-dash {
      width: 100%;
      justify-content: center;
      margin-bottom: 16px;
    }
    .email-note {
      font-size: 12px;
      color: rgba(220,232,244,0.28);
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main>
    <section class="section">
      <div class="container">
        <div class="confirm-wrap">
          <div class="confirm-card">

            <div class="confirm-icon">✅</div>
            <h1>Réservation confirmée !</h1>
            <p class="sub">Ton paiement a bien été reçu.<br/>Un email de confirmation t'a été envoyé.</p>

            <div class="booking-box">
              <div class="booking-row"><span>Lieu</span><span id="conf-lieu">—</span></div>
              <div class="booking-row"><span>Date</span><span id="conf-date">—</span></div>
              <div class="booking-row"><span>Heure</span><span id="conf-heure">—</span></div>
              <div class="booking-row"><span>Durée</span><span>60 minutes</span></div>
              <div class="booking-row"><span>Montant payé</span><span style="color:#fe00e5;font-weight:800;">69 €</span></div>
            </div>

            <p class="cal-section-title">Ajouter à mon calendrier</p>
            <div class="cal-btns">
              <a id="btn-gcal" class="btn-gcal" target="_blank" rel="noopener noreferrer">
                📅 Google Agenda (Android)
              </a>
              <button id="btn-ics" class="btn-ics">
                📱 Télécharger .ics (iPhone / Apple Agenda)
              </button>
            </div>

            <a href="/dashboard" class="btn btn-primary btn-dash">Voir mes réservations →</a>
            <p class="email-note">Des questions ? Réponds directement à l'email de confirmation.</p>

          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module">
    import { initNavbar } from '/js/navbar.js';
    import { initFooter } from '/js/footer.js';

    document.addEventListener('DOMContentLoaded', () => {
      initNavbar();
      initFooter();

      const bookingRaw = sessionStorage.getItem('taya_booking');
      const booking    = bookingRaw ? JSON.parse(bookingRaw) : null;

      if (booking) {
        document.getElementById('conf-lieu').textContent  = booking.label     || '—';
        document.getElementById('conf-date').textContent  = booking.date_label || booking.date || '—';
        document.getElementById('conf-heure').textContent = booking.heure     || '—';

        // Google Calendar link
        const start  = new Date(booking.date_heure);
        const end    = new Date(start.getTime() + 60 * 60 * 1000);
        const fmtCal = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

        document.getElementById('btn-gcal').href =
          'https://calendar.google.com/calendar/render?action=TEMPLATE' +
          '&text=' + encodeURIComponent('Séance découverte — Taya Fitness') +
          '&dates=' + fmtCal(start) + '/' + fmtCal(end) +
          '&details=' + encodeURIComponent('Coaching individuel avec Sarah, coach sportive certifiée\n' + (booking.address || '')) +
          '&location=' + encodeURIComponent(booking.address || '');

        // ICS download (iPhone / Apple Calendar)
        document.getElementById('btn-ics')?.addEventListener('click', () => {
          const icsLines = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//Taya Fitness//FR',
            'METHOD:PUBLISH',
            'BEGIN:VEVENT',
            'DTSTART:' + fmtCal(start),
            'DTEND:'   + fmtCal(end),
            'SUMMARY:Séance découverte - Taya Fitness',
            'DESCRIPTION:Coaching individuel avec Sarah - Coach sportive certifiée',
            'LOCATION:' + (booking.address || '').replace(/,/g, '\\,'),
            'STATUS:CONFIRMED',
            'DTSTAMP:' + fmtCal(new Date()),
            'END:VEVENT',
            'END:VCALENDAR',
          ];

          const blob = new Blob([icsLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          a.href     = url;
          a.download = 'rdv-taya-fitness.ics';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      }

      // Nettoyer sessionStorage après 30 min (laisser le temps de télécharger l'ICS)
      setTimeout(() => sessionStorage.removeItem('taya_booking'), 30 * 60 * 1000);
    });
  </script>
</body>
</html>
