<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion / Inscription — Taya Fitness</title>
  <meta name="description" content="Connectez-vous ou créez votre compte Taya Fitness pour accéder à vos programmes personnalisés." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="auth-main">
    <div class="auth-container">

      <!-- Côté gauche : branding -->
      <div class="auth-brand">
        <a href="/" class="auth-logo">Taya<span>Fitness</span></a>
        <h2>Ton espace coaching<br /><em>personnel</em></h2>
        <p>Accède à tes programmes, suis ta progression, réserve tes créneaux.</p>
        <div class="auth-features">
          <div class="auth-feature">✓ Programmes personnalisés</div>
          <div class="auth-feature">✓ Suivi nutrition</div>
          <div class="auth-feature">✓ Réservation de créneaux</div>
          <div class="auth-feature">✓ Messagerie directe avec Sarah</div>
        </div>
      </div>

      <!-- Côté droit : formulaire -->
      <div class="auth-form-wrap">
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Connexion</button>
          <button class="auth-tab" data-tab="signup">Inscription</button>
        </div>

        <!-- Alertes -->
        <div class="alert alert-error"  id="alert-error"></div>
        <div class="alert alert-success" id="alert-success"></div>

        <!-- Formulaire Connexion -->
        <form class="auth-form" id="form-login">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="ton@email.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="login-password">
              Mot de passe
              <button type="button" class="forgot-link" id="forgot-btn">Oublié ?</button>
            </label>
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="btn-login">
            Se connecter
          </button>
        </form>

        <!-- Formulaire Inscription -->
        <form class="auth-form hidden" id="form-signup">
          <div class="form-group">
            <label for="signup-name">Prénom et nom</label>
            <input type="text" id="signup-name" placeholder="Sarah Dupont" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" placeholder="ton@email.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="signup-password">Mot de passe</label>
            <input type="password" id="signup-password" placeholder="8 caractères minimum" required minlength="8" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirmer le mot de passe</label>
            <input type="password" id="signup-confirm" placeholder="••••••••" required autocomplete="new-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="btn-signup">
            Créer mon compte
          </button>
          <p class="auth-cgu">En créant un compte tu acceptes nos <a href="#">CGV</a> et notre <a href="#">politique de confidentialité</a>.</p>
        </form>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module" src="/js/auth-page.js"></script>
</body>
</html>
